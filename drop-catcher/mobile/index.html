<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#0a1628">
    <title>Drop Catcher Mobile - SJWD Water District</title>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        html, body {
            width: 100%;
            height: 100%;
            background: #0a1628;
            overflow: hidden;
            overscroll-behavior: none;
            touch-action: none;
            -webkit-user-select: none;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
            -webkit-text-size-adjust: 100%;
            font-family: 'Press Start 2P', 'Courier New', monospace;
            color: #e0e0e0;
        }

        /* Inset by the safe area so the canvas never sits under a notch or the
           home indicator. Phaser measures this element to size the canvas. */
        #game-container {
            position: fixed;
            top: env(safe-area-inset-top, 0px);
            right: env(safe-area-inset-right, 0px);
            bottom: env(safe-area-inset-bottom, 0px);
            left: env(safe-area-inset-left, 0px);
        }

        #game-container canvas { display: block; touch-action: none; }

        #rotate-notice {
            display: none;
            position: fixed;
            inset: 0;
            background: #0a1628;
            z-index: 500;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 18px;
            padding: 24px;
            text-align: center;
            font-size: 11px;
            line-height: 2;
            color: #7fdbff;
        }

        #rotate-notice .icon { font-size: 40px; }

        /* Short landscape viewports are phones held sideways - the portrait
           playfield would be unreadably small, so ask for a rotate instead. */
        @media (orientation: landscape) and (max-height: 460px) {
            #rotate-notice { display: flex; }
            #game-container { visibility: hidden; }
        }
    </style>
</head>
<body>
    <div id="game-container"></div>

    <div id="rotate-notice">
        <div class="icon">📱</div>
        <div>ROTATE YOUR DEVICE<br>TO PORTRAIT</div>
    </div>

    <script>
        // Block pinch-zoom and double-tap zoom so game taps stay game taps.
        ['gesturestart', 'gesturechange', 'gestureend'].forEach(evt =>
            document.addEventListener(evt, e => e.preventDefault(), { passive: false }));
        document.addEventListener('touchmove', e => {
            if (e.touches.length > 1) e.preventDefault();
        }, { passive: false });
        let lastTouchEnd = 0;
        document.addEventListener('touchend', e => {
            const now = Date.now();
            if (now - lastTouchEnd < 300) e.preventDefault();
            lastTouchEnd = now;
        }, { passive: false });
    </script>
    <script src="https://cdn.jsdelivr.net/npm/phaser@3.60.0/dist/phaser.min.js"></script>
    <script src="game.js"></script>
</body>
</html>
