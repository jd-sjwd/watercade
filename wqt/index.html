// ─────────────────────────────────────────────────────────────────────────────
// BACKDROP (parallax background, ambient particles, lighting overlay)
// Each world has hand-drawn layers rendered once into tileable offscreen
// canvases, then scrolled at different speeds.
// ─────────────────────────────────────────────────────────────────────────────
class Backdrop {
  constructor() {
    this.world = 0;
    this.boss = false;
    this.map = null;
    this.layers = [];
    this.ambient = [];
    this.scale = 0;
    this.vignette = null;
    this.time = 0;
  }

  setWorld(worldIdx, isBoss, map) {
    this.world = worldIdx;
    this.boss = isBoss;
    this.map = map || null;
    this.ambient = [];
    this.layers = [];
    this.scale = 0;
  }

  invalidate() { this.scale = 0; }

  _canvas(w, h, paint) {
    const s = Math.min(RENDER_SCALE, 2);
    const cv = document.createElement('canvas');
    cv.width = Math.ceil(w * s);
    cv.height = Math.ceil(h * s);
    const ctx = cv.getContext('2d');
    ctx.scale(s, s);
    paint(ctx);
    return cv;
  }

  _layer(w, f, yf, paint) {
    const s = Math.min(RENDER_SCALE, 2);
    const cv = document.createElement('canvas');
    cv.width = Math.ceil(w * s);
    cv.height = Math.ceil(C.H * s);
    const ctx = cv.getContext('2d');
    ctx.scale(s, s);
    paint(ctx, w);
    return { cv, w, f, yf, s };
  }

  _build() {
    const s = Math.min(RENDER_SCALE, 2);
    this.scale = s;
    const R = (i, k) => M.hash(i, k, this.world * 13 + 7);
    const W = 1024;
    switch (this.world) {
      case 0: this.layers = this._buildSurface(W, R); break;
      case 1: this.layers = this._buildSewer(W, R); break;
      case 2: this.layers = this._buildPlant(W, R); break;
      default: this.layers = this._buildDusk(W, R); break;
    }
    // Static sky, light-shaft sprite and darkness mask (blitted each frame)
    this.skyCv = this._canvas(C.W, C.H, (ctx) => this._sky(ctx));
    this.shaftCv = null;
    if (this.world === 1 || this.world === 2) {
      this.shaftCv = this._canvas(180, C.H, (ctx) => {
        const col = this.world === 1 ? '120,220,210' : '255,245,200';
        const g = ctx.createLinearGradient(0, 0, 0, C.H);
        g.addColorStop(0, `rgba(${col},0.16)`);
        g.addColorStop(1, `rgba(${col},0)`);
        ctx.fillStyle = g;
        ctx.beginPath();
        if (this.world === 1) { ctx.moveTo(0, 0); ctx.lineTo(60, 0); ctx.lineTo(150, C.H); ctx.lineTo(30, C.H); }
        else { ctx.moveTo(80, 55); ctx.lineTo(100, 55); ctx.lineTo(180, C.H); ctx.lineTo(0, C.H); }
        ctx.fill();
      });
    }
    const th = THEMES[this.world] || THEMES[0];
    const dark = th.dark + (this.boss ? 0.12 : 0);
    this.darkCv = null;
    if (dark > 0) {
      this.darkCv = this._canvas(C.W * 2, C.H * 2, (ctx) => {
        const g = ctx.createRadialGradient(C.W, C.H, 70, C.W, C.H, 400);
        g.addColorStop(0, 'rgba(2,8,14,0)');
        g.addColorStop(1, `rgba(2,8,14,${dark})`);
        ctx.fillStyle = g;
        ctx.fillRect(0, 0, C.W * 2, C.H * 2);
      });
    }
    // Vignette
    const v = document.createElement('canvas');
    v.width = Math.ceil(C.W * s); v.height = Math.ceil(C.H * s);
    const vc = v.getContext('2d');
    vc.scale(s, s);
    const g = vc.createRadialGradient(C.W / 2, C.H / 2, C.H * 0.35, C.W / 2, C.H / 2, C.W * 0.72);
    g.addColorStop(0, 'rgba(0,0,0,0)');
    g.addColorStop(1, 'rgba(0,0,0,0.5)');
    vc.fillStyle = g;
    vc.fillRect(0, 0, C.W, C.H);
    this.vignette = v;
  }

  // ── World 0: sunny town skyline with the SJWD water tower ────────────────
  _buildSurface(W, R) {
    const clouds = this._layer(W, 0.06, 0, (ctx) => {
      for (let i = 0; i < 7; i++) {
        const x = R(i, 1) * W, y = 40 + R(i, 2) * 140, sc = 0.6 + R(i, 3) * 0.9;
        ctx.fillStyle = 'rgba(255,255,255,0.92)';
        for (let k = 0; k < 5; k++) {
          ctx.beginPath();
          ctx.arc(x + (k - 2) * 18 * sc, y - Math.sin((k / 4) * Math.PI) * 12 * sc, (14 + Math.sin(k * 1.7) * 4) * sc, 0, Math.PI * 2);
          ctx.fill();
        }
        ctx.fillStyle = 'rgba(190,215,235,0.7)';
        ctx.fillRect(x - 46 * sc, y + 2 * sc, 92 * sc, 6 * sc);
      }
    });
    const hills = this._layer(W, 0.15, 0.1, (ctx) => {
      ctx.fillStyle = '#8fc6a3';
      ctx.beginPath(); ctx.moveTo(0, C.H);
      for (let x = 0; x <= W; x += 8) ctx.lineTo(x, 330 - Math.sin(x / W * Math.PI * 4) * 28 - Math.sin(x / W * Math.PI * 10) * 8);
      ctx.lineTo(W, C.H); ctx.fill();
      ctx.fillStyle = '#74b08c';
      ctx.beginPath(); ctx.moveTo(0, C.H);
      for (let x = 0; x <= W; x += 8) ctx.lineTo(x, 370 - Math.sin(x / W * Math.PI * 6 + 1) * 22);
      ctx.lineTo(W, C.H); ctx.fill();
    });
    const town = this._layer(W, 0.3, 0.2, (ctx) => {
      const base = 420;
      for (let i = 0; i < 16; i++) {
        const x = i * 64 + R(i, 4) * 20, bw = 34 + R(i, 5) * 30, bh = 40 + R(i, 6) * 70;
        ctx.fillStyle = R(i, 7) < 0.5 ? '#7d9bb4' : '#6f8ca6';
        ctx.fillRect(x, base - bh, bw, bh);
        ctx.fillStyle = '#8eacc4';
        ctx.fillRect(x, base - bh, bw, 3);
        if (R(i, 8) < 0.4) { // pitched roof
          ctx.fillStyle = '#5f7a92';
          ctx.beginPath(); ctx.moveTo(x - 3, base - bh); ctx.lineTo(x + bw / 2, base - bh - 16); ctx.lineTo(x + bw + 3, base - bh); ctx.fill();
        }
        ctx.fillStyle = 'rgba(230,242,250,0.6)';
        for (let wy = base - bh + 8; wy < base - 8; wy += 11)
          for (let wx = x + 5; wx < x + bw - 6; wx += 9) ctx.fillRect(wx, wy, 4, 5);
      }
      // SJWD water tower
      const tx = 700;
      ctx.strokeStyle = '#5c7891'; ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.moveTo(tx - 22, base); ctx.lineTo(tx - 12, base - 110);
      ctx.moveTo(tx + 22, base); ctx.lineTo(tx + 12, base - 110);
      ctx.moveTo(tx - 18, base - 40); ctx.lineTo(tx + 18, base - 80);
      ctx.moveTo(tx + 18, base - 40); ctx.lineTo(tx - 18, base - 80);
      ctx.stroke();
      const tg = ctx.createLinearGradient(tx - 40, 0, tx + 40, 0);
      tg.addColorStop(0, '#6f97ba'); tg.addColorStop(0.35, '#d7e8f5'); tg.addColorStop(1, '#5d86aa');
      ctx.fillStyle = tg;
      ctx.beginPath(); ctx.ellipse(tx, base - 132, 42, 30, 0, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#5d86aa';
      ctx.beginPath(); ctx.moveTo(tx - 30, base - 158); ctx.lineTo(tx, base - 178); ctx.lineTo(tx + 30, base - 158); ctx.fill();
      ctx.fillStyle = '#1a5c96';
      ctx.font = "bold 15px 'Courier New', monospace";
      ctx.textAlign = 'center';
      ctx.fillText('SJWD', tx, base - 127);
      // Steeple
      ctx.fillStyle = '#6a879f';
      ctx.fillRect(300, base - 120, 18, 120);
      ctx.beginPath(); ctx.moveTo(296, base - 120); ctx.lineTo(309, base - 165); ctx.lineTo(322, base - 120); ctx.fill();
    });
    const trees = this._layer(W, 0.55, 0.35, (ctx) => {
      for (let i = 0; i < 22; i++) {
        const x = i * 48 + R(i, 9) * 30, y = 470 - R(i, 10) * 20, r = 18 + R(i, 11) * 16;
        ctx.fillStyle = '#4c8a5c';
        ctx.fillRect(x - 3, y, 6, 60);
        ctx.fillStyle = R(i, 12) < 0.5 ? '#3f8a57' : '#4e9a62';
        ctx.beginPath(); ctx.arc(x, y - r * 0.4, r, 0, Math.PI * 2); ctx.fill();
        ctx.beginPath(); ctx.arc(x - r * 0.6, y, r * 0.7, 0, Math.PI * 2); ctx.fill();
        ctx.beginPath(); ctx.arc(x + r * 0.6, y, r * 0.7, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = 'rgba(255,255,255,0.12)';
        ctx.beginPath(); ctx.arc(x - r * 0.3, y - r * 0.8, r * 0.45, 0, Math.PI * 2); ctx.fill();
      }
      ctx.fillStyle = '#3d7a4f';
      ctx.fillRect(0, 485, W, C.H - 485);
      const hz = ctx.createLinearGradient(0, 300, 0, C.H);
      hz.addColorStop(0, 'rgba(220,240,250,0)'); hz.addColorStop(1, 'rgba(220,240,250,0.25)');
      ctx.fillStyle = hz; ctx.fillRect(0, 300, W, C.H - 300);
    });
    return [clouds, hills, town, trees];
  }

  // ── World 1: brick sewer with arches and background pipes ────────────────
  _buildSewer(W, R) {
    const wall = this._layer(W, 0.2, 0.15, (ctx) => {
      for (let y = 0; y < C.H; y += 12) {
        const off = (y / 12) % 2 ? 12 : 0;
        for (let x = -24; x < W; x += 24) {
          const h = R(x + off, y);
          ctx.fillStyle = h < 0.5 ? '#142430' : h < 0.85 ? '#172a37' : '#1b313f';
          ctx.fillRect(x + off + 1, y + 1, 22, 10);
        }
      }
      for (let i = 0; i < 4; i++) { // arched alcoves
        const x = i * 256 + 60, aw = 120;
        ctx.fillStyle = '#081219';
        ctx.beginPath(); ctx.moveTo(x, C.H); ctx.lineTo(x, 260); ctx.arc(x + aw / 2, 260, aw / 2, Math.PI, 0); ctx.lineTo(x + aw, C.H); ctx.fill();
        ctx.strokeStyle = '#24404f'; ctx.lineWidth = 6;
        ctx.beginPath(); ctx.moveTo(x, C.H); ctx.lineTo(x, 260); ctx.arc(x + aw / 2, 260, aw / 2, Math.PI, 0); ctx.lineTo(x + aw, C.H); ctx.stroke();
        ctx.fillStyle = 'rgba(70,200,190,0.06)';
        ctx.fillRect(x + 8, 300, aw - 16, C.H - 300);
      }
    });
    const pipes = this._layer(W, 0.45, 0.3, (ctx) => {
      const pipe = (x, y, w, hh, vert) => {
        const g = vert ? ctx.createLinearGradient(x, 0, x + w, 0) : ctx.createLinearGradient(0, y, 0, y + hh);
        g.addColorStop(0, '#0f3a36'); g.addColorStop(0.3, '#2c6e66'); g.addColorStop(1, '#0d302c');
        ctx.fillStyle = g; ctx.fillRect(x, y, w, hh);
      };
      pipe(0, 96, W, 22, false);
      pipe(0, 150, W, 14, false);
      for (let i = 0; i < 6; i++) {
        const x = 70 + i * 170 + R(i, 3) * 40;
        pipe(x, 0, 18, 420, true);
        ctx.fillStyle = '#123f3a';
        for (let y = 60; y < 420; y += 90) ctx.fillRect(x - 3, y, 24, 6);
        if (R(i, 4) < 0.6) { // valve wheel
          ctx.strokeStyle = '#7a3a33'; ctx.lineWidth = 3;
          ctx.beginPath(); ctx.arc(x + 9, 250, 11, 0, Math.PI * 2); ctx.stroke();
          ctx.beginPath(); ctx.moveTo(x - 2, 250); ctx.lineTo(x + 20, 250); ctx.moveTo(x + 9, 239); ctx.lineTo(x + 9, 261); ctx.stroke();
        }
      }
      for (let i = 0; i < 5; i++) { // grates letting light in
        const x = 40 + i * 210;
        ctx.fillStyle = '#2b4655';
        ctx.fillRect(x, 0, 60, 10);
        ctx.fillStyle = '#9fd4d0';
        for (let k = 0; k < 5; k++) ctx.fillRect(x + 4 + k * 11, 2, 6, 6);
      }
    });
    return [wall, pipes];
  }

  // ── World 2: treatment plant interior, clarifier tanks and big windows ───
  _buildPlant(W, R) {
    const hall = this._layer(W, 0.15, 0.1, (ctx) => {
      for (let i = 0; i < 5; i++) { // tall windows
        const x = 30 + i * 205;
        const g = ctx.createLinearGradient(0, 40, 0, 300);
        g.addColorStop(0, '#9fe3f2'); g.addColorStop(1, '#4fa6bd');
        ctx.fillStyle = '#25485a';
        ctx.fillRect(x - 6, 34, 132, 270);
        ctx.fillStyle = g;
        ctx.fillRect(x, 40, 120, 258);
        ctx.fillStyle = '#25485a';
        for (let k = 1; k < 4; k++) ctx.fillRect(x + k * 30 - 2, 40, 4, 258);
        for (let k = 1; k < 5; k++) ctx.fillRect(x, 40 + k * 52 - 2, 120, 4);
        ctx.fillStyle = 'rgba(255,255,255,0.25)';
        ctx.beginPath(); ctx.moveTo(x + 10, 298); ctx.lineTo(x + 60, 40); ctx.lineTo(x + 80, 40); ctx.lineTo(x + 30, 298); ctx.fill();
      }
    });
    const tanks = this._layer(W, 0.32, 0.25, (ctx) => {
      for (let i = 0; i < 3; i++) {
        const x = 60 + i * 340, w = 220, top = 250;
        const g = ctx.createLinearGradient(x, 0, x + w, 0);
        g.addColorStop(0, '#5b7f8f'); g.addColorStop(0.35, '#a9c7d3'); g.addColorStop(1, '#4a6a79');
        ctx.fillStyle = g;
        ctx.beginPath(); ctx.roundRect(x, top, w, 300, 18); ctx.fill();
        ctx.fillStyle = '#7fa3b2';
        ctx.beginPath(); ctx.ellipse(x + w / 2, top, w / 2, 16, 0, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = '#5fc9d8';
        ctx.beginPath(); ctx.ellipse(x + w / 2, top + 2, w / 2 - 12, 10, 0, 0, Math.PI * 2); ctx.fill();
        ctx.strokeStyle = '#3f5f6d'; ctx.lineWidth = 2;
        for (let y = top + 40; y < C.H; y += 50) { ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x + w, y); ctx.stroke(); }
        ctx.strokeStyle = '#2f4a56'; ctx.lineWidth = 2; // ladder
        ctx.beginPath(); ctx.moveTo(x + w - 30, top); ctx.lineTo(x + w - 30, C.H); ctx.moveTo(x + w - 18, top); ctx.lineTo(x + w - 18, C.H); ctx.stroke();
        for (let y = top + 8; y < C.H; y += 12) { ctx.beginPath(); ctx.moveTo(x + w - 30, y); ctx.lineTo(x + w - 18, y); ctx.stroke(); }
        ctx.fillStyle = '#1a4f66';
        ctx.font = "bold 12px 'Courier New', monospace";
        ctx.textAlign = 'center';
        ctx.fillText(['CLARIFIER 1', 'FILTER BAY', 'CLEARWELL'][i], x + w / 2, top + 70);
      }
    });
    const rails = this._layer(W, 0.5, 0.35, (ctx) => {
      const cols = ['#7b5bc4', '#2f86c9', '#2ecc71'];
      for (let k = 0; k < 3; k++) {
        const y = 120 + k * 26;
        const g = ctx.createLinearGradient(0, y, 0, y + 12);
        g.addColorStop(0, cols[k]); g.addColorStop(0.4, '#ffffff'); g.addColorStop(1, cols[k]);
        ctx.globalAlpha = 0.55;
        ctx.fillStyle = g;
        ctx.fillRect(0, y, W, 12);
        ctx.globalAlpha = 1;
        for (let x = 40 + k * 60; x < W; x += 200) {
          ctx.fillStyle = '#dfe7ec';
          ctx.beginPath(); ctx.arc(x, y + 6, 7, 0, Math.PI * 2); ctx.fill();
          ctx.strokeStyle = '#d63b2f'; ctx.lineWidth = 1.5;
          ctx.beginPath(); ctx.moveTo(x, y + 6); ctx.lineTo(x + 4, y + 2); ctx.stroke();
        }
      }
      for (let i = 0; i < 6; i++) { // hanging lamps
        const x = 80 + i * 170;
        ctx.strokeStyle = '#30424c'; ctx.lineWidth = 1.5;
        ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, 40); ctx.stroke();
        ctx.fillStyle = '#30424c';
        ctx.beginPath(); ctx.moveTo(x - 14, 52); ctx.lineTo(x - 6, 40); ctx.lineTo(x + 6, 40); ctx.lineTo(x + 14, 52); ctx.fill();
        ctx.fillStyle = '#fff6c9';
        ctx.fillRect(x - 10, 52, 20, 3);
      }
    });
    return [hall, tanks, rails];
  }

  // ── World 3: dusk skyline, towers and pipeline trestles ──────────────────
  _buildDusk(W, R) {
    const city = this._layer(W, 0.12, 0.08, (ctx) => {
      ctx.fillStyle = '#3a2547';
      for (let i = 0; i < 26; i++) {
        const x = i * 40 + R(i, 1) * 10, bw = 26 + R(i, 2) * 30, bh = 60 + R(i, 3) * 140;
        ctx.fillRect(x, 420 - bh, bw, bh + 140);
        ctx.fillStyle = '#ffd27a';
        for (let wy = 420 - bh + 8; wy < 410; wy += 10)
          for (let wx = x + 4; wx < x + bw - 4; wx += 7) if (R(wx, wy) < 0.3) ctx.fillRect(wx, wy, 3, 4);
        ctx.fillStyle = '#3a2547';
      }
    });
    const towers = this._layer(W, 0.3, 0.2, (ctx) => {
      ctx.strokeStyle = '#2a1830'; ctx.fillStyle = '#2a1830';
      for (let i = 0; i < 3; i++) { // power pylons
        const x = 120 + i * 340;
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.moveTo(x - 30, 470); ctx.lineTo(x - 6, 220); ctx.lineTo(x + 6, 220); ctx.lineTo(x + 30, 470);
        for (let y = 260; y < 470; y += 40) { ctx.moveTo(x - 6 - (y - 220) * 0.1, y); ctx.lineTo(x + 6 + (y - 260) * 0.1, y + 40); }
        ctx.moveTo(x - 40, 240); ctx.lineTo(x + 40, 240); ctx.moveTo(x - 30, 270); ctx.lineTo(x + 30, 270);
        ctx.stroke();
        ctx.lineWidth = 1;
        ctx.beginPath(); ctx.moveTo(x + 40, 242); ctx.quadraticCurveTo(x + 210, 290, x + 300, 242); ctx.stroke();
      }
      // Pipeline trestle
      ctx.fillStyle = '#2a1830';
      ctx.fillRect(0, 380, W, 16);
      for (let x = 20; x < W; x += 90) {
        ctx.fillRect(x, 396, 6, 90);
        ctx.beginPath(); ctx.moveTo(x + 3, 396); ctx.lineTo(x - 20, 480); ctx.lineTo(x - 14, 480); ctx.lineTo(x + 6, 404); ctx.fill();
      }
      // Water tank on stilts
      ctx.fillRect(560, 250, 90, 70);
      ctx.beginPath(); ctx.moveTo(555, 250); ctx.lineTo(605, 226); ctx.lineTo(655, 250); ctx.fill();
      for (const x of [568, 600, 636]) ctx.fillRect(x, 320, 5, 160);
    });
    const fence = this._layer(W, 0.55, 0.35, (ctx) => {
      ctx.fillStyle = '#1e1224';
      ctx.fillRect(0, 470, W, C.H - 470);
      ctx.strokeStyle = 'rgba(30,18,36,0.9)'; ctx.lineWidth = 1;
      for (let x = 0; x < W; x += 8) {
        ctx.beginPath(); ctx.moveTo(x, 420); ctx.lineTo(x + 30, 470); ctx.moveTo(x + 30, 420); ctx.lineTo(x, 470); ctx.stroke();
      }
      ctx.fillStyle = '#1e1224';
      for (let x = 0; x < W; x += 64) ctx.fillRect(x, 410, 4, 60);
      ctx.fillRect(0, 410, W, 3);
    });
    return [city, towers, fence];
  }

  _sky(ctx) {
    let g;
    switch (this.world) {
      case 0:
        g = ctx.createLinearGradient(0, 0, 0, C.H);
        g.addColorStop(0, '#3d9be0'); g.addColorStop(0.65, '#a9daf3'); g.addColorStop(1, '#d9f0f8');
        ctx.fillStyle = g; ctx.fillRect(0, 0, C.W, C.H);
        { // sun
          const sg = ctx.createRadialGradient(620, 90, 10, 620, 90, 120);
          sg.addColorStop(0, 'rgba(255,250,220,1)'); sg.addColorStop(0.2, 'rgba(255,240,180,0.7)'); sg.addColorStop(1, 'rgba(255,240,180,0)');
          ctx.fillStyle = sg; ctx.fillRect(500, 0, 240, 220);
        }
        break;
      case 1:
        g = ctx.createLinearGradient(0, 0, 0, C.H);
        g.addColorStop(0, '#08141c'); g.addColorStop(1, '#10303a');
        ctx.fillStyle = g; ctx.fillRect(0, 0, C.W, C.H);
        break;
      case 2:
        g = ctx.createLinearGradient(0, 0, 0, C.H);
        g.addColorStop(0, '#1b3a4a'); g.addColorStop(1, '#2d5f6e');
        ctx.fillStyle = g; ctx.fillRect(0, 0, C.W, C.H);
        break;
      default:
        g = ctx.createLinearGradient(0, 0, 0, C.H);
        g.addColorStop(0, '#24163f'); g.addColorStop(0.45, '#7a2f4d'); g.addColorStop(0.75, '#d0602f'); g.addColorStop(1, '#f3a65a');
        ctx.fillStyle = g; ctx.fillRect(0, 0, C.W, C.H);
        { // setting sun
          const sg = ctx.createRadialGradient(400, 420, 20, 400, 420, 200);
          sg.addColorStop(0, 'rgba(255,220,150,0.95)'); sg.addColorStop(0.25, 'rgba(255,170,90,0.5)'); sg.addColorStop(1, 'rgba(255,150,80,0)');
          ctx.fillStyle = sg; ctx.fillRect(200, 220, 400, 320);
        }
    }
  }

  update(dt, camera) {
    this.time += dt;
    // Ambient particles: spawn around the view in world space
    const cx = camera.x, cy = camera.y;
    const kind = ['pollen', 'drip', 'sparkle', 'ember'][this.world] || 'pollen';
    const max = kind === 'drip' ? 22 : 30;
    if (this.ambient.length < max && Math.random() < 0.35) {
      if (kind === 'drip' && this.map) {
        const c = Math.floor((cx + Math.random() * C.W) / TS);
        for (let r = 0; r < 4; r++) {
          if (Phys.solid(this.map.get(c, r)) && !Phys.solid(this.map.get(c, r + 1))) {
            this.ambient.push({ x: c * TS + 6 + Math.random() * 20, y: (r + 1) * TS + 2, vx: 0, vy: 0, life: 4, kind, wait: Math.random() * 1.5 });
            break;
          }
        }
      } else if (kind !== 'drip') {
        const x = cx + Math.random() * C.W, y = cy + Math.random() * C.H;
        const p = { x, y, life: 3 + Math.random() * 3, kind, ph: Math.random() * 6 };
        if (kind === 'pollen')  { p.vx = 0.25 + Math.random() * 0.3; p.vy = -0.05; }
        if (kind === 'sparkle') { p.vx = 0; p.vy = -0.25 - Math.random() * 0.3; }
        if (kind === 'ember')   { p.vx = 0.3 * (Math.random() - 0.3); p.vy = -0.4 - Math.random() * 0.4; }
        p.max = p.life;
        this.ambient.push(p);
      }
    }
    for (const p of this.ambient) {
      if (p.kind === 'drip') {
        if (p.wait > 0) { p.wait -= dt; continue; }
        p.vy = Math.min(p.vy + 0.35, 9);
        p.y += p.vy;
        if (this.map && Phys.solid(this.map.get(Math.floor(p.x / TS), Math.floor(p.y / TS)))) p.life = 0;
        if (this.map && this.map.get(Math.floor(p.x / TS), Math.floor(p.y / TS)) === C.T.WATER) p.life = 0;
      } else {
        p.x += p.vx + Math.sin(this.time * 1.5 + p.ph) * 0.2;
        p.y += p.vy;
      }
      p.life -= dt;
    }
    this.ambient = this.ambient.filter(p => p.life > 0 && p.x > cx - 100 && p.x < cx + C.W + 100);
  }

  draw(ctx, camX, camY, time) {
    if (this.scale !== Math.min(RENDER_SCALE, 2)) this._build();
    ctx.drawImage(this.skyCv, 0, 0, C.W, C.H);
    for (const L of this.layers) {
      let off = camX * L.f;
      if (this.world === 0 && L === this.layers[0]) off += time * 6; // drifting clouds
      off = ((off % L.w) + L.w) % L.w;
      const y = -camY * L.yf;
      for (let x = -off; x < C.W; x += L.w) ctx.drawImage(L.cv, x, y, L.w, C.H);
    }
    if (this.shaftCv) {
      const f = this.world === 1 ? 0.45 : 0.5, spacing = this.world === 1 ? 210 : 170;
      const x0 = this.world === 1 ? 70 : 0;
      const off = ((camX * f) % spacing + spacing) % spacing;
      ctx.save();
      ctx.globalCompositeOperation = 'lighter';
      for (let k = -1; k < 6; k++) {
        ctx.globalAlpha = 0.75 + 0.25 * Math.sin(time * 1.3 + k * 2.1);
        ctx.drawImage(this.shaftCv, x0 + k * spacing - off, 0, 180, C.H);
      }
      ctx.restore();
    }
  }

  // Ambient particles, darkness/light radius, boss tint and vignette
  drawOverlay(ctx, player, camX, camY, time) {
    ctx.save();
    for (const p of this.ambient) {
      const x = p.x - camX, y = p.y - camY;
      if (p.kind === 'drip') {
        ctx.fillStyle = 'rgba(170,235,255,0.8)';
        ctx.beginPath(); ctx.ellipse(x, y, 1.3, p.wait > 0 ? 1.5 : 2.8, 0, 0, Math.PI * 2); ctx.fill();
      } else {
        const a = Math.min(1, p.life / p.max * 2) * Math.min(1, (p.max - p.life) * 2);
        if (p.kind === 'pollen') { ctx.fillStyle = `rgba(255,250,220,${0.7 * a})`; ctx.fillRect(x, y, 2, 2); }
        else if (p.kind === 'sparkle') { ctx.fillStyle = `rgba(200,250,255,${0.6 * a})`; ctx.beginPath(); ctx.arc(x, y, 1.6, 0, Math.PI * 2); ctx.fill(); }
        else { ctx.fillStyle = `rgba(255,${150 + Math.floor(Math.sin(p.ph + time * 6) * 50)},60,${0.85 * a})`; ctx.fillRect(x, y, 2, 2); }
      }
    }
    ctx.restore();

    if (this.darkCv && player) {
      const px = player.x + player.w / 2 - camX, py = player.y + player.h / 2 - camY;
      ctx.drawImage(this.darkCv, px - C.W, py - C.H, C.W * 2, C.H * 2);
    }
    if (this.boss) {
      const a = 0.08 + 0.05 * Math.sin(time * 2.2);
      ctx.fillStyle = `rgba(120,10,30,${a})`;
      ctx.fillRect(0, 0, C.W, C.H);
    }
    if (this.vignette && !this.darkCv) ctx.drawImage(this.vignette, 0, 0, C.W, C.H);
  }
}

// ─────────────────────────────────────────────────────────────────────────────
// CAMERA
// Smoothed follow with look-ahead in the facing direction and a vertical
// deadzone so small hops don't bob the screen. Positions are updated once per
// fixed step and interpolated at render time.
// ─────────────────────────────────────────────────────────────────────────────
class Camera {
  constructor() {
    this.x = 0; this.y = 0;
    this.px = 0; this.py = 0;
    this.look = 0;
    this.targetY = 0;
    this.shake = 0;
  }

  _bounds(mapW, mapH) {
    return { maxX: Math.max(0, mapW - C.W), maxY: Math.max(0, mapH - C.H) };
  }

  snapTo(player, mapW, mapH) {
    const b = this._bounds(mapW, mapH);
    this.look = player.facing * 40;
    this.x = this.px = M.clamp(player.cx + this.look - C.W / 2, 0, b.maxX);
    this.targetY = player.cy - C.H * 0.58;
    this.y = this.py = M.clamp(this.targetY, 0, b.maxY);
  }

  update(player, mapW, mapH) {
    this.px = this.x; this.py = this.y;
    const b = this._bounds(mapW, mapH);

    const lookGoal = player.dead ? 0 : player.facing * 48 + player.vx * 8;
    this.look += (lookGoal - this.look) * 0.035;
    const tx = M.clamp(player.cx + this.look - C.W / 2, 0, b.maxX);

    // Re-target vertically when grounded/swimming, or when the player leaves the band
    const desired = player.cy - C.H * 0.58;
    const screenY = player.cy - this.y;
    if (player.onGround || player.inWater || screenY < C.H * 0.28 || screenY > C.H * 0.72) {
      this.targetY = desired;
    }
    const ty = M.clamp(this.targetY, 0, b.maxY);

    this.x += (tx - this.x) * 0.11;
    this.y += (ty - this.y) * (screenY > C.H * 0.72 ? 0.2 : 0.07);
    this.shake *= 0.86;
    if (this.shake < 0.2) this.shake = 0;
  }

  addShake(amt) { this.shake = Math.max(this.shake, amt); }

  // Interpolated, shaken view origin for rendering
  view(alpha, time) {
    let x = M.lerp(this.px, this.x, alpha);
    let y = M.lerp(this.py, this.y, alpha);
    if (this.shake > 0) {
      x += Math.sin(time * 91.3) * this.shake;
      y += Math.cos(time * 77.9) * this.shake * 0.8;
    }
    return { x, y };
  }

  // Legacy accessors
  get drawX() { return this.x; }
  get drawY() { return this.y; }
}

// ─────────────────────────────────────────────────────────────────────────────
// UI DRAWING HELPERS
// ─────────────────────────────────────────────────────────────────────────────
const UI = {
  font: (size, bold = true) => `${bold ? 'bold ' : ''}${size}px 'Courier New', monospace`,

  panel(ctx, x, y, w, h, r = 8, fill = 'rgba(8,20,36,0.72)', stroke = 'rgba(120,200,240,0.35)') {
    ctx.beginPath();
    ctx.roundRect(x, y, w, h, r);
    ctx.fillStyle = fill;
    ctx.fill();
    ctx.lineWidth = 1.5;
    ctx.strokeStyle = stroke;
    ctx.stroke();
  },

  // Text with a dark outline so it reads on any background
  text(ctx, str, x, y, { size = 14, color = '#eaf2f8', align = 'left', bold = true, outline = 'rgba(6,14,26,0.9)', ow = 3 } = {}) {
    ctx.font = UI.font(size, bold);
    ctx.textAlign = align;
    if (outline) {
      ctx.lineJoin = 'round';
      ctx.lineWidth = ow;
      ctx.strokeStyle = outline;
      ctx.strokeText(str, x, y);
    }
    ctx.fillStyle = color;
    ctx.fillText(str, x, y);
  },

  droplet(ctx, x, y, s = 1) {
    ctx.save();
    ctx.translate(x, y);
    ctx.scale(s, s);
    ctx.beginPath();
    ctx.moveTo(0, -8);
    ctx.bezierCurveTo(2, -4, 6.5, -0.5, 6.5, 3);
    ctx.bezierCurveTo(6.5, 7, 3.2, 9, 0, 9);
    ctx.bezierCurveTo(-3.2, 9, -6.5, 7, -6.5, 3);
    ctx.bezierCurveTo(-6.5, -0.5, -2, -4, 0, -8);
    const g = ctx.createLinearGradient(-6, -8, 6, 9);
    g.addColorStop(0, '#e6fbff'); g.addColorStop(0.45, '#56cfe1'); g.addColorStop(1, '#1576b5');
    ctx.fillStyle = g;
    ctx.fill();
    ctx.lineWidth = 1.2;
    ctx.strokeStyle = '#0b3f63';
    ctx.stroke();
    ctx.fillStyle = 'rgba(255,255,255,0.9)';
    ctx.beginPath(); ctx.ellipse(-2.4, 2, 1.3, 2.6, 0.3, 0, Math.PI * 2); ctx.fill();
    ctx.restore();
  },

  heart(ctx, x, y, full, s = 1) {
    ctx.save();
    ctx.translate(x, y);
    ctx.scale(s, s);
    ctx.beginPath();
    ctx.moveTo(0, 6);
    ctx.bezierCurveTo(-9, 0, -7, -8, -3.5, -7);
    ctx.bezierCurveTo(-1.5, -6.5, 0, -5, 0, -3.5);
    ctx.bezierCurveTo(0, -5, 1.5, -6.5, 3.5, -7);
    ctx.bezierCurveTo(7, -8, 9, 0, 0, 6);
    ctx.fillStyle = full ? '#ff4d5e' : 'rgba(40,50,64,0.85)';
    ctx.fill();
    ctx.lineWidth = 1.4;
    ctx.strokeStyle = full ? '#5a0f18' : 'rgba(150,170,190,0.6)';
    ctx.stroke();
    if (full) {
      ctx.fillStyle = '#ffd0d5';
      ctx.beginPath(); ctx.ellipse(-3.5, -3.5, 1.7, 1.1, -0.6, 0, Math.PI * 2); ctx.fill();
    }
    ctx.restore();
  },

  clock(ctx, x, y, color) {
    ctx.strokeStyle = color; ctx.lineWidth = 1.6;
    ctx.beginPath(); ctx.arc(x, y, 6, 0, Math.PI * 2); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x, y - 3.8); ctx.moveTo(x, y); ctx.lineTo(x + 2.8, y + 1); ctx.stroke();
  },

  speaker(ctx, x, y, on) {
    ctx.fillStyle = 'rgba(220,235,245,0.75)';
    ctx.beginPath();
    ctx.moveTo(x - 6, y - 2.5); ctx.lineTo(x - 3, y - 2.5); ctx.lineTo(x + 1, y - 6); ctx.lineTo(x + 1, y + 6);
    ctx.lineTo(x - 3, y + 2.5); ctx.lineTo(x - 6, y + 2.5); ctx.closePath(); ctx.fill();
    ctx.strokeStyle = 'rgba(220,235,245,0.75)'; ctx.lineWidth = 1.4;
    if (on) {
      ctx.beginPath(); ctx.arc(x + 2, y, 4, -0.9, 0.9); ctx.stroke();
      ctx.beginPath(); ctx.arc(x + 2, y, 7, -0.9, 0.9); ctx.stroke();
    } else {
      ctx.beginPath(); ctx.moveTo(x + 4, y - 3); ctx.lineTo(x + 9, y + 3); ctx.moveTo(x + 9, y - 3); ctx.lineTo(x + 4, y + 3); ctx.stroke();
    }
  },

  // A row of key-cap hints, e.g. [['ENTER','play'],['ESC','back']]
  keys(ctx, items, cx, y) {
    ctx.font = UI.font(11);
    const parts = items.map(([k, label]) => ({ k, label, kw: ctx.measureText(k).width + 12, lw: ctx.measureText(label).width }));
    const total = parts.reduce((s, p) => s + p.kw + 6 + p.lw + 18, -18);
    let x = cx - total / 2;
    for (const p of parts) {
      ctx.beginPath(); ctx.roundRect(x, y - 12, p.kw, 17, 4);
      ctx.fillStyle = 'rgba(230,240,248,0.92)'; ctx.fill();
      ctx.fillStyle = '#0d2137'; ctx.textAlign = 'left';
      ctx.fillText(p.k, x + 6, y + 1);
      x += p.kw + 6;
      ctx.fillStyle = 'rgba(230,240,248,0.85)';
      ctx.fillText(p.label, x, y + 1);
      x += p.lw + 18;
    }
  },
};

// ─────────────────────────────────────────────────────────────────────────────
// HUD
// ─────────────────────────────────────────────────────────────────────────────
class HUD {
  constructor() {
    this.shownScore = 0;
    this.coinPulse = 0;
    this.lastCoins = 0;
    this.lastHp = 3;
    this.hpShake = 0;
  }

  draw(ctx, game) {
    const pl = game.player;
    if (!pl) return;
    const t = game.time;

    // Animated counters
    this.shownScore += (pl.score - this.shownScore) * 0.2;
    if (Math.abs(pl.score - this.shownScore) < 1) this.shownScore = pl.score;
    if (pl.coins !== this.lastCoins) { this.coinPulse = pl.coins > this.lastCoins ? 1 : 0; this.lastCoins = pl.coins; }
    this.coinPulse *= 0.88;
    if (pl.hp < this.lastHp) this.hpShake = 1;
    this.lastHp = pl.hp;
    this.hpShake *= 0.9;

    // Left: hearts, drops, abilities
    UI.panel(ctx, 10, 10, 168, 50);
    for (let i = 0; i < pl.maxHp; i++) {
      const sh = this.hpShake > 0.05 && i === pl.hp ? Math.sin(t * 60) * 3 * this.hpShake : 0;
      const beat = i < pl.hp && pl.hp === 1 ? 1 + Math.max(0, Math.sin(t * 8)) * 0.12 : 1;
      UI.heart(ctx, 28 + i * 24 + sh, 25, i < pl.hp, 1.15 * beat);
    }
    UI.droplet(ctx, 28, 46, 0.85 + this.coinPulse * 0.35);
    UI.text(ctx, `× ${pl.coins}`, 40, 51, { size: 13 });
    let bx = 112;
    const badge = (type) => {
      ctx.beginPath(); ctx.arc(bx, 46, 8.5, 0, Math.PI * 2);
      ctx.fillStyle = 'rgba(120,220,255,0.18)'; ctx.fill();
      ctx.strokeStyle = 'rgba(160,230,255,0.6)'; ctx.lineWidth = 1; ctx.stroke();
      ctx.save(); ctx.translate(bx, 46.5); drawPowerupIcon(ctx, type, 0.62); ctx.restore();
      bx += 21;
    };
    if (pl.hasDoubleJump) badge('doubleJump');
    if (pl.hasFlippers) badge('flippers');
    if (pl.blaster > 0) { // water cannon with a countdown ring
      const x0 = bx, k = pl.blaster / BLASTER_TIME;
      badge('blaster');
      ctx.strokeStyle = k < 0.25 && Math.floor(t * 8) % 2 ? '#ff6b5a' : '#56cfe1';
      ctx.lineWidth = 2.4;
      ctx.beginPath(); ctx.arc(x0, 46, 10.5, -Math.PI / 2, -Math.PI / 2 + k * Math.PI * 2); ctx.stroke();
    }

    if (!game.bossLevel) this._contaminants(ctx, game);

    // Center: world / level tag
    const world = C.WORLDS[game.worldIdx];
    const isBoss = !!game.bossLevel;
    const tag = isBoss ? `WORLD ${game.worldIdx + 1} · BOSS` : `WORLD ${game.worldIdx + 1}-${game.levelIdx + 1}`;
    UI.panel(ctx, C.W / 2 - 92, 10, 184, 36, 18);
    UI.text(ctx, tag, C.W / 2, 27, { size: 13, align: 'center', color: '#9ff3e4' });
    UI.text(ctx, world.name.toUpperCase(), C.W / 2, 40, { size: 9, align: 'center', color: 'rgba(220,235,245,0.8)', outline: null });

    // Right: score + timer
    UI.panel(ctx, C.W - 178, 10, 168, 50);
    UI.text(ctx, 'SCORE', C.W - 166, 28, { size: 10, color: 'rgba(200,225,240,0.8)', outline: null });
    UI.text(ctx, String(Math.round(this.shownScore)).padStart(7, '0'), C.W - 20, 29, { size: 16, align: 'right' });
    const tl = Math.max(0, Math.ceil(game.levelTimer));
    const low = tl <= 30;
    const tc = low ? (Math.floor(t * 4) % 2 ? '#ff6b5a' : '#ffd0c9') : '#eaf2f8';
    UI.clock(ctx, C.W - 160, 46, tc);
    UI.text(ctx, `${Math.floor(tl / 60)}:${String(tl % 60).padStart(2, '0')}`, C.W - 146, 51, { size: 13, color: tc });
    UI.speaker(ctx, C.W - 28, 46, !game.muted);

    if (isBoss) this._bossBar(ctx, game);
    if (game.paused) this._pause(ctx, game);
  }

  // Contaminants left on the board + arrow to the nearest one off-screen
  _contaminants(ctx, game) {
    const left = game.enemies.length, t = game.time;
    const clear = left === 0;
    UI.panel(ctx, 10, 66, 168, 26, 8, clear ? 'rgba(20,90,50,0.85)' : 'rgba(8,20,36,0.72)',
      clear ? 'rgba(120,255,170,0.7)' : 'rgba(255,140,120,0.5)');
    // mini lead blob
    ctx.fillStyle = clear ? '#7dffb0' : '#9aa5b1';
    ctx.beginPath(); ctx.moveTo(18, 85); ctx.quadraticCurveTo(18, 72, 26, 72); ctx.quadraticCurveTo(34, 72, 34, 85); ctx.closePath(); ctx.fill();
    ctx.strokeStyle = '#141c2b'; ctx.lineWidth = 1; ctx.stroke();
    ctx.fillStyle = clear ? '#0e5a2e' : '#b3241b';
    ctx.fillRect(22, 77, 2, 2); ctx.fillRect(28, 77, 2, 2);
    UI.text(ctx, clear ? 'CLEAR! EXIT OPEN' : `CONTAMINANTS  ${left}`, 42, 84, { size: 11, color: clear ? '#e9fff1' : '#ffd0c9' });
    if (clear || !game.player || game.player.dead) return;

    const cam = game.camera, pl = game.player;
    let best = null, bd = Infinity;
    for (const e of game.enemies) {
      const d = Math.hypot(e.cx - pl.cx, e.cy - pl.cy);
      if (d < bd) { bd = d; best = e; }
    }
    if (!best) return;
    const sx = best.cx - cam.x, sy = best.cy - cam.y;
    if (sx > 0 && sx < C.W && sy > 0 && sy < C.H) return;
    const ax = M.clamp(sx, 34, C.W - 34), ay = M.clamp(sy, 118, C.H - 34);
    const ang = Math.atan2(sy - ay, sx - ax) || (sx < 0 ? Math.PI : 0);
    const pulse = 1 + Math.sin(t * 7) * 0.12;
    ctx.save();
    ctx.translate(ax, ay);
    ctx.fillStyle = 'rgba(8,20,36,0.75)';
    ctx.beginPath(); ctx.arc(0, 0, 15, 0, Math.PI * 2); ctx.fill();
    ctx.rotate(ang);
    ctx.scale(pulse, pulse);
    ctx.fillStyle = '#ff6b5a';
    ctx.strokeStyle = '#141c2b'; ctx.lineWidth = 1.2;
    ctx.beginPath(); ctx.moveTo(13, 0); ctx.lineTo(2, -8); ctx.lineTo(2, 8); ctx.closePath(); ctx.fill(); ctx.stroke();
    ctx.restore();
    ctx.fillStyle = '#c3cbd3';
    ctx.beginPath(); ctx.arc(ax - Math.cos(ang) * 3, ay - Math.sin(ang) * 3, 5, 0, Math.PI * 2); ctx.fill();
  }

  _bossBar(ctx, game) {
    const boss = game.bossLevel.boss;
    if (boss.dead) return;
    const w = 300, x = C.W / 2 - w / 2, y = 54;
    UI.panel(ctx, x - 8, y - 2, w + 16, 30, 8);
    UI.text(ctx, boss.name.toUpperCase(), C.W / 2, y + 10, { size: 10, align: 'center', color: '#ffd0c9', outline: null });
    const k = boss.hp / boss.maxHp;
    ctx.fillStyle = 'rgba(0,0,0,0.5)';
    ctx.beginPath(); ctx.roundRect(x, y + 14, w, 9, 4); ctx.fill();
    const g = ctx.createLinearGradient(x, 0, x + w, 0);
    g.addColorStop(0, '#ff3b2f'); g.addColorStop(1, '#ff9a3c');
    ctx.fillStyle = boss.flash > 0 ? '#ffffff' : g;
    ctx.beginPath(); ctx.roundRect(x, y + 14, Math.max(0, w * k), 9, 4); ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,0.35)';
    ctx.fillRect(x + 2, y + 15, Math.max(0, w * k - 4), 2);
    ctx.fillStyle = 'rgba(8,20,36,0.9)';
    for (const m of [0.34, 0.67]) ctx.fillRect(x + w * m - 1, y + 13, 2, 11);
  }

  _pause(ctx, game) {
    ctx.fillStyle = 'rgba(4,10,20,0.72)';
    ctx.fillRect(0, 0, C.W, C.H);
    const w = 320, h = 250, x = C.W / 2 - w / 2, y = C.H / 2 - h / 2;
    UI.panel(ctx, x, y, w, h, 14, 'rgba(10,28,48,0.95)', 'rgba(120,210,240,0.6)');
    UI.text(ctx, 'PAUSED', C.W / 2, y + 42, { size: 28, align: 'center', color: '#9ff3e4' });
    const opts = ['Resume', 'Restart level', 'Quit to map'];
    opts.forEach((o, i) => {
      const oy = y + 90 + i * 40;
      const sel = i === game.pauseSel;
      if (sel) {
        ctx.beginPath(); ctx.roundRect(x + 40, oy - 20, w - 80, 30, 8);
        ctx.fillStyle = 'rgba(86,207,225,0.25)'; ctx.fill();
        ctx.strokeStyle = 'rgba(160,240,255,0.8)'; ctx.lineWidth = 1.5; ctx.stroke();
        UI.text(ctx, '▶', x + 56, oy, { size: 12, color: '#9ff3e4', outline: null });
      }
      UI.text(ctx, o, C.W / 2, oy, { size: 16, align: 'center', color: sel ? '#ffffff' : 'rgba(210,225,235,0.75)' });
    });
    UI.keys(ctx, [['↑↓', 'choose'], ['ENTER', 'select'], ['P', 'resume']], C.W / 2, y + h - 20);
  }
}

// ─────────────────────────────────────────────────────────────────────────────
// SCREENS (Title, GameOver, LevelClear, WorldClear)
// ─────────────────────────────────────────────────────────────────────────────
class Screens {
  constructor(audio) {
    this.audio = audio;
    this.animTimer = 0;
    this.bg = new Backdrop();
    this.bg.setWorld(0, false, null);
    // Strip of ground for the title scene
    const g = new Tilemap(26, C.LEVEL_H_TILES);
    for (let c = 0; c < 26; c++) for (let r = 14; r < 17; r++) g.set(c, r, C.T.SOLID);
    for (let c = 0; c < 26; c++) g.set(c, 15, c > 3 && c < 20 ? C.T.PIPE_H : C.T.SOLID);
    g.set(15, 15, C.T.LEAD_TILE); g.set(16, 15, C.T.LEAD_TILE);
    g.spawnX = -999; g.exitX = -999; g.exitHidden = true;
    g.setTheme(0);
    this.ground = g;
    this.hero = new Player(0, 0, null, null, null);
    this.hero.onGround = true;
    this.heroM = new Player(0, 0, null, null, null);
    this.heroF = new Player(0, 0, null, null, null);
    this.heroF.gender = 'f';
    this.blob = new LeadDrop(0, 0);
    this.blob.dir = -1;
  }

  update(dt) {
    this.animTimer += dt;
    for (const h of [this.hero, this.heroM, this.heroF]) {
      h.t += dt;
      const a = h.anim;
      a.blinkIn -= dt;
      if (a.blinkIn <= 0) { a.blink = 0.13; a.blinkIn = M.rand(2, 4.5); }
      if (a.blink > 0) a.blink -= dt;
    }
    this.blob.t += dt;
  }

  drawSelect(ctx, sel) {
    const t = this.animTimer;
    this.bg.draw(ctx, 160, 0, t);
    this.ground.draw(ctx, 0, 0, t);
    this.bg.drawOverlay(ctx, null, 0, 0, t);
    UI.text(ctx, 'CHOOSE YOUR WORKER', C.W / 2, 96, { size: 34, align: 'center', color: '#ffffff', outline: '#0b2540', ow: 8 });
    UI.text(ctx, 'Same skills, same gear — pick who you want to play.', C.W / 2, 126, { size: 13, align: 'center' });
    const groundY = 14 * TS;
    [this.heroM, this.heroF].forEach((h, i) => {
      const x = C.W / 2 + (i ? 140 : -140);
      const on = i === sel;
      const hop = on ? Math.max(0, Math.sin(t * 5)) * 16 : 0;
      h.anim.state = on && hop > 1 ? 'jump' : 'idle';
      if (on) {
        ctx.save();
        ctx.globalCompositeOperation = 'lighter';
        const g = ctx.createRadialGradient(x, groundY - 60, 10, x, groundY - 60, 110);
        g.addColorStop(0, 'rgba(255,240,160,0.45)'); g.addColorStop(1, 'rgba(255,240,160,0)');
        ctx.fillStyle = g; ctx.fillRect(x - 110, groundY - 170, 220, 220);
        ctx.restore();
      }
      drawShadow(ctx, x, groundY, on ? 32 - hop * 0.5 : 26);
      ctx.save();
      ctx.globalAlpha = on ? 1 : 0.6;
      ctx.translate(x, groundY - hop);
      const sc = on ? 3 : 2.6;
      ctx.scale(i ? -sc : sc, sc); // face each other
      h._drawBody(ctx);
      ctx.restore();
      UI.panel(ctx, x - 70, groundY + 20, 140, 32, 16, on ? 'rgba(241,196,15,0.95)' : 'rgba(10,28,48,0.8)', on ? '#6b4a00' : 'rgba(120,200,240,0.35)');
      UI.text(ctx, i ? 'FEMALE' : 'MALE', x, groundY + 42, { size: 16, align: 'center', color: on ? '#3a2600' : '#eaf2f8', outline: on ? null : undefined });
      if (on) {
        const ax = Math.sin(t * 6) * 4;
        UI.text(ctx, '▶', x - 96 + ax, groundY + 43, { size: 18, align: 'center', color: '#ffe066' });
        UI.text(ctx, '◀', x + 96 - ax, groundY + 43, { size: 18, align: 'center', color: '#ffe066' });
      }
    });
    UI.panel(ctx, C.W / 2 - 170, 508, 340, 24, 12, 'rgba(10,28,48,0.85)');
    UI.keys(ctx, [['← →', 'choose'], ['ENTER', 'confirm'], ['ESC', 'back']], C.W / 2, 525);
  }

  // Dim + centered card shared by the result screens
  _card(ctx, w, h, accent, dim = 0.6) {
    ctx.fillStyle = `rgba(4,10,20,${dim})`;
    ctx.fillRect(0, 0, C.W, C.H);
    const k = M.easeOutBack(M.clamp(this.animTimer / 0.45, 0, 1));
    const x = C.W / 2 - w / 2, y = C.H / 2 - h / 2;
    ctx.save();
    ctx.translate(C.W / 2, C.H / 2);
    ctx.scale(k, k);
    ctx.translate(-C.W / 2, -C.H / 2);
    UI.panel(ctx, x, y, w, h, 16, 'rgba(10,28,48,0.96)', accent);
    ctx.fillStyle = accent;
    ctx.beginPath(); ctx.roundRect(x, y, w, 6, [16, 16, 0, 0]); ctx.fill();
    return { x, y, done: () => ctx.restore() };
  }

  _confetti(ctx, n = 50) {
    const t = this.animTimer;
    const cols = ['#56cfe1', '#2ecc71', '#f1c40f', '#ff6b5a', '#b48be0', '#ffffff'];
    for (let i = 0; i < n; i++) {
      const sp = 40 + M.hash(i, 1) * 70;
      const x = M.hash(i, 2) * C.W + Math.sin(t * 2 + i) * 18;
      const y = ((M.hash(i, 3) * C.H + t * sp) % (C.H + 20)) - 10;
      ctx.save();
      ctx.translate(x, y);
      ctx.rotate(t * (2 + M.hash(i, 4) * 4) + i);
      ctx.scale(1, Math.cos(t * 5 + i));
      ctx.fillStyle = cols[i % cols.length];
      ctx.fillRect(-3, -1.5, 6, 3);
      ctx.restore();
    }
  }

  drawTitle(ctx) {
    const t = this.animTimer;
    this.bg.draw(ctx, Math.sin(t * 0.08) * 160 + 160, 0, t);
    this.ground.draw(ctx, 0, 0, t);
    this.bg.drawOverlay(ctx, null, 0, 0, t);

    // Logo
    const bob = Math.sin(t * 1.6) * 3;
    ctx.save();
    ctx.translate(C.W / 2, 118 + bob);
    ctx.font = UI.font(70);
    ctx.textAlign = 'center';
    ctx.lineJoin = 'round';
    ctx.lineWidth = 12;
    ctx.strokeStyle = '#0b2540';
    ctx.strokeText('LEAD-FREE', 0, 0);
    const g = ctx.createLinearGradient(0, -52, 0, 6);
    g.addColorStop(0, '#ffffff'); g.addColorStop(1, '#bfefff');
    ctx.fillStyle = g;
    ctx.fillText('LEAD-FREE', 0, 0);
    // Letters "filled with water" below a sloshing line
    ctx.beginPath();
    ctx.moveTo(-270, 20);
    for (let x = -270; x <= 270; x += 10) ctx.lineTo(x, -26 + Math.sin(t * 2.6 + x * 0.035) * 4);
    ctx.lineTo(270, 20);
    ctx.closePath();
    ctx.clip();
    const wg = ctx.createLinearGradient(0, -30, 0, 6);
    wg.addColorStop(0, '#5fd0f5'); wg.addColorStop(1, '#1576b5');
    ctx.fillStyle = wg;
    ctx.fillText('LEAD-FREE', 0, 0);
    ctx.restore();

    // Ribbon
    const ry = 150 + bob;
    ctx.fillStyle = '#b8860b';
    ctx.beginPath(); ctx.moveTo(C.W / 2 - 190, ry + 4); ctx.lineTo(C.W / 2 - 214, ry + 20); ctx.lineTo(C.W / 2 - 190, ry + 36); ctx.fill();
    ctx.beginPath(); ctx.moveTo(C.W / 2 + 190, ry + 4); ctx.lineTo(C.W / 2 + 214, ry + 20); ctx.lineTo(C.W / 2 + 190, ry + 36); ctx.fill();
    const rg = ctx.createLinearGradient(0, ry, 0, ry + 36);
    rg.addColorStop(0, '#ffe066'); rg.addColorStop(1, '#e0a800');
    ctx.fillStyle = rg;
    ctx.beginPath(); ctx.roundRect(C.W / 2 - 196, ry, 392, 36, 6); ctx.fill();
    ctx.strokeStyle = '#6b4a00'; ctx.lineWidth = 2; ctx.stroke();
    UI.text(ctx, 'SJWD ADVENTURE', C.W / 2, ry + 27, { size: 26, align: 'center', color: '#3a2600', outline: 'rgba(255,245,200,0.8)', ow: 2 });

    UI.text(ctx, 'Clear the lead from your community\'s water lines!', C.W / 2, 220, { size: 15, align: 'center' });

    // Hero and a lead blob on the ground
    const groundY = 14 * TS;
    drawShadow(ctx, 250, groundY, 30);
    ctx.save();
    ctx.translate(250, groundY);
    ctx.scale(2.6, 2.6);
    this.hero._drawBody(ctx);
    ctx.restore();
    ctx.save();
    ctx.translate(560, groundY);
    ctx.scale(2.2, 2.2);
    this.blob.x = -12; this.blob.y = -20;
    this.blob.draw(ctx, 0, 0);
    ctx.restore();

    // Prompt
    const pulse = 0.6 + 0.4 * Math.sin(t * 4);
    ctx.globalAlpha = 0.55 + 0.45 * pulse;
    UI.panel(ctx, C.W / 2 - 130, 262, 260, 40, 20, 'rgba(46,204,113,0.9)', '#0e5a2e');
    UI.text(ctx, 'PRESS ANY KEY', C.W / 2, 289, { size: 20, align: 'center', color: '#ffffff', outline: '#0e5a2e' });
    ctx.globalAlpha = 1;

    UI.panel(ctx, C.W / 2 - 250, 496, 500, 26, 13, 'rgba(10,28,48,0.8)');
    UI.keys(ctx, [['← →', 'move'], ['SPACE', 'jump'], ['X', 'spray'], ['P', 'pause'], ['M', 'mute']], C.W / 2, 513);
  }

  drawGameOver(ctx, score, coins) {
    ctx.fillStyle = 'rgba(70,0,10,0.35)';
    ctx.fillRect(0, 0, C.W, C.H);
    const c = this._card(ctx, 360, 230, '#ff6b5a', 0.55);
    UI.text(ctx, 'OUT OF HEARTS', C.W / 2, c.y + 56, { size: 30, align: 'center', color: '#ff8a7a' });
    UI.text(ctx, 'The lead got the better of you this time.', C.W / 2, c.y + 84, { size: 12, align: 'center', color: 'rgba(220,230,240,0.8)', outline: null });
    UI.text(ctx, `SCORE  ${String(score).padStart(7, '0')}`, C.W / 2, c.y + 122, { size: 16, align: 'center' });
    UI.droplet(ctx, C.W / 2 - 40, c.y + 146, 0.9);
    UI.text(ctx, `× ${coins}`, C.W / 2 - 26, c.y + 151, { size: 15 });
    if (this.animTimer > 0.6) UI.keys(ctx, [['ENTER', 'try again'], ['ESC', 'map']], C.W / 2, c.y + 200);
    c.done();
  }

  drawLevelClear(ctx, score, coins, timeBonus, isHighScore) {
    this._confetti(ctx, 40);
    const c = this._card(ctx, 380, 280, '#2ecc71', 0.5);
    const t = this.animTimer;
    UI.text(ctx, 'LINES CLEAN!', C.W / 2, c.y + 54, { size: 32, align: 'center', color: '#7dffb0' });
    if (!(isHighScore && t > 1.3)) UI.text(ctx, 'Level complete', C.W / 2, c.y + 78, { size: 12, align: 'center', color: 'rgba(220,230,240,0.8)', outline: null });
    const row = (i, label, value, icon) => {
      const k = M.clamp((t - 0.35 - i * 0.25) / 0.35, 0, 1);
      if (k <= 0) return;
      ctx.globalAlpha = k;
      const y = c.y + 116 + i * 34 + (1 - k) * 10;
      if (icon) icon(c.x + 44, y - 5);
      UI.text(ctx, label, c.x + (icon ? 60 : 40), y, { size: 15, color: 'rgba(220,235,245,0.9)' });
      UI.text(ctx, value, c.x + 340, y, { size: 16, align: 'right' });
      ctx.globalAlpha = 1;
    };
    const tally = (v, i) => Math.round(v * M.clamp((t - 0.35 - i * 0.25) / 0.6, 0, 1));
    row(0, 'Water drops', `× ${tally(coins, 0)}`, (x, y) => UI.droplet(ctx, x, y, 0.85));
    row(1, 'Time bonus', `+${tally(timeBonus, 1)}`, (x, y) => UI.clock(ctx, x, y, '#eaf2f8'));
    row(2, 'Total score', String(tally(score, 2)).padStart(7, '0'));
    if (isHighScore && t > 1.3) {
      const k = M.easeOutBack(M.clamp((t - 1.3) / 0.35, 0, 1));
      ctx.save();
      ctx.translate(C.W / 2, c.y + 80);
      ctx.rotate(-0.04);
      ctx.scale(k, k);
      UI.panel(ctx, -48, -14, 96, 28, 6, '#f1c40f', '#6b4a00');
      UI.text(ctx, 'NEW BEST!', 0, 6, { size: 13, align: 'center', color: '#3a2600', outline: null });
      ctx.restore();
    }
    if (t > 1.0) UI.keys(ctx, [['ENTER', 'continue']], C.W / 2, c.y + 256);
    c.done();
  }

  drawWorldClear(ctx, worldIdx) {
    const world = C.WORLDS[worldIdx];
    const last = worldIdx === C.WORLDS.length - 1;
    this._confetti(ctx, 90);
    const c = this._card(ctx, 440, 270, world.color, 0.55);
    UI.text(ctx, last ? 'ALL LINES LEAD-FREE!' : 'DISTRICT CLEAN!', C.W / 2, c.y + 60, { size: last ? 28 : 32, align: 'center', color: '#ffe066' });
    UI.text(ctx, world.name.toUpperCase(), C.W / 2, c.y + 92, { size: 16, align: 'center', color: world.color });
    UI.text(ctx, last ? 'Every district in the SJWD service area' : 'The boss is beaten and the water runs clean.', C.W / 2, c.y + 132, { size: 13, align: 'center', outline: null });
    UI.text(ctx, last ? 'now has safe, lead-free drinking water.' : 'The community thanks you!', C.W / 2, c.y + 152, { size: 13, align: 'center', outline: null });
    if (!last) {
      UI.panel(ctx, C.W / 2 - 150, c.y + 176, 300, 32, 10, 'rgba(255,255,255,0.08)', C.WORLDS[worldIdx + 1].color);
      UI.text(ctx, `UNLOCKED: ${C.WORLDS[worldIdx + 1].name}`, C.W / 2, c.y + 197, { size: 13, align: 'center', color: '#ffffff' });
    } else {
      UI.text(ctx, 'Thanks for playing!', C.W / 2, c.y + 198, { size: 18, align: 'center', color: '#9ff3e4' });
    }
    if (this.animTimer > 1) UI.keys(ctx, [['ENTER', 'continue']], C.W / 2, c.y + 248);
    c.done();
  }
}

// ─────────────────────────────────────────────────────────────────────────────
// MAIN GAME CLASS
// Fixed-timestep simulation (60 Hz) with render interpolation, so motion is
// identical on 60/120/144 Hz displays and stays smooth between steps.
// ─────────────────────────────────────────────────────────────────────────────
class Game {
  constructor() {
    this.canvas = document.getElementById('gameCanvas');
    this.ctx    = this.canvas.getContext('2d');
    this.container = document.getElementById('gameContainer');

    this.audio     = new AudioEngine();
    this.input     = new InputHandler();
    this.save      = new SaveSystem();
    this.particles = new ParticleSystem();
    this.camera    = new Camera();
    this.hud       = new HUD();
    this.screens   = new Screens(this.audio);
    this.generator = new LevelGenerator();
    this.backdrop  = new Backdrop();

    // 'title' | 'overworld' | 'playing' | 'boss' | 'levelclear' |
    // 'gameover' | 'worldclear' | 'win'
    this.state = 'title';

    this.tilemap   = null;
    this.player    = null;
    this.enemies   = [];
    this.coins     = [];
    this.powerups  = [];
    this.hazards   = [];
    this.bossLevel = null;
    this.overworld = null;

    this.worldIdx = 0;
    this.levelIdx = 0;
    this.levelTimer = 0;
    this.levelTimeMax = 240;
    this.paused = false;
    this.pauseSel = 0;
    this.muted  = !this.save.data.soundOn;

    this._levelScore = 0;
    this._levelCoins = 0;
    this._clearInfo = null;

    // Loop / timing
    this.time = 0;
    this.accum = 0;
    this.alpha = 1;
    this.hitStop = 0;       // steps of frozen gameplay for impact
    this._lastTime = 0;
    this._raf = null;
    this.fade = { a: 1, dir: -1, cb: null };  // start faded in from black

    this.pixelScale = 1;
    this._resize = this._resize.bind(this);
    window.addEventListener('resize', this._resize);
    window.addEventListener('orientationchange', this._resize);
    this._resize();

    this.input.onAnyInput = () => this.audio.resume();
    if (!this.save.data.soundOn) this.audio.enabled = false;
    this._bindMute();
    this._loop = this._loop.bind(this);
    window._gameErrors = [];
  }

  // Fit the 800x540 logical view to the window and render at device resolution
  _resize() {
    const vw = window.innerWidth, vh = window.innerHeight;
    const k = Math.max(0.3, Math.min(vw / C.W, vh / C.H));
    const cssW = Math.floor(C.W * k), cssH = Math.floor(C.H * k);
    this.container.style.width = cssW + 'px';
    this.container.style.height = cssH + 'px';
    // Backing store is capped at 2x the logical size: sharp on HiDPI while
    // keeping every cached layer a 1:1 blit (no resampling) and memory bounded.
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    const scale = Math.max(0.5, Math.min((cssW * dpr) / C.W, 2));
    this.canvas.width  = Math.round(C.W * scale);
    this.canvas.height = Math.round(C.H * scale);
    this.pixelScale = scale;
    RENDER_SCALE = this.pixelScale;
    if (this.tilemap && this.tilemap.invalidate) this.tilemap.invalidate();
    if (this.backdrop) this.backdrop.invalidate();
  }

  _bindMute() {
    window.addEventListener('keydown', e => {
      if (e.code === 'KeyM') {
        this.muted = !this.audio.toggleMute();
        this.save.data.soundOn = !this.muted;
        this.save.save();
      }
    });
  }

  start() {
    this.audio.init();
    if (this.muted) this.audio.setVolume(0);
    this.audio.startBGM('map');
    this._raf = requestAnimationFrame(this._loop);
  }

  _loop(ts) {
    this._raf = requestAnimationFrame(this._loop);
    if (!this._lastTime) this._lastTime = ts;
    const frame = Math.min((ts - this._lastTime) / 1000, 0.25);
    this._lastTime = ts;
    this.accum += frame;
    try {
      let steps = 0;
      while (this.accum >= C.STEP && steps < C.MAX_STEPS) {
        this._step(C.STEP);
        this.input.flush();          // presses are consumed by exactly one step
        this.accum -= C.STEP;
        steps++;
      }
      if (steps === C.MAX_STEPS) this.accum = 0; // drop backlog after a stall
      this.alpha = this.accum / C.STEP;
      this._render();
    } catch (err) {
      console.error('[SJWD Game] loop error:', err);
      if (window._gameErrors.length < 20) window._gameErrors.push(String(err && err.stack || err));
      this.input.flush();
    }
  }

  // Fade to black, run cb, fade back in. Gameplay freezes while fading out.
  transition(cb) {
    if (this.fade.dir === 1) return;
    this.fade.dir = 1;
    this.fade.cb = cb;
  }

  _step(dt) {
    this.time += dt;
    this.screens.update(dt);

    const f = this.fade;
    if (f.dir === 1) {
      f.a = Math.min(1, f.a + dt / 0.22);
      if (f.a >= 1) { const cb = f.cb; f.cb = null; f.dir = -1; if (cb) cb(); }
      return;
    } else if (f.dir === -1) {
      f.a = Math.max(0, f.a - dt / 0.3);
      if (f.a <= 0) f.dir = 0;
    }

    switch (this.state) {
      case 'title':      this._updateTitle(dt);      break;
      case 'select':     this._updateSelect(dt);     break;
      case 'overworld':  this._updateOverworld(dt);  break;
      case 'playing':    this._updatePlaying(dt);    break;
      case 'boss':       this._updateBoss(dt);       break;
      case 'levelclear': this._updateLevelClear(dt); break;
      case 'gameover':   this._updateGameOver(dt);   break;
      case 'worldclear': this._updateWorldClear(dt); break;
      case 'win':        this._updateWin(dt);        break;
    }
  }

  // ── STATE: TITLE ─────────────────────────────────────────────────────────
  _updateTitle() {
    const i = this.input;
    const anyKey = i.enterPressed() || i.jumpPressed() || i.actionPressed() ||
      ['ArrowLeft', 'ArrowRight', 'ArrowDown', 'KeyA', 'KeyS', 'KeyD', 'KeyZ', 'KeyX'].some(k => i.wasPressed(k));
    if (anyKey) {
      this.audio.sfxMenuSelect();
      this.transition(() => this._goSelect());
    }
  }

  // ── STATE: WORKER SELECT ─────────────────────────────────────────────────
  _goSelect() {
    this.state = 'select';
    this.charSel = this.save.data.character === 'f' ? 1 : 0;
    this.screens.animTimer = 0;
    this.audio.startBGM('map');
  }

  _updateSelect() {
    const i = this.input;
    if ((i.wasPressed('ArrowLeft') || i.wasPressed('KeyA')) && this.charSel !== 0) { this.charSel = 0; this.audio.sfxMenuMove(); }
    if ((i.wasPressed('ArrowRight') || i.wasPressed('KeyD')) && this.charSel !== 1) { this.charSel = 1; this.audio.sfxMenuMove(); }
    if (i.enterPressed() || i.wasPressed('KeyE') || i.wasPressed('KeyX')) {
      this.save.data.character = this.charSel ? 'f' : 'm';
      this.save.save();
      this.audio.sfxMenuSelect();
      this.transition(() => this._goOverworld());
    } else if (i.wasPressed('Escape')) {
      this.transition(() => { this.state = 'title'; this.screens.animTimer = 0; });
    }
  }

  // ── STATE: OVERWORLD ─────────────────────────────────────────────────────
  _goOverworld() {
    this.state = 'overworld';
    this.overworld = new OverworldMap(this.save, this.input, this.audio);
    this.audio.startBGM('map');
  }

  _updateOverworld(dt) {
    if (!this.overworld) return;
    const result = this.overworld.update(dt);
    if (result && result.action === 'start') {
      this.audio.sfxMenuSelect();
      this.transition(() => this._startLevel(result.world, result.level));
    } else if (result && result.action === 'character') {
      this.audio.sfxMenuSelect();
      this.transition(() => this._goSelect());
    } else if (result && result.action === 'back') {
      this.transition(() => { this.state = 'title'; this.screens.animTimer = 0; });
    }
  }

  // ── LEVEL SETUP ──────────────────────────────────────────────────────────
  _startLevel(worldIdx, levelIdx) {
    this.worldIdx = worldIdx;
    this.levelIdx = levelIdx;
    const isBoss = levelIdx === C.WORLDS[worldIdx].levels - 1;

    this.generator.seed = worldIdx * 997 + levelIdx * 31337;
    if (isBoss) {
      this.bossLevel = new BossLevel(worldIdx);
      this.tilemap   = this.bossLevel.map;
      this.enemies   = [];
      this.coins     = [];
      this.powerups  = [...this.tilemap.powerups];
      this.hazards   = [];
      this.state     = 'boss';
      this.audio.startBGM('boss');
    } else {
      this.bossLevel = null;
      this.tilemap  = this.generator.generate(worldIdx, levelIdx);
      this.enemies  = [...this.tilemap.entities];
      this.coins    = [...this.tilemap.coins];
      this.powerups = [...this.tilemap.powerups];
      this.hazards  = [...this.tilemap.hazards];
      this.state    = 'playing';
      this.audio.startBGM('w' + worldIdx);
    }
    if (this.tilemap.setTheme) this.tilemap.setTheme(worldIdx);
    this.backdrop.setWorld(worldIdx, isBoss, this.tilemap);

    this.particles = new ParticleSystem();
    if (this.bossLevel) this.bossLevel.boss.game = this;
    this.levelTimer = this.levelTimeMax;
    this.paused = false;
    this.hitStop = 0;
    this._clearInfo = null;
    this._timerWarned = false;
    this.shots = [];
    this._lockMsgT = 0;
    this._allClearShown = false;
    this._blasterRespawn = 0;
    this._contamTotal = this.enemies.length;
    this.tilemap.exitLocked = !isBoss && this.enemies.length > 0;
    this.tilemap.exitRemaining = this.enemies.length;

    this.player = new Player(
      this.tilemap.spawnX,
      this.tilemap.spawnY - C.PLAYER_H,
      this.input, this.audio, this.particles
    );
    this.player.gender = this.save.data.character || 'm';
    this.hud = new HUD();
    this.camera = new Camera();
    this.camera.snapTo(this.player, this.tilemap.cols * TS, this.tilemap.rows * TS);

    this.save.data.currentWorld = worldIdx;
    this.save.data.currentLevel = levelIdx;
    this.save.save();
  }

  // Shared per-step world simulation. Returns false when gameplay is frozen.
  _simulateWorld(dt) {
    const inp = this.input;
    if (inp.pausePressed() && !this.player.dead) {
      this.paused = !this.paused;
      this.pauseSel = 0;
      this.audio.sfxMenuMove();
      return false;
    }
    if (this.paused) {
      if (inp.wasPressed('ArrowUp') || inp.wasPressed('KeyW')) { this.pauseSel = (this.pauseSel + 2) % 3; this.audio.sfxMenuMove(); }
      if (inp.wasPressed('ArrowDown') || inp.wasPressed('KeyS')) { this.pauseSel = (this.pauseSel + 1) % 3; this.audio.sfxMenuMove(); }
      if (inp.wasPressed('Enter') || inp.wasPressed('Space')) {
        const sel = this.pauseSel;
        this.paused = false;
        this.audio.sfxMenuSelect();
        if (sel === 1) this.transition(() => this._startLevel(this.worldIdx, this.levelIdx));
        if (sel === 2) this.transition(() => this._goOverworld());
      }
      return false;
    }
    if (this.hitStop > 0) { this.hitStop--; return false; }

    const map = this.tilemap, pl = this.player;
    pl.snapshot();
    this.enemies.forEach(e => e.snapshot());
    if (this.bossLevel) this.bossLevel.boss.snapshot();

    if (!pl.dead) {
      this.levelTimer -= dt;
      if (this.levelTimer <= 30 && !this._timerWarned) {
        this._timerWarned = true;
        this.particles.floatText(pl.cx, pl.y - 20, 'HURRY UP!', '#ff6b5a', 15);
      }
      if (this.levelTimer <= 0) { this.levelTimer = 0; pl.invTimer = 0; pl.takeDamage(pl.hp, null); }
    }

    pl.update(dt, map);
    this.camera.update(pl, map.cols * TS, map.rows * TS);

    // Water cannon: hold X / F / E (or OK on touch) to spray
    if (pl.blaster > 0 && !pl.dead && !pl.wonLevel && pl.fireCd <= 0 && (inp.fireHeld || inp.firePressed())) {
      const dir = pl.facing, mx = pl.cx + dir * 22, my = pl.bottom - 21;
      this.shots.push({ x: mx, y: my, vx: dir * 9 + pl.vx * 0.3, vy: 0.1, life: 0.75, t: 0, dead: false });
      pl.fireCd = 9;
      pl.fireAnim = 1;
      this.audio.sfxShoot();
      this.particles.emit(mx, my, 3, { kind: 'droplet', vxMin: dir * 1, vxMax: dir * 3, vyMin: -1.5, vyMax: 0.5, gravity: 0.2,
        sizeMin: 2, sizeMax: 3, lifeMin: 0.2, lifeMax: 0.35, color: ['#bff3ff', '#56cfe1'] });
    }

    // Enemies: stomp from above, otherwise they hurt
    for (const e of this.enemies) {
      e.update(dt, map);
      if (e.dead || pl.dead || !pl.overlaps(e)) continue;
      const fromAbove = pl.vy > 0 && pl.py + pl.h <= e.y + 8;
      if (fromAbove) {
        const killed = e.stomp(this.particles, this.audio);
        pl.vy = this.input.jumpHeld ? C.P.JUMP_V * 0.85 : C.P.JUMP_V * 0.55;
        pl.jumping = true;
        pl.doubleJumped = false;
        pl.sx = 0.8; pl.sy = 1.2;
        this.hitStop = killed ? 4 : 2;
        this.camera.addShake(killed ? 3 : 2);
        if (killed) {
          pl.score += e.score;
          this.particles.floatText(e.cx, e.y - 4, `+${e.score}`, '#ffe08a', 12);
        }
      } else if (e.harmful) {
        if (pl.takeDamage(1, e.cx)) { this.camera.addShake(6); this.hitStop = 3; }
      }
    }
    this.enemies = this.enemies.filter(e => !e.dead);

    // Water shots clean contaminants off the board
    for (const sh of this.shots) {
      sh.t += dt; sh.life -= dt;
      sh.x += sh.vx; sh.y += sh.vy; sh.vy += 0.03;
      if (sh.life <= 0 || Phys.solid(map.get(Math.floor(sh.x / TS), Math.floor(sh.y / TS)))) { this._splashShot(sh); continue; }
      for (const e of this.enemies) {
        if (e.dead || !M.overlap(sh.x - 7, sh.y - 8, 14, 16, e.x, e.y, e.w, e.h)) continue;
        this._splashShot(sh);
        if (e.stomp(this.particles, this.audio)) {
          pl.score += e.score;
          this.particles.floatText(e.cx, e.y - 4, `+${e.score}`, '#ffe08a', 12);
          this.camera.addShake(2);
        } else {
          e.vx = Math.sign(sh.vx) * 2;
        }
        break;
      }
    }
    this.shots = this.shots.filter(sh => !sh.dead);
    this.enemies = this.enemies.filter(e => !e.dead);

    for (const coin of this.coins) {
      coin.update(dt);
      if (!coin.dead && !pl.dead && pl.overlaps(coin)) {
        coin.dead = true;
        pl.collectCoin(coin.value);
        this.particles.emit(coin.cx, coin.cy, 8, { kind: 'droplet', speed: 3, color: ['#bff3ff', '#56cfe1'],
          gravity: 0.15, sizeMin: 2, sizeMax: 3, lifeMin: 0.3, lifeMax: 0.5 });
        this.particles.emit(coin.cx, coin.cy, 1, { kind: 'ring', sizeMin: 14, sizeMax: 14, lifeMin: 0.25,
          lifeMax: 0.25, vxMin: 0, vxMax: 0, vyMin: 0, vyMax: 0, gravity: 0, color: '#bff3ff' });
      }
    }
    this.coins = this.coins.filter(c => !c.dead);

    for (const pu of this.powerups) {
      pu.update(dt);
      if (!pu.dead && !pl.dead && pl.overlaps(pu)) {
        pu.dead = true;
        pl.collectPowerup(pu.type);
        this.hitStop = 3;
      }
    }
    this.powerups = this.powerups.filter(p => !p.dead);

    for (const h of this.hazards) {
      h.update(dt);
      if (pl.dead) continue;
      const hb = h.hurtBox ? h.hurtBox() : h;
      if (M.overlap(pl.x, pl.y, pl.w, pl.h, hb.x, hb.y, hb.w, hb.h)) {
        if (pl.takeDamage(1, null)) this.camera.addShake(5);
        if (pl.vy > -6) {     // always bounce out of the sludge
          pl.vy = -12;
          pl.jumping = true;
        }
        this.particles.emit(pl.cx, hb.y, 8, { kind: 'droplet', speed: 4, angle: -Math.PI / 2, spread: 1.6,
          color: ['#a6e05a', '#7d3c98'], gravity: 0.25, sizeMin: 2, sizeMax: 4, lifeMin: 0.3, lifeMax: 0.6 });
      }
    }

    this.particles.update(dt);
    this.backdrop.update(dt, this.camera);
    return true;
  }

  _exitReached() {
    const m = this.tilemap, pl = this.player;
    return !pl.dead && !m.exitHidden && M.overlap(pl.x, pl.y, pl.w, pl.h, m.exitX + 4, m.exitY - TS, TS - 8, TS * 2);
  }

  _handleDeath(dt) {
    if (!this.player.dead) return;
    if (this.player.deathTime > 1.5) {
      this._levelScore = this.player.score;
      this._levelCoins = this.player.coins;
      this.screens.animTimer = 0;
      this.audio.stopBGM();
      this.transition(() => { this.state = 'gameover'; });
    }
  }

  // ── STATE: PLAYING ───────────────────────────────────────────────────────
  _updatePlaying(dt) {
    if (!this._simulateWorld(dt)) return;
    const m = this.tilemap, pl = this.player, left = this.enemies.length;
    m.exitLocked = left > 0;
    m.exitRemaining = left;
    if (left === 0 && !this._allClearShown) {
      this._allClearShown = true;
      if (this._contamTotal > 0) {
        this.particles.floatText(pl.cx, pl.y - 24, 'ALL CLEAR! EXIT OPEN', '#7dffb0', 16);
        this.audio.sfxPowerup();
        this.particles.emit(m.exitX + TS / 2, m.exitY - 20, 24, { kind: 'spark', speed: 5, color: ['#9ff3e4', '#ffffff', '#2ecc71'],
          gravity: 0.05, sizeMin: 2, sizeMax: 3, lifeMin: 0.4, lifeMax: 0.9, additive: true });
      }
    }
    if (this._lockMsgT > 0) this._lockMsgT -= dt;
    if (this._exitReached()) {
      if (left > 0) {
        if (this._lockMsgT <= 0) {
          this._lockMsgT = 1.8;
          this.audio.sfxLocked();
          this.particles.floatText(m.exitX + TS / 2, m.exitY - 72, `REMOVE ${left} MORE!`, '#ff8a7a', 14);
        }
      } else {
        this._completeLevelNormal();
      }
    }
    this._handleDeath(dt);
  }

  _splashShot(sh) {
    sh.dead = true;
    this.particles.emit(sh.x, sh.y, 7, { kind: 'droplet', speed: 3, color: ['#bff3ff', '#56cfe1', '#ffffff'],
      gravity: 0.22, sizeMin: 2, sizeMax: 3, lifeMin: 0.25, lifeMax: 0.45 });
  }

  _completeLevelNormal() {
    this.audio.stopBGM();
    this.audio.sfxFanfare(false);
    this.audio.sfxValve();
    const timeBonus = Math.floor(this.levelTimer * 10);
    const prevBest = this.save.getHighScore(this.worldIdx, this.levelIdx);
    this.player.score += timeBonus;
    this.player.wonLevel = true;
    this._clearInfo = { timeBonus, newBest: this.player.score > prevBest };
    this.save.setHighScore(this.worldIdx, this.levelIdx, this.player.score);
    this.save.addCoins(this.player.coins);

    const nextLi = this.levelIdx + 1;
    if (nextLi < C.WORLDS[this.worldIdx].levels) {
      this.save.unlockLevel(this.worldIdx, nextLi);
      this.save.data.currentLevel = nextLi;
      this.save.save();
    } else if (this.worldIdx + 1 < C.WORLDS.length) {
      this.save.unlockLevel(this.worldIdx + 1, 0);
    }
    this.particles.emit(this.tilemap.exitX + TS / 2, this.tilemap.exitY, 30, {
      kind: 'spark', speed: 6, color: ['#9ff3e4', '#ffffff', '#2ecc71'], gravity: 0.08,
      sizeMin: 2, sizeMax: 3, lifeMin: 0.4, lifeMax: 0.9, additive: true,
    });
    this.screens.animTimer = 0;
    this.state = 'levelclear';
  }

  // ── STATE: BOSS ──────────────────────────────────────────────────────────
  _updateBoss(dt) {
    if (!this._simulateWorld(dt)) return;
    const pl = this.player, boss = this.bossLevel.boss;

    if (!this.powerups.some(p => p.type === 'blaster') && pl.blaster <= 0) {
      this._blasterRespawn += dt;
      if (this._blasterRespawn > 10) {
        this._blasterRespawn = 0;
        const pu = new Powerup(16.5 * TS - 12, (C.LEVEL_H_TILES - 10) * TS - 4, 'blaster');
        this.powerups.push(pu);
        this.particles.emit(pu.cx, pu.cy, 14, { kind: 'spark', speed: 4, color: ['#8fe3ff', '#ffffff'], gravity: 0, sizeMin: 2, sizeMax: 3, lifeMin: 0.3, lifeMax: 0.6, additive: true });
      }
    } else {
      this._blasterRespawn = 0;
    }

    if (!boss.dead) {
      boss.update(dt, this.tilemap, pl.cx, pl.cy);
      for (const sh of this.shots) {
        if (sh.dead || boss.dead || !M.overlap(sh.x - 7, sh.y - 8, 14, 16, boss.x, boss.y, boss.w, boss.h)) continue;
        this._splashShot(sh);
        if (boss.invuln > 0) continue;
        boss.soak = (boss.soak || 0) + 1;
        boss.flash = 0.06;
        if (boss.soak >= 3 && boss.hit(this.particles, this.audio)) {
          boss.soak = 0;
          pl.score += 250;
          this.particles.floatText(boss.cx, boss.y - 10, '+250', '#ffe08a', 14);
          this.camera.addShake(boss.dead ? 14 : 5);
          this.hitStop = boss.dead ? 14 : 4;
          if (boss.dead) this._onBossDefeated(boss);
        }
      }
      if (!pl.dead && boss.overlaps(pl)) {
        const stomp = pl.vy > 0 && pl.py + pl.h <= boss.y + 18;
        if (stomp) {
          pl.vy = C.P.JUMP_V * 0.85;
          pl.jumping = true;
          pl.doubleJumped = false;
          pl.sx = 0.8; pl.sy = 1.2;
          if (boss.hit(this.particles, this.audio)) {
            pl.score += 500;
            this.particles.floatText(boss.cx, boss.y - 10, '+500', '#ffe08a', 14);
            this.camera.addShake(boss.dead ? 14 : 7);
            this.hitStop = boss.dead ? 14 : 6;
            if (boss.dead) this._onBossDefeated(boss);
          }
        } else if (boss.harmful && pl.takeDamage(1, boss.cx)) {
          this.camera.addShake(8);
          this.hitStop = 3;
        }
      }
      for (const p of boss.projectiles) {
        if (p.dead || pl.dead) continue;
        const hit = p.kind === 'wave'
          ? M.overlap(pl.x, pl.y, pl.w, pl.h, p.x - 12, p.y - 6, 24, 16)
          : M.dist(pl.cx, pl.cy, p.x, p.y) < p.r + 10;
        if (hit) {
          if (p.kind === 'glob') p.dead = true;
          if (pl.takeDamage(1, p.x)) this.camera.addShake(5);
        }
      }
    } else if (this._exitReached()) {
      this._completeBoss();
    }
    this._handleDeath(dt);
  }

  // Boss down: shower of drops and the exit valve opens
  _onBossDefeated(boss) {
    const m = this.tilemap;
    m.exitHidden = false;
    for (let i = 0; i < 12; i++) {
      const a = Math.PI * (0.15 + 0.7 * (i / 11));
      const x = boss.cx - Math.cos(a) * 150, y = boss.bottom - 40 - Math.sin(a) * 90;
      this.coins.push(new Coin(x - 8, y - 9));
    }
    this.particles.floatText(boss.cx, boss.y - 30, 'VALVE OPEN!', '#9ff3e4', 18);
    this.particles.emit(m.exitX + TS / 2, m.exitY, 30, { kind: 'spark', speed: 6, color: ['#9ff3e4', '#ffffff'],
      gravity: 0.05, sizeMin: 2, sizeMax: 3, lifeMin: 0.5, lifeMax: 1, additive: true });
    this.audio.sfxPowerup();
  }

  _completeBoss() {
    if (this.state !== 'boss') return;
    this.player.wonLevel = true;
    this.audio.stopBGM();
    this.audio.sfxFanfare(true);
    this.audio.sfxValve();
    const timeBonus = Math.floor(this.levelTimer * 10);
    const prevBest = this.save.getHighScore(this.worldIdx, this.levelIdx);
    this.player.score += timeBonus + 2000;
    this._clearInfo = { timeBonus, newBest: this.player.score > prevBest };
    this.save.setHighScore(this.worldIdx, this.levelIdx, this.player.score);
    this.save.addCoins(this.player.coins);
    this.screens.animTimer = 0;
    const nextWi = this.worldIdx + 1;
    if (nextWi < C.WORLDS.length) {
      this.save.unlockLevel(nextWi, 0);
      this.save.data.currentWorld = nextWi;
      this.save.data.currentLevel = 0;
      this.save.save();
      this.state = 'worldclear';
    } else {
      this.state = 'win';
    }
  }

  // ── RESULT SCREENS ───────────────────────────────────────────────────────
  _updateLevelClear(dt) {
    this.particles.update(dt);
    if (this.screens.animTimer > 0.6 && this.input.enterPressed()) {
      this.audio.sfxMenuSelect();
      this.transition(() => this._goOverworld());
    }
  }

  _updateGameOver() {
    if (this.screens.animTimer > 0.6 && this.input.enterPressed()) {
      this.audio.sfxMenuSelect();
      this.transition(() => this._startLevel(this.worldIdx, this.levelIdx));
    }
    if (this.input.wasPressed('Escape') || this.input.wasPressed('KeyQ')) {
      this.transition(() => this._goOverworld());
    }
  }

  _updateWorldClear(dt) {
    this.particles.update(dt);
    if (this.screens.animTimer > 0.8 && this.input.enterPressed()) {
      this.transition(() => this._goOverworld());
    }
  }

  _updateWin(dt) {
    this.particles.update(dt);
    if (this.screens.animTimer > 0.8 && this.input.enterPressed()) {
      this.transition(() => { this.state = 'title'; this.audio.startBGM('map'); });
    }
  }

  // ── RENDERING ────────────────────────────────────────────────────────────
  _render() {
    const ctx = this.ctx;
    ctx.setTransform(this.pixelScale, 0, 0, this.pixelScale, 0, 0);
    ctx.imageSmoothingEnabled = true;
    ctx.textBaseline = 'alphabetic';
    ctx.globalAlpha = 1;
    ctx.globalCompositeOperation = 'source-over';
    ctx.clearRect(0, 0, C.W, C.H);

    switch (this.state) {
      case 'title':
        this.screens.hero.gender = this.save.data.character || 'm';
        this.screens.drawTitle(ctx);
        break;
      case 'select':
        this.screens.drawSelect(ctx, this.charSel);
        break;
      case 'overworld':
        if (this.overworld) this.overworld.draw(ctx);
        break;
      case 'playing':
      case 'boss':
        this._drawWorld(ctx, true);
        break;
      case 'levelclear':
        this._drawWorld(ctx, false);
        this.screens.drawLevelClear(ctx, this.player.score, this.player.coins,
          this._clearInfo ? this._clearInfo.timeBonus : 0, this._clearInfo && this._clearInfo.newBest);
        break;
      case 'gameover':
        this._drawWorld(ctx, false);
        this.screens.drawGameOver(ctx, this._levelScore, this._levelCoins);
        break;
      case 'worldclear':
        this._drawWorld(ctx, false);
        this.screens.drawWorldClear(ctx, this.worldIdx);
        break;
      case 'win':
        this._drawWorld(ctx, false);
        this.screens.drawWorldClear(ctx, C.WORLDS.length - 1);
        break;
    }

    if (this.fade.a > 0) {
      ctx.fillStyle = `rgba(4,9,18,${this.fade.a})`;
      ctx.fillRect(0, 0, C.W, C.H);
    }
  }

  // Draw an entity at its interpolated position without disturbing simulation state
  _lerpDraw(e, a, ctx, cx, cy) {
    const x = e.x, y = e.y;
    e.x = M.lerp(e.px ?? x, x, a);
    e.y = M.lerp(e.py ?? y, y, a);
    e.draw(ctx, cx, cy);
    e.x = x; e.y = y;
  }

  _drawWorld(ctx, withHud) {
    if (!this.tilemap || !this.player) return;
    const live = (this.state === 'playing' || this.state === 'boss') && !this.paused && this.hitStop <= 0;
    const a = live ? this.alpha : 1;
    const cam = this.camera.view(a, this.time);
    const cx = cam.x, cy = cam.y;

    this.backdrop.draw(ctx, cx, cy, this.time);
    this.tilemap.draw(ctx, cx, cy, this.time);
    for (const h of this.hazards) h.draw(ctx, cx, cy);
    for (const c of this.coins) c.draw(ctx, cx, cy);
    for (const p of this.powerups) p.draw(ctx, cx, cy);
    for (const e of this.enemies) this._lerpDraw(e, a, ctx, cx, cy);
    if (this.bossLevel && !this.bossLevel.boss.dead) this._lerpDraw(this.bossLevel.boss, a, ctx, cx, cy);
    if (!this.player.wonLevel) this._lerpDraw(this.player, a, ctx, cx, cy);
    for (const sh of this.shots || []) {
      const x = sh.x - cx, y = sh.y - cy, d = Math.sign(sh.vx) || 1;
      ctx.save();
      ctx.globalCompositeOperation = 'lighter';
      ctx.fillStyle = 'rgba(90,200,255,0.35)';
      ctx.beginPath(); ctx.arc(x, y, 9, 0, Math.PI * 2); ctx.fill();
      ctx.restore();
      for (let k = 3; k >= 1; k--) {
        ctx.fillStyle = `rgba(160,230,255,${0.25 * (4 - k)})`;
        ctx.beginPath(); ctx.arc(x - d * k * 6, y + Math.sin(sh.t * 30 + k) * 1.2, 4.5 - k, 0, Math.PI * 2); ctx.fill();
      }
      ctx.fillStyle = '#e8fbff';
      ctx.strokeStyle = '#1576b5'; ctx.lineWidth = 1;
      ctx.beginPath(); ctx.ellipse(x, y, 6.5, 4, 0, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
      ctx.fillStyle = '#56cfe1';
      ctx.beginPath(); ctx.ellipse(x - d * 1.5, y + 0.8, 3.5, 2, 0, 0, Math.PI * 2); ctx.fill();
    }
    if (this.tilemap.drawFront) this.tilemap.drawFront(ctx, cx, cy, this.time);
    this.particles.draw(ctx, cx, cy);
    this.backdrop.drawOverlay(ctx, this.player, cx, cy, this.time);

    if (withHud) {
      this.hud.draw(ctx, this);
    }
  }
}

// ─────────────────────────────────────────────────────────────────────────────
// BOOT
// ─────────────────────────────────────────────────────────────────────────────
window.addEventListener('DOMContentLoaded', () => {
  const game = new Game();
  game.start();
  // Expose for debugging
  window._game = game;
});
</script>
