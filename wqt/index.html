<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Lead-Free SJWD Adventure</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%;
    height: 100%;
    background: radial-gradient(ellipse at center, #0c1d33 0%, #040912 75%);
    overflow: hidden;
    touch-action: none;
  }
  body {
    display: flex;
    justify-content: center;
    align-items: center;
    font-family: 'Courier New', monospace;
  }
  #gameContainer {
    position: relative;
    width: 800px;
    height: 540px;
  }
  #gameCanvas {
    display: block;
    width: 100%;
    height: 100%;
    border-radius: 6px;
    box-shadow: 0 0 0 2px #12355a, 0 0 40px #1a8fc155, 0 0 120px #0a3d6244;
  }
  #mobileControls {
    display: none;
    position: absolute;
    inset: 0;
    pointer-events: none;
  }
  body.touch #mobileControls { display: block; }
  .dpad {
    position: absolute;
    left: 14px;
    bottom: 14px;
    width: 150px;
    height: 150px;
    pointer-events: all;
  }
  .dpad-btn, .action-btn {
    position: absolute;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #cfe8f7;
    font-weight: bold;
    user-select: none;
    -webkit-user-select: none;
    touch-action: none;
    background: rgba(12, 40, 66, 0.55);
    border: 2px solid rgba(86, 207, 225, 0.55);
    backdrop-filter: blur(2px);
  }
  .dpad-btn { width: 50px; height: 50px; border-radius: 10px; font-size: 20px; }
  .dpad-btn.on, .action-btn.on { background: rgba(86, 207, 225, 0.45); }
  #btnLeft  { left: 0;    top: 50px; }
  #btnRight { left: 100px; top: 50px; }
  #btnUp    { left: 50px; top: 0; }
  #btnDown  { left: 50px; top: 100px; }
  .action-btns {
    position: absolute;
    right: 14px;
    bottom: 14px;
    width: 150px;
    height: 120px;
    pointer-events: all;
  }
  .action-btn { width: 64px; height: 64px; border-radius: 50%; font-size: 12px; }
  #btnJump   { right: 0;  bottom: 40px; background: rgba(39, 174, 96, 0.55); }
  .pause-btn {
    position: absolute; top: 72px; right: 14px; width: 40px; height: 40px;
    border-radius: 10px; pointer-events: all; display: flex; align-items: center; justify-content: center;
    color: #cfe8f7; font-weight: bold; background: rgba(12, 40, 66, 0.55);
    border: 2px solid rgba(86, 207, 225, 0.55); user-select: none; -webkit-user-select: none; touch-action: none;
  }
  .pause-btn.on { background: rgba(86, 207, 225, 0.45); }
  @media (max-height: 500px) {
    .dpad { transform: scale(0.72); transform-origin: bottom left; opacity: 0.85; }
    .action-btns { transform: scale(0.72); transform-origin: bottom right; opacity: 0.85; }
    .pause-btn { top: 8px; right: 50%; transform: translateX(50%) translateY(46px) scale(0.8); }
  }
  #btnAction { right: 78px; bottom: 0;  background: rgba(142, 68, 173, 0.55); }
</style>
</head>
<body>
<div id="gameContainer">
  <canvas id="gameCanvas" width="800" height="540"></canvas>
  <div id="mobileControls">
    <div class="dpad">
      <div class="dpad-btn" id="btnLeft">◀</div>
      <div class="dpad-btn" id="btnRight">▶</div>
      <div class="dpad-btn" id="btnUp">▲</div>
      <div class="dpad-btn" id="btnDown">▼</div>
    </div>
    <div class="pause-btn" id="btnPause">II</div>
    <div class="action-btns">
      <div class="action-btn" id="btnJump">JUMP</div>
      <div class="action-btn" id="btnAction">OK</div>
    </div>
  </div>
</div>

<script>
'use strict';

// ─────────────────────────────────────────────────────────────────────────────
// CONSTANTS
// ─────────────────────────────────────────────────────────────────────────────
const C = {
  W: 800, H: 540,
  TILE: 32,
  STEP: 1 / 60,          // fixed simulation timestep (seconds)
  MAX_STEPS: 5,          // max catch-up steps per rendered frame

  // Kept for systems that still use the simple model (enemies, boss)
  GRAVITY: 0.6,
  MAX_FALL: 13,

  // World / level layout (generator may override per level)
  LEVEL_W_TILES: 60,
  LEVEL_H_TILES: 17,

  // Player hitbox
  PLAYER_W: 22,
  PLAYER_H: 32,
  PLAYER_JUMP: -10.4,    // legacy alias used for stomp bounces

  // Player movement tuning — units are pixels per fixed step (1/60 s)
  P: {
    RUN_MAX:        4.1,
    ACCEL:          0.42,
    AIR_ACCEL:      0.30,
    FRICTION:       0.55,
    AIR_FRICTION:   0.10,
    GRAVITY:        0.62,
    JUMP_V:        -10.4,
    JUMP_HOLD_GRAV: 0.50,  // gravity multiplier while rising with jump held
    FALL_GRAV:      1.30,  // gravity multiplier while falling
    APEX_THRESH:    1.4,   // |vy| under which apex hang applies
    APEX_GRAV:      0.60,
    JUMP_CUT_VY:   -3.2,   // vy clamp when jump released early
    MAX_FALL:       12.5,
    COYOTE:         7,     // steps
    JUMP_BUFFER:    8,     // steps
    CORNER_NUDGE:   9,     // px of head-bump corner correction
    // Swimming
    SWIM_GRAV:      0.16,
    SWIM_MAX_FALL:  2.3,
    SWIM_MAX:       2.4,
    SWIM_MAX_FLIP:  3.6,
    SWIM_STROKE:   -4.4,
    // Damage
    KNOCK_X:        4.4,
    KNOCK_Y:       -6.6,
    HURT_LOCK:      14,    // steps of reduced control after a hit
    INVULN:         1.6,   // seconds
  },

  // Colors (water / pipe theme)
  COL: {
    SKY_TOP:  '#0d2137',
    SKY_BOT:  '#1a3a5c',
    GROUND:   '#1a5276',
    GROUND_T: '#1a8fc1',
    PIPE:     '#117a65',
    PIPE_D:   '#0e6655',
    LEAD:     '#85929e',
    LEAD_D:   '#5d6d7e',
    WATER:    '#1a9fd4',
    WATER_L:  '#56cfe1',
    CLEAN:    '#48c9b0',
    CONTAM:   '#7d3c98',
    HUD:      '#eaf2f8',
    GOLD:     '#f1c40f',
    RED:      '#e74c3c',
    GREEN:    '#2ecc71',
    DARK:     '#0a1628',
    OUTLINE:  '#141c2b',
  },

  // Tile IDs
  T: {
    EMPTY:    0,
    SOLID:    1,
    PIPE_H:   2,
    PIPE_V:   3,
    WATER:    4,
    LEAD_TILE:5,
    PLATFORM: 6,
    SPIKE:    7,
    VALVE:    8,  // level exit
    COIN:     9,
    POWERUP:  10,
    SPAWN:    11,
  },

  // Entity types
  E: {
    LEAD_DROP:  'lead_drop',
    RUST_BLOB:  'rust_blob',
    VALVE_BOSS: 'valve_boss',
    INSPECTOR:  'inspector', // friendly NPC
  },

  // Save key
  SAVE_KEY: 'sjwd_leadfree_save',

  // World map grid
  WORLDS: [
    { name: 'Surface Mains',   color: '#1a8fc1', levels: 4 },
    { name: 'Underground Pipes',color: '#117a65', levels: 4 },
    { name: 'Treatment Plant', color: '#9b59b6', levels: 4 },
    { name: 'Distribution Net',color: '#e67e22', levels: 5 },
  ],
};

// Tile size shorthand
const TS = C.TILE;

// ─────────────────────────────────────────────────────────────────────────────
// ctx.roundRect POLYFILL (Canvas 2D API, Chrome 99+ / Firefox 112+)
// Fallback for older browsers using arc+line path construction.
// ─────────────────────────────────────────────────────────────────────────────
if (!CanvasRenderingContext2D.prototype.roundRect) {
  CanvasRenderingContext2D.prototype.roundRect = function(x, y, w, h, r) {
    r = Math.min(r, w / 2, h / 2);
    this.moveTo(x + r, y);
    this.lineTo(x + w - r, y);
    this.arcTo(x + w, y, x + w, y + r, r);
    this.lineTo(x + w, y + h - r);
    this.arcTo(x + w, y + h, x + w - r, y + h, r);
    this.lineTo(x + r, y + h);
    this.arcTo(x, y + h, x, y + h - r, r);
    this.lineTo(x, y + r);
    this.arcTo(x, y, x + r, y, r);
    this.closePath();
    return this;
  };
}

// ─────────────────────────────────────────────────────────────────────────────
// MATH HELPERS
// ─────────────────────────────────────────────────────────────────────────────
const M = {
  lerp: (a, b, t) => a + (b - a) * t,
  clamp: (v, lo, hi) => Math.max(lo, Math.min(hi, v)),
  rand: (min, max) => Math.random() * (max - min) + min,
  randInt: (min, max) => Math.floor(Math.random() * (max - min + 1)) + min,
  randPick: (arr) => arr[Math.floor(Math.random() * arr.length)],
  overlap: (ax, ay, aw, ah, bx, by, bw, bh) =>
    ax < bx + bw && ax + aw > bx && ay < by + bh && ay + ah > by,
  dist: (ax, ay, bx, by) => Math.hypot(bx - ax, by - ay),
  // Move v toward target by at most step
  approach: (v, target, step) =>
    v < target ? Math.min(v + step, target) : Math.max(v - step, target),
  smoothstep: (t) => t * t * (3 - 2 * t),
  easeOutBack: (t) => 1 + 2.7 * Math.pow(t - 1, 3) + 1.7 * Math.pow(t - 1, 2),
  // Deterministic 0..1 hash for stable per-tile texture detail
  hash: (x, y, s = 0) => {
    let h = (x * 374761393 + y * 668265263 + s * 2147483647) | 0;
    h = Math.imul(h ^ (h >>> 13), 1274126177);
    return ((h ^ (h >>> 16)) >>> 0) / 4294967296;
  },
};

// ─────────────────────────────────────────────────────────────────────────────
// TILE PHYSICS (shared by player and enemies)
// Axis-separated AABB vs tile grid. Platforms are one-way (land from above).
// ─────────────────────────────────────────────────────────────────────────────
const Phys = {
  solid: (t) => t === C.T.SOLID || t === C.T.PIPE_H || t === C.T.PIPE_V || t === C.T.LEAD_TILE,
  oneWay: (t) => t === C.T.PLATFORM,

  // True if the box overlaps no solid tile
  free(map, x, y, w, h) {
    const c1 = Math.floor(x / TS), c2 = Math.floor((x + w - 0.01) / TS);
    const r1 = Math.floor(y / TS), r2 = Math.floor((y + h - 0.01) / TS);
    for (let r = r1; r <= r2; r++)
      for (let c = c1; c <= c2; c++)
        if (Phys.solid(map.get(c, r))) return false;
    return true;
  },

  // Move horizontally; returns true when blocked by a wall.
  moveX(e, map, dx) {
    if (!dx) return false;
    e.x += dx;
    const r1 = Math.floor(e.y / TS), r2 = Math.floor((e.y + e.h - 0.01) / TS);
    if (dx > 0) {
      const c = Math.floor((e.x + e.w - 0.01) / TS);
      for (let r = r1; r <= r2; r++) {
        if (Phys.solid(map.get(c, r))) { e.x = c * TS - e.w; return true; }
      }
    } else {
      const c = Math.floor(e.x / TS);
      for (let r = r1; r <= r2; r++) {
        if (Phys.solid(map.get(c, r))) { e.x = (c + 1) * TS; return true; }
      }
    }
    return false;
  },

  // Move vertically; returns 1 = landed, -1 = hit ceiling, 0 = free.
  moveY(e, map, dy, dropThrough = false) {
    if (!dy) return 0;
    const prevBottom = e.y + e.h;
    e.y += dy;
    const c1 = Math.floor(e.x / TS), c2 = Math.floor((e.x + e.w - 0.01) / TS);
    if (dy > 0) {
      const r = Math.floor((e.y + e.h - 0.01) / TS);
      const top = r * TS;
      for (let c = c1; c <= c2; c++) {
        const t = map.get(c, r);
        if (Phys.solid(t) || (Phys.oneWay(t) && !dropThrough && prevBottom <= top + 0.5)) {
          e.y = top - e.h;
          return 1;
        }
      }
    } else {
      const r = Math.floor(e.y / TS);
      for (let c = c1; c <= c2; c++) {
        if (Phys.solid(map.get(c, r))) { e.y = (r + 1) * TS; return -1; }
      }
    }
    return 0;
  },

  // Is there something to stand on just past the leading foot?
  groundAhead(e, map, dir) {
    const fx = dir > 0 ? e.x + e.w + 1 : e.x - 1;
    const t = map.get(Math.floor(fx / TS), Math.floor((e.y + e.h + 2) / TS));
    return Phys.solid(t) || Phys.oneWay(t);
  },

  wallAhead(e, map, dir) {
    const fx = dir > 0 ? e.x + e.w + 1 : e.x - 1;
    const c = Math.floor(fx / TS);
    return Phys.solid(map.get(c, Math.floor((e.y + 2) / TS))) ||
           Phys.solid(map.get(c, Math.floor((e.y + e.h - 2) / TS)));
  },

  // Any tile of the given type overlapping the box?
  touches(map, x, y, w, h, type) {
    const c1 = Math.floor(x / TS), c2 = Math.floor((x + w - 0.01) / TS);
    const r1 = Math.floor(y / TS), r2 = Math.floor((y + h - 0.01) / TS);
    for (let r = r1; r <= r2; r++)
      for (let c = c1; c <= c2; c++)
        if (map.get(c, r) === type) return true;
    return false;
  },
};

// ─────────────────────────────────────────────────────────────────────────────
// MUSIC DATA
// Songs are written in eighth notes: note names (C5, F#4, Bb3), "-" holds the
// previous note, "." rests. Bass lines are built from one root per bar and a
// rhythm pattern (R = root, O = octave up, F = fifth up).
// ─────────────────────────────────────────────────────────────────────────────
const NOTE_IDX = { C: 0, D: 2, E: 4, F: 5, G: 7, A: 9, B: 11 };
const NOTE_NAMES = ['C', 'C#', 'D', 'D#', 'E', 'F', 'F#', 'G', 'G#', 'A', 'A#', 'B'];

function noteMidi(n) {
  const m = /^([A-G])([#b]?)(-?\d)$/.exec(n);
  return 12 * (+m[3] + 1) + NOTE_IDX[m[1]] + (m[2] === '#' ? 1 : m[2] === 'b' ? -1 : 0);
}
function noteFreq(n) { return 440 * Math.pow(2, (noteMidi(n) - 69) / 12); }
function transpose(n, semis) {
  const m = noteMidi(n) + semis;
  return NOTE_NAMES[m % 12] + (Math.floor(m / 12) - 1);
}

const seq = (...bars) => bars.join(' ').trim().split(/\s+/);
const bassLine = (roots, pattern) => roots.flatMap(r => pattern.trim().split(/\s+/).map(p =>
  p === 'R' ? r : p === 'O' ? transpose(r, 12) : p === 'F' ? transpose(r, 7) : p));

const SONGS = {
  // Title + overworld map: warm, unhurried F major
  map: {
    bpm: 100, leadWave: 'triangle', leadVol: 0.12, bassWave: 'sine', bassVol: 0.16, drumVol: 0.12,
    lead: seq('A4 - C5 - F5 - E5 C5', 'E5 - D5 - C5 - G4 -', 'D5 - F5 - A5 - G5 F5', 'D5 - - - Bb4 - C5 D5',
              'C5 - A4 - F4 - A4 C5', 'G5 - E5 - C5 - E5 G5', 'F5 - D5 - A4 - D5 F5', 'E5 - - - C5 - - -'),
    bass: bassLine(['F2', 'C3', 'D3', 'Bb2', 'F2', 'C3', 'D3', 'C3'], 'R - . F R - F .'),
    drums: seq('k . h . s . h .'),
  },
  // World 1 — Surface Mains: bright, bouncy C major
  w0: {
    bpm: 140, leadWave: 'square', leadVol: 0.075, bassWave: 'triangle', bassVol: 0.17,
    lead: seq('E5 - G5 - C6 - B5 A5', 'G5 - - D5 G5 - A5 B5', 'C6 - A5 - E5 - A5 G5', 'F5 - A5 - G5 - . .',
              'E5 G5 C6 G5 E5 G5 C6 D6', 'D6 - B5 - G5 - B5 D6', 'C6 - A5 - F5 A5 C6 A5', 'G5 - - - B5 - D6 -'),
    harm: seq('C5 - E5 - G5 - G5 F5', 'D5 - - B4 D5 - F5 G5', 'A5 - E5 - C5 - E5 E5', 'C5 - F5 - E5 - . .',
              'C5 E5 G5 E5 C5 E5 G5 B5', 'B5 - G5 - D5 - G5 B5', 'A5 - F5 - C5 F5 A5 F5', 'D5 - - - G5 - B5 -'),
    bass: bassLine(['C3', 'G2', 'A2', 'F2', 'C3', 'G2', 'A2', 'G2'], 'R O R O R O R O'),
    drums: seq('k h s h k k s h'),
  },
  // World 2 — Underground Pipes: echoing A minor with water drips
  w1: {
    bpm: 108, leadWave: 'triangle', leadVol: 0.13, bassWave: 'sine', bassVol: 0.2, drumVol: 0.14,
    echo: 0.33, drip: true,
    lead: seq('A4 - C5 - E5 - D5 C5', 'C5 - A4 - F4 - . .', 'B4 - D5 - G5 - F5 E5', 'E5 - - - B4 - . .',
              'A5 - G5 E5 - C5 D5 E5', 'F5 - E5 C5 - A4 C5 -', 'D5 - B4 G4 - B4 D5 F5', 'E5 - - - G#4 - B4 -'),
    bass: bassLine(['A2', 'F2', 'G2', 'E2', 'A2', 'F2', 'G2', 'E2'], 'R - . R F - R .'),
    drums: seq('k . . h s . h .', 'k . h . s . . h'),
  },
  // World 3 — Treatment Plant: mechanical, busy D dorian
  w2: {
    bpm: 144, leadWave: 'sawtooth', leadVol: 0.07, leadLp: 2400, bassWave: 'square', bassVol: 0.09, bassLp: 700,
    lead: seq('D5 F5 A5 F5 D5 F5 A5 C6', 'B5 - G5 - D5 - B4 D5', 'F5 E5 D5 E5 F5 G5 A5 -', 'G5 - E5 - C5 - E5 G5',
              'A5 - D6 - C6 A5 G5 F5', 'G5 - B5 - D6 - B5 G5', 'F5 - D5 - Bb4 - D5 F5', 'E5 - G5 - C6 - - -'),
    bass: bassLine(['D2', 'G2', 'D2', 'C2', 'D2', 'G2', 'Bb1', 'C2'], 'R R O R R O R O'),
    drums: seq('k h m s k h s m'),
  },
  // World 4 — Distribution Net: driving E minor at dusk
  w3: {
    bpm: 152, leadWave: 'square', leadVol: 0.075, bassWave: 'sawtooth', bassVol: 0.1, bassLp: 520,
    lead: seq('E5 - B4 E5 G5 - F#5 E5', 'G5 - E5 - C5 - E5 G5', 'A5 - F#5 D5 A5 - B5 A5', 'F#5 - D#5 - B4 - - -',
              'B5 - A5 G5 F#5 - G5 A5', 'G5 - E5 - G5 A5 B5 C6', 'D6 - C6 B5 A5 - F#5 A5', 'B5 - - - D#5 F#5 B5 -'),
    harm: seq('G4 - G4 G4 B4 - A4 G4', 'E5 - C5 - G4 - C5 E5', 'F#5 - D5 A4 F#5 - G5 F#5', 'D#5 - B4 - F#4 - - -',
              'G5 - F#5 E5 D5 - E5 F#5', 'E5 - C5 - E5 F#5 G5 A5', 'A5 - A5 G5 F#5 - D5 F#5', 'F#5 - - - B4 D#5 F#5 -'),
    bass: bassLine(['E2', 'C2', 'D2', 'B1', 'E2', 'C2', 'D2', 'B1'], 'R R R O R R O R'),
    drums: seq('k h s h k k s h', 'k h s h k k s s'),
  },
  // Boss fights: urgent C minor
  boss: {
    bpm: 168, leadWave: 'sawtooth', leadVol: 0.07, leadLp: 3000, bassWave: 'square', bassVol: 0.1, bassLp: 450, drumVol: 0.2,
    lead: seq('C5 C5 Eb5 C5 G5 - F5 Eb5', 'Ab4 - C5 Eb5 Ab5 - G5 F5', 'Bb4 - D5 F5 Bb5 - Ab5 G5', 'G5 - F5 - D5 - B4 -',
              'C5 C5 Eb5 C5 G5 - F5 Eb5', 'Ab4 - C5 Eb5 Ab5 - G5 F5', 'Bb4 - D5 F5 Bb5 - C6 D6', 'G5 G5 B5 D6 G6 - - -'),
    bass: bassLine(['C2', 'Ab1', 'Bb1', 'G1', 'C2', 'Ab1', 'Bb1', 'G1'], 'R R O R R R O R'),
    drums: seq('k h s h k k s s'),
  },
};
SONGS.title = SONGS.map;

// ─────────────────────────────────────────────────────────────────────────────
// AUDIO ENGINE
// ─────────────────────────────────────────────────────────────────────────────
class AudioEngine {
  constructor() {
    this.ctx = null;
    this.masterGain = null;
    this.sfxGain = null;
    this.bgGain = null;
    this.bgNode = null;
    this.enabled = true;
    this.ready = false;
  }

  init() {
    if (this.ready) return;
    try {
      this.ctx = new (window.AudioContext || window.webkitAudioContext)();
      this.masterGain = this.ctx.createGain();
      this.masterGain.gain.value = 0.6;
      this.masterGain.connect(this.ctx.destination);

      this.sfxGain = this.ctx.createGain();
      this.sfxGain.gain.value = 0.8;
      this.sfxGain.connect(this.masterGain);

      this.bgGain = this.ctx.createGain();
      this.bgGain.gain.value = 0.35;
      this.bgGain.connect(this.masterGain);

      // Shared white-noise buffer for drums and spray sounds
      const len = this.ctx.sampleRate;
      this._noise = this.ctx.createBuffer(1, len, this.ctx.sampleRate);
      const nd = this._noise.getChannelData(0);
      for (let i = 0; i < len; i++) nd[i] = Math.random() * 2 - 1;

      this.ready = true;
    } catch (e) {
      console.warn('AudioContext not available:', e);
    }
  }

  resume() {
    if (this.ctx && this.ctx.state === 'suspended') this.ctx.resume();
  }

  // Generic tone burst
  _tone(freq, type, dur, gain, dst) {
    if (!this.ready || !this.enabled) return;
    const osc = this.ctx.createOscillator();
    const g   = this.ctx.createGain();
    osc.type = type;
    osc.frequency.setValueAtTime(freq, this.ctx.currentTime);
    g.gain.setValueAtTime(gain, this.ctx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + dur);
    osc.connect(g);
    g.connect(dst);
    osc.start();
    osc.stop(this.ctx.currentTime + dur);
  }

  // ── SFX ─────────────────────────────────────────────────────────────────
  sfxJump() {
    if (!this.ready) return;
    const osc = this.ctx.createOscillator();
    const g   = this.ctx.createGain();
    osc.type = 'square';
    osc.frequency.setValueAtTime(220, this.ctx.currentTime);
    osc.frequency.exponentialRampToValueAtTime(440, this.ctx.currentTime + 0.12);
    g.gain.setValueAtTime(0.25, this.ctx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + 0.2);
    osc.connect(g); g.connect(this.sfxGain);
    osc.start(); osc.stop(this.ctx.currentTime + 0.2);
  }

  sfxCoin() {
    [880, 1100, 1320].forEach((f, i) => {
      this._tone(f, 'sine', 0.12, 0.3, this.sfxGain);
    });
  }

  sfxHurt() {
    this._tone(120, 'sawtooth', 0.3, 0.4, this.sfxGain);
  }

  sfxDie() {
    const freqs = [300, 250, 200, 150, 100];
    freqs.forEach((f, i) => {
      setTimeout(() => this._tone(f, 'sawtooth', 0.15, 0.35, this.sfxGain), i * 60);
    });
  }

  sfxPowerup() {
    [523, 659, 784, 1047].forEach((f, i) => {
      setTimeout(() => this._tone(f, 'sine', 0.15, 0.3, this.sfxGain), i * 70);
    });
  }

  sfxValve() {
    // whoosh + rising tone for level exit
    const dur = 0.6;
    const osc = this.ctx.createOscillator();
    const g   = this.ctx.createGain();
    osc.type = 'sine';
    osc.frequency.setValueAtTime(220, this.ctx.currentTime);
    osc.frequency.exponentialRampToValueAtTime(1760, this.ctx.currentTime + dur);
    g.gain.setValueAtTime(0.4, this.ctx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + dur);
    osc.connect(g); g.connect(this.sfxGain);
    osc.start(); osc.stop(this.ctx.currentTime + dur);
  }

  sfxEnemyHit() {
    this._tone(180, 'square', 0.15, 0.3, this.sfxGain);
  }

  sfxSplash() {
    // White noise burst
    if (!this.ready) return;
    const buf  = this.ctx.createBuffer(1, this.ctx.sampleRate * 0.2, this.ctx.sampleRate);
    const data = buf.getChannelData(0);
    for (let i = 0; i < data.length; i++) data[i] = Math.random() * 2 - 1;
    const src = this.ctx.createBufferSource();
    const flt = this.ctx.createBiquadFilter();
    const g   = this.ctx.createGain();
    src.buffer = buf;
    flt.type = 'bandpass';
    flt.frequency.value = 800;
    g.gain.setValueAtTime(0.3, this.ctx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + 0.2);
    src.connect(flt); flt.connect(g); g.connect(this.sfxGain);
    src.start(); src.stop(this.ctx.currentTime + 0.2);
  }

  sfxBossHit() {
    this._tone(80, 'sawtooth', 0.25, 0.5, this.sfxGain);
    setTimeout(() => this._tone(100, 'square', 0.2, 0.3, this.sfxGain), 100);
  }

  sfxBossDie() {
    const seq = [200,180,160,140,120,100,80,60];
    seq.forEach((f, i) => setTimeout(() => this._tone(f, 'sawtooth', 0.2, 0.4, this.sfxGain), i * 80));
  }

  sfxMenuSelect() {
    this._tone(660, 'sine', 0.1, 0.2, this.sfxGain);
  }

  sfxMenuMove() {
    this._tone(440, 'sine', 0.08, 0.15, this.sfxGain);
  }

  // ── BACKGROUND MUSIC ────────────────────────────────────────────────────
  // Step sequencer: each song has lead / bass / drum channels written in
  // eighth notes ("-" holds the previous note, "." is a rest). Notes are
  // scheduled slightly ahead on the audio clock so timing never drifts.
  startBGM(track = 'map') {
    if (!this.ready) return;
    if (this._song === track && this._bgmTimer) return; // already playing
    this.stopBGM();
    const song = SONGS[track] || SONGS.map;
    this._song = track;
    const ac = this.ctx;
    const bus = ac.createGain();
    bus.gain.value = 1;
    bus.connect(this.bgGain);
    let echo = null;
    if (song.echo) { // cavern echo for the sewer
      const d = ac.createDelay(1), fb = ac.createGain(), wet = ac.createGain();
      d.delayTime.value = song.echo; fb.gain.value = 0.38; wet.gain.value = 0.45;
      d.connect(fb); fb.connect(d); d.connect(wet); wet.connect(bus);
      echo = d;
    }
    this._bus = bus;
    const sd = 60 / song.bpm / 2;
    let step = 0, next = ac.currentTime + 0.06;
    const tick = () => {
      while (next < ac.currentTime + 0.18) {
        this._playStep(song, step, next, sd, bus, echo);
        next += sd;
        step++;
      }
    };
    tick();
    this._bgmTimer = setInterval(tick, 30);
  }

  stopBGM() {
    if (this._bgmTimer) { clearInterval(this._bgmTimer); this._bgmTimer = null; }
    this._song = null;
    if (this._bus && this.ctx) {
      const bus = this._bus;
      bus.gain.setTargetAtTime(0, this.ctx.currentTime, 0.06);
      setTimeout(() => { try { bus.disconnect(); } catch (e) {} }, 500);
      this._bus = null;
    }
  }

  _hold(arr, i) { // number of steps a note lasts
    let n = 1;
    while (arr[(i + n) % arr.length] === '-' && n < arr.length) n++;
    return n;
  }

  _note(dst, freq, t, dur, wave, vol, opts = {}) {
    const ac = this.ctx;
    const o = ac.createOscillator(), g = ac.createGain();
    o.type = wave;
    o.frequency.setValueAtTime(freq, t);
    if (opts.vib && dur > 0.25) { // gentle vibrato on long notes
      const lfo = ac.createOscillator(), lg = ac.createGain();
      lfo.frequency.value = 5.5; lg.gain.value = freq * 0.006;
      lfo.connect(lg); lg.connect(o.frequency);
      lfo.start(t + 0.12); lfo.stop(t + dur + 0.05);
    }
    g.gain.setValueAtTime(0.0001, t);
    g.gain.linearRampToValueAtTime(vol, t + 0.008);
    g.gain.setTargetAtTime(vol * (opts.sustain ?? 0.6), t + 0.03, 0.08);
    g.gain.setTargetAtTime(0.0001, t + dur * 0.9, 0.03);
    let out = o;
    if (opts.lp) {
      const f = ac.createBiquadFilter();
      f.type = 'lowpass'; f.frequency.value = opts.lp; f.Q.value = 2;
      o.connect(f); out = f;
    }
    out.connect(g);
    g.connect(dst);
    if (opts.send) g.connect(opts.send);
    o.start(t);
    o.stop(t + dur + 0.1);
  }

  _drum(dst, kind, t, vol) {
    const ac = this.ctx;
    if (kind === 'k') {
      const o = ac.createOscillator(), g = ac.createGain();
      o.frequency.setValueAtTime(150, t);
      o.frequency.exponentialRampToValueAtTime(42, t + 0.14);
      g.gain.setValueAtTime(vol * 1.6, t);
      g.gain.exponentialRampToValueAtTime(0.001, t + 0.18);
      o.connect(g); g.connect(dst); o.start(t); o.stop(t + 0.2);
      return;
    }
    const src = ac.createBufferSource(), f = ac.createBiquadFilter(), g = ac.createGain();
    src.buffer = this._noise;
    const len = kind === 's' ? 0.13 : kind === 'm' ? 0.08 : 0.035;
    f.type = kind === 's' ? 'bandpass' : 'highpass';
    f.frequency.value = kind === 's' ? 1800 : kind === 'm' ? 5000 : 7500;
    g.gain.setValueAtTime(vol * (kind === 's' ? 1 : kind === 'm' ? 0.5 : 0.35), t);
    g.gain.exponentialRampToValueAtTime(0.001, t + len);
    src.connect(f); f.connect(g); g.connect(dst);
    src.start(t, Math.random() * 0.5); src.stop(t + len + 0.02);
  }

  _playStep(song, step, t, sd, bus, echo) {
    const L = song.lead, B = song.bass, D = song.drums;
    const li = step % L.length, bi = step % B.length, di = step % D.length;
    const ln = L[li], bn = B[bi], dn = D[di];
    if (ln !== '-' && ln !== '.') {
      this._note(bus, noteFreq(ln), t, sd * this._hold(L, li) * 0.95, song.leadWave, song.leadVol ?? 0.09,
        { vib: true, lp: song.leadLp, send: echo, sustain: song.leadSus });
    }
    if (song.harm) { // quiet harmony line a sixth/third under the lead
      const H = song.harm, hn = H[step % H.length];
      if (hn !== '-' && hn !== '.') this._note(bus, noteFreq(hn), t, sd * this._hold(H, step % H.length) * 0.95, 'triangle', 0.05, { send: echo });
    }
    if (bn !== '-' && bn !== '.') {
      this._note(bus, noteFreq(bn), t, sd * this._hold(B, bi) * 0.9, song.bassWave, song.bassVol ?? 0.13, { lp: song.bassLp, sustain: 0.8 });
    }
    if (dn !== '.') this._drum(bus, dn, t, song.drumVol ?? 0.18);
    if (song.drip && step % 16 === 11) { // water-drip plink
      this._note(bus, 1400 + Math.random() * 900, t, 0.06, 'sine', 0.05, { send: echo, sustain: 0.1 });
    }
  }

  // One-shot fanfares
  sfxFanfare(big = false) {
    if (!this.ready) return;
    const t0 = this.ctx.currentTime + 0.05;
    const seq = big
      ? [['C5', 0], ['E5', 1], ['G5', 2], ['C6', 3], ['G5', 4], ['C6', 5], ['E6', 6], ['G6', 7]]
      : [['G4', 0], ['C5', 1], ['E5', 2], ['G5', 3], ['C6', 4]];
    const sd = big ? 0.12 : 0.1;
    seq.forEach(([n, i], k) => {
      const last = k === seq.length - 1;
      this._note(this.sfxGain, noteFreq(n), t0 + i * sd, last ? 0.6 : sd * 0.95, 'square', 0.12, { vib: last });
      this._note(this.sfxGain, noteFreq(n) / 2, t0 + i * sd, last ? 0.6 : sd * 0.95, 'triangle', 0.1);
    });
  }

  sfxShoot() {
    if (!this.ready) return;
    const t = this.ctx.currentTime;
    const src = this.ctx.createBufferSource(), f = this.ctx.createBiquadFilter(), g = this.ctx.createGain();
    src.buffer = this._noise;
    f.type = 'bandpass';
    f.frequency.setValueAtTime(2600, t);
    f.frequency.exponentialRampToValueAtTime(700, t + 0.12);
    g.gain.setValueAtTime(0.22, t);
    g.gain.exponentialRampToValueAtTime(0.001, t + 0.14);
    src.connect(f); f.connect(g); g.connect(this.sfxGain);
    src.start(t, Math.random()); src.stop(t + 0.16);
    this._note(this.sfxGain, 900, t, 0.05, 'sine', 0.06, { sustain: 0.2 });
  }

  sfxLocked() {
    if (!this.ready) return;
    const t = this.ctx.currentTime;
    this._note(this.sfxGain, 220, t, 0.09, 'square', 0.08, { lp: 1200 });
    this._note(this.sfxGain, 165, t + 0.1, 0.14, 'square', 0.08, { lp: 1200 });
  }

  setVolume(v) {
    if (this.masterGain) this.masterGain.gain.value = M.clamp(v, 0, 1);
  }

  toggleMute() {
    this.enabled = !this.enabled;
    if (this.masterGain) this.masterGain.gain.value = this.enabled ? 0.6 : 0;
    return this.enabled;
  }
}

// ─────────────────────────────────────────────────────────────────────────────
// INPUT HANDLER
// `keys` = held state, `pressed` = edge-triggered presses that persist until a
// simulation step consumes them (flush), so no press is lost or double-counted
// regardless of display refresh rate.
// ─────────────────────────────────────────────────────────────────────────────
class InputHandler {
  constructor() {
    this.keys    = {};
    this.pressed = {};
    this.mobile  = { left: false, right: false, up: false, down: false, jump: false, action: false, pause: false };
    this.onAnyInput = null; // callback (used to unlock audio)
    this._bind();
    this._bindMobile();
  }

  _bind() {
    window.addEventListener('keydown', e => {
      if (!this.keys[e.code]) this.pressed[e.code] = true;
      this.keys[e.code] = true;
      if (['Space','ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.code)) {
        e.preventDefault();
      }
      if (this.onAnyInput) this.onAnyInput();
    });
    window.addEventListener('keyup', e => {
      this.keys[e.code] = false;
    });
    // Releasing focus (alt-tab) must not leave keys stuck down
    window.addEventListener('blur', () => {
      this.keys = {};
      Object.keys(this.mobile).forEach(k => { this.mobile[k] = false; });
    });
  }

  _bindMobile() {
    // Each button sets a held flag and emits the equivalent key press so menus
    // and jump buffering work identically on touch.
    const map = {
      btnLeft:   ['left',   'ArrowLeft'],
      btnRight:  ['right',  'ArrowRight'],
      btnUp:     ['up',     'ArrowUp'],
      btnDown:   ['down',   'ArrowDown'],
      btnJump:   ['jump',   'Space'],
      btnAction: ['action', 'Enter'],
      btnPause:  ['pause',  'Escape'],
    };
    const markTouch = () => document.body.classList.add('touch');
    // Phones/tablets get the on-screen controls straight away
    if (window.matchMedia && window.matchMedia('(pointer: coarse)').matches) markTouch();
    window.addEventListener('touchstart', markTouch, { once: true, passive: true });
    // Tapping the game area works like ENTER (start, menus, result screens)
    const cv = document.getElementById('gameCanvas');
    if (cv) {
      cv.addEventListener('touchstart', (e) => {
        e.preventDefault();
        this.pressed['Enter'] = true;
        if (this.onAnyInput) this.onAnyInput();
      }, { passive: false });
    }

    Object.entries(map).forEach(([id, [key, code]]) => {
      const el = document.getElementById(id);
      if (!el) return;
      const down = (e) => {
        if (e) e.preventDefault();
        if (!this.mobile[key]) this.pressed[code] = true;
        this.mobile[key] = true;
        el.classList.add('on');
        if (this.onAnyInput) this.onAnyInput();
      };
      const up = (e) => {
        if (e) e.preventDefault();
        this.mobile[key] = false;
        el.classList.remove('on');
      };
      el.addEventListener('touchstart',  down, { passive: false });
      el.addEventListener('touchend',    up,   { passive: false });
      el.addEventListener('touchcancel', up,   { passive: false });
      el.addEventListener('mousedown',   down);
      el.addEventListener('mouseup',     up);
      el.addEventListener('mouseleave',  up);
    });
  }

  // Held state (keyboard + touch)
  get left()     { return !!(this.keys['ArrowLeft']  || this.keys['KeyA'] || this.mobile.left); }
  get right()    { return !!(this.keys['ArrowRight'] || this.keys['KeyD'] || this.mobile.right); }
  get up()       { return !!(this.keys['ArrowUp']    || this.keys['KeyW'] || this.mobile.up); }
  get down()     { return !!(this.keys['ArrowDown']  || this.keys['KeyS'] || this.mobile.down); }
  get jumpHeld() { return !!(this.keys['Space'] || this.keys['ArrowUp'] || this.keys['KeyW'] ||
                             this.mobile.jump || this.mobile.up); }
  get jump()     { return this.jumpHeld; }
  get action()   { return !!(this.keys['KeyE'] || this.mobile.action); }
  get pause()    { return !!(this.keys['Escape'] || this.keys['KeyP']); }
  get fireHeld() { return !!(this.keys['KeyX'] || this.keys['KeyF'] || this.keys['KeyE'] || this.keys['Enter'] || this.mobile.action); }

  // Edge-triggered presses
  wasPressed(code) { return !!this.pressed[code]; }
  jumpPressed()    { return !!(this.pressed['ArrowUp'] || this.pressed['KeyW'] || this.pressed['Space']); }
  actionPressed()  { return !!(this.pressed['KeyE'] || this.pressed['Enter']); }
  pausePressed()   { return !!(this.pressed['Escape'] || this.pressed['KeyP']); }
  firePressed()    { return !!(this.pressed['KeyX'] || this.pressed['KeyF'] || this.pressed['KeyE'] || this.pressed['Enter']); }
  enterPressed()   { return !!(this.pressed['Enter'] || this.pressed['Space']); }
  anyPressed()     { return Object.keys(this.pressed).some(k => this.pressed[k]); }

  flush() { this.pressed = {}; }
}

// ─────────────────────────────────────────────────────────────────────────────
// SAVE SYSTEM
// ─────────────────────────────────────────────────────────────────────────────
class SaveSystem {
  constructor() {
    this.data = this._default();
    this.load();
  }

  _default() {
    return {
      currentWorld: 0,
      currentLevel: 0,
      unlockedLevels: [[true, false, false, false], [false, false, false, false],
                       [false, false, false, false], [false, false, false, false, false]],
      highScores: {},
      coinsTotal: 0,
      character: 'm',
      soundOn: true,
      musicOn: true,
    };
  }

  load() {
    try {
      const raw = localStorage.getItem(C.SAVE_KEY);
      if (raw) {
        const parsed = JSON.parse(raw);
        this.data = Object.assign(this._default(), parsed);
      }
    } catch (e) {
      this.data = this._default();
    }
  }

  save() {
    try {
      localStorage.setItem(C.SAVE_KEY, JSON.stringify(this.data));
    } catch (e) {}
  }

  unlockLevel(world, level) {
    if (!this.data.unlockedLevels[world]) return;
    if (level < this.data.unlockedLevels[world].length) {
      this.data.unlockedLevels[world][level] = true;
    }
    this.save();
  }

  isUnlocked(world, level) {
    return !!(this.data.unlockedLevels[world] && this.data.unlockedLevels[world][level]);
  }

  setHighScore(world, level, score) {
    const key = `${world}_${level}`;
    if (!this.data.highScores[key] || score > this.data.highScores[key]) {
      this.data.highScores[key] = score;
      this.save();
    }
  }

  getHighScore(world, level) {
    return this.data.highScores[`${world}_${level}`] || 0;
  }

  addCoins(n) {
    this.data.coinsTotal += n;
    this.save();
  }

  reset() {
    this.data = this._default();
    this.save();
  }
}

// ─────────────────────────────────────────────────────────────────────────────
// PARTICLE SYSTEM
// World-space particles (drawn with camera offset). Kinds:
//   dot | square | ring | spark | bubble | droplet | dust | text
// ─────────────────────────────────────────────────────────────────────────────
class Particle {
  constructor(x, y, o = {}) {
    this.x = x; this.y = y;
    this.vx = o.vx ?? 0;
    this.vy = o.vy ?? 0;
    this.life = this.maxLife = o.life ?? 0.6;
    this.size    = o.size ?? 4;
    this.color   = o.color ?? C.COL.WATER_L;
    this.gravity = o.gravity ?? 0.2;
    this.drag    = o.drag ?? 0.97;
    this.kind    = o.kind ?? 'dot';
    this.shrink  = o.shrink ?? true;
    this.additive = !!o.additive;
    this.rot  = o.rot ?? Math.random() * Math.PI * 2;
    this.spin = o.spin ?? 0;
    this.text = o.text ?? '';
    this.dead = false;
  }

  update(dt) {
    this.vx *= this.drag;
    this.vy = this.vy * this.drag + this.gravity;
    this.x += this.vx;
    this.y += this.vy;
    this.rot += this.spin;
    this.life -= dt;
    if (this.life <= 0) this.dead = true;
  }

  draw(ctx, camX, camY) {
    const x = this.x - camX, y = this.y - camY;
    if (x < -60 || x > C.W + 60 || y < -60 || y > C.H + 60) return;
    const t = Math.max(0, this.life / this.maxLife); // 1 → 0
    const s = this.shrink ? this.size * (0.25 + 0.75 * t) : this.size;
    ctx.globalAlpha = this.kind === 'text' ? Math.min(1, t * 2.5) : Math.min(1, t * 1.6);
    switch (this.kind) {
      case 'square':
        ctx.save();
        ctx.translate(x, y);
        ctx.rotate(this.rot);
        ctx.fillStyle = this.color;
        ctx.fillRect(-s / 2, -s / 2, s, s);
        ctx.restore();
        break;
      case 'ring': {
        const r = this.size * (1.25 - t);
        ctx.strokeStyle = this.color;
        ctx.lineWidth = 3 * t + 0.5;
        ctx.beginPath();
        ctx.arc(x, y, Math.max(0.5, r), 0, Math.PI * 2);
        ctx.stroke();
        break;
      }
      case 'spark':
        ctx.strokeStyle = this.color;
        ctx.lineWidth = Math.max(1, s * 0.5);
        ctx.lineCap = 'round';
        ctx.beginPath();
        ctx.moveTo(x, y);
        ctx.lineTo(x - this.vx * 2.2, y - this.vy * 2.2);
        ctx.stroke();
        break;
      case 'bubble':
        ctx.strokeStyle = this.color;
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.arc(x, y, s / 2, 0, Math.PI * 2);
        ctx.stroke();
        ctx.fillStyle = 'rgba(255,255,255,0.7)';
        ctx.fillRect(x - s * 0.22, y - s * 0.22, Math.max(1, s * 0.18), Math.max(1, s * 0.18));
        break;
      case 'droplet':
        ctx.fillStyle = this.color;
        ctx.beginPath();
        ctx.moveTo(x, y - s);
        ctx.quadraticCurveTo(x + s * 0.7, y, x, y + s * 0.55);
        ctx.quadraticCurveTo(x - s * 0.7, y, x, y - s);
        ctx.fill();
        break;
      case 'dust':
        ctx.fillStyle = this.color;
        ctx.beginPath();
        ctx.arc(x, y, s / 2 * (1.6 - t * 0.6), 0, Math.PI * 2);
        ctx.fill();
        break;
      case 'text':
        ctx.font = `bold ${this.size}px 'Courier New', monospace`;
        ctx.textAlign = 'center';
        ctx.lineWidth = 3;
        ctx.strokeStyle = 'rgba(10,18,32,0.85)';
        ctx.strokeText(this.text, x, y);
        ctx.fillStyle = this.color;
        ctx.fillText(this.text, x, y);
        break;
      default:
        ctx.fillStyle = this.color;
        ctx.beginPath();
        ctx.arc(x, y, s / 2, 0, Math.PI * 2);
        ctx.fill();
    }
  }
}

class ParticleSystem {
  constructor() { this.pool = []; }

  // opts: count-wide ranges (vxMin/vxMax/vyMin/vyMax/lifeMin/lifeMax/sizeMin/sizeMax)
  //       or polar (speed/speedMin, angle, spread) plus any Particle option.
  emit(x, y, count, opts = {}) {
    for (let i = 0; i < count; i++) {
      let vx, vy;
      if (opts.speed !== undefined) {
        const a = (opts.angle ?? -Math.PI / 2) + (Math.random() - 0.5) * (opts.spread ?? Math.PI * 2);
        const sp = M.rand(opts.speedMin ?? opts.speed * 0.4, opts.speed);
        vx = Math.cos(a) * sp; vy = Math.sin(a) * sp;
      } else {
        vx = M.rand(opts.vxMin ?? -3, opts.vxMax ?? 3);
        vy = M.rand(opts.vyMin ?? -5, opts.vyMax ?? -1);
      }
      this.pool.push(new Particle(
        x + (opts.jitter ? M.rand(-opts.jitter, opts.jitter) : 0),
        y + (opts.jitterY ? M.rand(-opts.jitterY, opts.jitterY) : 0), {
        ...opts,
        vx, vy,
        life: M.rand(opts.lifeMin ?? 0.3, opts.lifeMax ?? 0.8),
        size: M.rand(opts.sizeMin ?? 2, opts.sizeMax ?? 6),
        color: Array.isArray(opts.color) ? M.randPick(opts.color) : (opts.color ?? C.COL.WATER_L),
        gravity: opts.gravity ?? 0.25,
      }));
    }
    if (this.pool.length > 700) this.pool.splice(0, this.pool.length - 700);
  }

  floatText(x, y, text, color = '#fff', size = 13) {
    this.pool.push(new Particle(x, y, {
      kind: 'text', text, color, size, vy: -1.6, gravity: 0.02, drag: 0.96,
      life: 0.9, shrink: false,
    }));
  }

  update(dt) {
    for (const p of this.pool) p.update(dt);
    this.pool = this.pool.filter(p => !p.dead);
  }

  draw(ctx, camX = 0, camY = 0) {
    ctx.save();
    for (const p of this.pool) if (!p.additive) p.draw(ctx, camX, camY);
    ctx.globalCompositeOperation = 'lighter';
    for (const p of this.pool) if (p.additive) p.draw(ctx, camX, camY);
    ctx.restore();
  }
}

// ─────────────────────────────────────────────────────────────────────────────
// BASE ENTITY CLASS
// px/py hold the previous step's position for render interpolation.
// ─────────────────────────────────────────────────────────────────────────────
class Entity {
  constructor(x, y, w, h) {
    this.x = x; this.y = y; this.w = w; this.h = h;
    this.px = x; this.py = y;
    this.vx = 0; this.vy = 0;
    this.dead = false;
    this.hp = 1;
    this.flash = 0;           // hit-flash timer (seconds)
    this.t = Math.random() * 10; // per-entity animation clock
  }
  get cx() { return this.x + this.w / 2; }
  get cy() { return this.y + this.h / 2; }
  get right()  { return this.x + this.w; }
  get bottom() { return this.y + this.h; }

  snapshot() { this.px = this.x; this.py = this.y; }

  overlaps(other) {
    return M.overlap(this.x, this.y, this.w, this.h, other.x, other.y, other.w, other.h);
  }
}

// Soft contact shadow under a character
function drawShadow(ctx, x, y, rx, alpha = 0.28) {
  ctx.fillStyle = `rgba(0,0,0,${alpha})`;
  ctx.beginPath();
  ctx.ellipse(x, y, rx, rx * 0.28, 0, 0, Math.PI * 2);
  ctx.fill();
}

// ─────────────────────────────────────────────────────────────────────────────
// PLAYER — SJWD utility worker
// ─────────────────────────────────────────────────────────────────────────────
class Player extends Entity {
  constructor(x, y, input, audio, particles) {
    super(x, y, C.PLAYER_W, C.PLAYER_H);
    this.input = input;
    this.audio = audio;
    this.particles = particles;

    this.hp = 5;
    this.maxHp = 5;
    this.gender = 'm';      // 'm' | 'f' — chosen on the worker select screen
    this.blaster = 0;       // seconds of water cannon remaining
    this.fireCd = 0;        // steps until the next shot
    this.fireAnim = 0;      // recoil
    this.coins = 0;
    this.score = 0;

    this.facing = 1;
    this.onGround = false;
    this.inWater = false;
    this.invTimer = 0;
    this.coyote = 0;
    this.jumpBuf = 0;
    this.jumping = false;     // rising from a ground jump (variable height active)
    this.dropTimer = 0;       // steps of ignoring one-way platforms
    this.ctrlLock = 0;        // steps of no input after knockback
    this.airSteps = 0;
    this.peakVy = 0;

    // Abilities
    this.hasDoubleJump = false;
    this.doubleJumped = false;
    this.hasFlippers = false;

    // Squash & stretch (spring toward 1)
    this.sx = 1; this.sy = 1;

    // Animation
    this.anim = { state: 'idle', run: 0, blink: 0, blinkIn: 2.5, lastStep: 0 };

    this.lastSafe = { x, y };
    this.safeTimer = 0;
    this.dead = false;
    this.deathTime = 0;
    this.wonLevel = false;
  }

  get facingRight() { return this.facing > 0; }

  update(dt, map) {
    if (this.wonLevel) return;
    if (this.dead) { this._updateDead(dt); return; }

    const inp = this.input, P = C.P;
    if (this.invTimer > 0) this.invTimer -= dt;
    if (this.blaster > 0) this.blaster = Math.max(0, this.blaster - dt);
    if (this.fireCd > 0) this.fireCd--;
    if (this.fireAnim > 0) this.fireAnim = Math.max(0, this.fireAnim - dt * 8);
    if (this.ctrlLock > 0) this.ctrlLock--;
    if (this.dropTimer > 0) this.dropTimer--;

    let dir = 0;
    if (this.ctrlLock <= 0) {
      if (inp.left) dir -= 1;
      if (inp.right) dir += 1;
    }
    if (inp.jumpPressed()) this.jumpBuf = P.JUMP_BUFFER;
    else if (this.jumpBuf > 0) this.jumpBuf--;
    const jumpHeld = inp.jumpHeld;

    // Water detection (torso area)
    const wasInWater = this.inWater;
    this.inWater = Phys.touches(map, this.x + 4, this.y + 10, this.w - 8, this.h - 12, C.T.WATER);
    if (this.inWater !== wasInWater && Math.abs(this.vy) > 1.5) this._splash();

    if (this.inWater) this._swim(dir, jumpHeld, map);
    else this._run(dir, jumpHeld, map);

    // Head-bump corner correction: slide around ledges instead of stopping dead
    if (this.vy < 0 && !Phys.free(map, this.x, this.y + this.vy, this.w, this.h)) {
      for (let o = 1; o <= P.CORNER_NUDGE; o++) {
        if (Phys.free(map, this.x + o, this.y + this.vy, this.w, this.h)) { this.x += o; break; }
        if (Phys.free(map, this.x - o, this.y + this.vy, this.w, this.h)) { this.x -= o; break; }
      }
    }

    // Integrate
    if (Phys.moveX(this, map, this.vx)) this.vx = 0;
    const wasGround = this.onGround;
    const hit = Phys.moveY(this, map, this.vy, this.dropTimer > 0);
    this.onGround = hit === 1;
    if (hit === 1) {
      if (!wasGround) this._land();
      this.vy = 0;
      this.jumping = false;
      this.doubleJumped = false;
    } else if (hit === -1) {
      this.vy = 0.5;
      this.jumping = false;
    }

    if (this.onGround) { this.coyote = P.COYOTE; this.airSteps = 0; }
    else { if (this.coyote > 0) this.coyote--; this.airSteps++; this.peakVy = Math.max(this.peakVy, this.vy); }

    this._hazards(map);
    this._trackSafeSpot(map, dt);

    // Fell out of the world (bottomless pit)
    if (this.y > map.rows * TS + 48) {
      this.takeDamage(1, null);
      if (!this.dead) this.respawnAt(this.lastSafe.x, this.lastSafe.y);
    }

    this._updateAnim(dt);
  }

  _run(dir, jumpHeld, map) {
    const P = C.P;
    const accel = this.onGround ? P.ACCEL : P.AIR_ACCEL;
    const fric  = this.onGround ? P.FRICTION : P.AIR_FRICTION;

    if (dir !== 0) {
      this.facing = dir;
      const turning = Math.sign(this.vx) === -dir && Math.abs(this.vx) > 0.6;
      this.vx = M.approach(this.vx, dir * P.RUN_MAX, turning ? accel + fric : accel);
      if (turning && this.onGround && Math.abs(this.vx) > 2.2 && Math.random() < 0.6) {
        this._dust(this.cx - dir * 6, this.bottom, 1, 0.8);
      }
    } else {
      this.vx = M.approach(this.vx, 0, fric);
    }

    // Gravity shaping: floaty rise while held, snappier fall, brief apex hang
    let g = P.GRAVITY;
    if (this.vy < 0 && this.jumping && jumpHeld) g *= P.JUMP_HOLD_GRAV;
    else if (this.vy > 0) g *= P.FALL_GRAV;
    if (Math.abs(this.vy) < P.APEX_THRESH && jumpHeld && !this.onGround) g *= P.APEX_GRAV;
    this.vy = Math.min(this.vy + g, P.MAX_FALL);

    // Releasing jump early cuts the ascent (variable jump height)
    if (this.jumping && !jumpHeld && this.vy < P.JUMP_CUT_VY) this.vy = P.JUMP_CUT_VY;

    if (this.jumpBuf > 0) {
      const onOneWay = this.onGround && this._standingOnOneWay(map);
      if ((this.onGround || this.coyote > 0) && this.input.down && onOneWay) {
        // Drop through a one-way platform
        this.dropTimer = 12;
        this.jumpBuf = 0;
        this.onGround = false;
        this.y += 2;
      } else if (this.onGround || this.coyote > 0) {
        this.vy = P.JUMP_V - Math.abs(this.vx) * 0.12;
        this.jumping = true;
        this.jumpBuf = 0;
        this.coyote = 0;
        this.onGround = false;
        this.sx = 0.72; this.sy = 1.3;
        this.audio.sfxJump();
        this._dust(this.cx, this.bottom, 6, 1.2);
      } else if (this.hasDoubleJump && !this.doubleJumped) {
        this.vy = P.JUMP_V * 0.9;
        this.jumping = true;
        this.doubleJumped = true;
        this.jumpBuf = 0;
        this.sx = 0.75; this.sy = 1.25;
        this.audio.sfxJump();
        this.particles.emit(this.cx, this.bottom, 1, { kind: 'ring', size: 16, life: 0.35,
          lifeMin: 0.35, lifeMax: 0.35, sizeMin: 16, sizeMax: 16, gravity: 0, vxMin: 0, vxMax: 0,
          vyMin: 0, vyMax: 0, color: C.COL.CLEAN });
        this.particles.emit(this.cx, this.bottom, 8, { kind: 'spark', speed: 3, angle: Math.PI / 2,
          spread: 2.2, color: ['#9ff3e4', '#ffffff'], gravity: 0.05, lifeMin: 0.2, lifeMax: 0.4, sizeMin: 2, sizeMax: 3 });
      }
    }
  }

  _swim(dir, jumpHeld, map) {
    const P = C.P;
    const max = this.hasFlippers ? P.SWIM_MAX_FLIP : P.SWIM_MAX;
    if (dir !== 0) {
      this.facing = dir;
      this.vx = M.approach(this.vx, dir * max, 0.22);
    } else {
      this.vx = M.approach(this.vx, 0, 0.07);
    }
    this.vy = Math.min(this.vy + P.SWIM_GRAV, P.SWIM_MAX_FALL);
    if (jumpHeld && this.vy > -1.4) this.vy -= 0.06; // gentle hold-to-rise

    if (this.jumpBuf > 0) {
      this.jumpBuf = 0;
      const headInAir = !Phys.touches(map, this.x + 4, this.y, this.w - 8, 6, C.T.WATER);
      if (headInAir) {
        // At the surface: leap out
        this.vy = P.JUMP_V * 0.92;
        this.jumping = true;
        this._splash();
      } else {
        this.vy = P.SWIM_STROKE * (this.hasFlippers ? 1.15 : 1);
        this.sx = 1.15; this.sy = 0.88;
        this.particles.emit(this.cx, this.y + 6, 4, { kind: 'bubble', vxMin: -0.6, vxMax: 0.6,
          vyMin: -1.6, vyMax: -0.6, gravity: -0.03, drag: 0.98, sizeMin: 3, sizeMax: 6,
          lifeMin: 0.6, lifeMax: 1.1, color: '#cfefff' });
      }
    }
    this.onGround = false;
    if (Math.random() < 0.03) {
      this.particles.emit(this.cx + this.facing * 6, this.y + 6, 1, { kind: 'bubble', vxMin: -0.2,
        vxMax: 0.2, vyMin: -1.2, vyMax: -0.5, gravity: -0.02, drag: 0.98, sizeMin: 2, sizeMax: 4,
        lifeMin: 0.8, lifeMax: 1.2, color: '#cfefff' });
    }
  }

  _standingOnOneWay(map) {
    const r = Math.floor((this.y + this.h + 1) / TS);
    const c1 = Math.floor(this.x / TS), c2 = Math.floor((this.x + this.w - 0.01) / TS);
    let oneWay = false;
    for (let c = c1; c <= c2; c++) {
      const t = map.get(c, r);
      if (Phys.solid(t)) return false;
      if (Phys.oneWay(t)) oneWay = true;
    }
    return oneWay;
  }

  _land() {
    const impact = M.clamp((this.peakVy - 2) / 10, 0, 1);
    this.peakVy = 0;
    this.sx = 1 + 0.35 * impact + 0.05;
    this.sy = 1 - 0.3 * impact - 0.04;
    if (impact > 0.15) {
      this._dust(this.cx, this.bottom, 3 + Math.round(impact * 7), 1 + impact * 1.5);
      this.audio.sfxLand && this.audio.sfxLand(impact);
    }
  }

  _dust(x, y, n, power) {
    this.particles.emit(x, y - 2, n, {
      kind: 'dust', vxMin: -1.4 * power, vxMax: 1.4 * power, vyMin: -1.1 * power, vyMax: -0.1,
      gravity: -0.01, drag: 0.9, sizeMin: 3, sizeMax: 7, lifeMin: 0.25, lifeMax: 0.5,
      color: ['rgba(222,232,240,0.55)', 'rgba(190,205,218,0.45)'],
    });
  }

  _splash() {
    this.audio.sfxSplash();
    this.particles.emit(this.cx, this.y + 8, 12, {
      kind: 'droplet', vxMin: -2.4, vxMax: 2.4, vyMin: -5, vyMax: -2, gravity: 0.25,
      sizeMin: 2, sizeMax: 4, lifeMin: 0.4, lifeMax: 0.7, color: ['#8fe3ff', '#d4f6ff', '#4fc3ea'],
    });
  }

  _hazards(map) {
    // Spikes: only the pointed lower part of the tile hurts
    const c1 = Math.floor(this.x / TS), c2 = Math.floor((this.x + this.w - 0.01) / TS);
    const r1 = Math.floor(this.y / TS), r2 = Math.floor((this.y + this.h - 0.01) / TS);
    for (let r = r1; r <= r2; r++) {
      for (let c = c1; c <= c2; c++) {
        if (map.get(c, r) === C.T.SPIKE &&
            M.overlap(this.x + 2, this.y, this.w - 4, this.h, c * TS + 3, r * TS + 14, TS - 6, TS - 14)) {
          this.takeDamage(1, c * TS + TS / 2);
          this.vy = -8.5;
          return;
        }
      }
    }
  }

  _trackSafeSpot(map, dt) {
    if (!this.onGround || this.inWater) return;
    this.safeTimer += dt;
    if (this.safeTimer < 0.25) return;
    this.safeTimer = 0;
    // Only remember spots with solid footing on both feet and no spikes adjacent
    const r = Math.floor((this.y + this.h + 1) / TS);
    const cl = Math.floor(this.x / TS), cr = Math.floor((this.x + this.w - 0.01) / TS);
    const okFoot = (c) => { const t = map.get(c, r); return Phys.solid(t) || Phys.oneWay(t); };
    const noSpike = (c) => map.get(c, r - 1) !== C.T.SPIKE;
    if (okFoot(cl) && okFoot(cr) && noSpike(cl - 1) && noSpike(cr + 1)) {
      this.lastSafe = { x: this.x, y: this.y };
    }
  }

  respawnAt(x, y) {
    this.x = this.px = x;
    this.y = this.py = y;
    this.vx = 0; this.vy = 0;
    this.ctrlLock = 10;
  }

  takeDamage(amt, fromX) {
    if (this.invTimer > 0 || this.dead) return false;
    const P = C.P;
    this.hp -= amt;
    this.invTimer = P.INVULN;
    this.flash = 0.18;
    this.audio.sfxHurt();
    if (fromX !== null && fromX !== undefined) {
      const away = this.cx < fromX ? -1 : 1;
      this.vx = away * P.KNOCK_X;
      this.vy = P.KNOCK_Y;
      this.ctrlLock = P.HURT_LOCK;
      this.jumping = false;
    }
    this.particles.emit(this.cx, this.cy, 10, {
      kind: 'square', speed: 4.5, color: ['#ff6b5a', '#ffd1c9', '#ffffff'], gravity: 0.2,
      sizeMin: 2, sizeMax: 4, lifeMin: 0.3, lifeMax: 0.6, spin: 0.3,
    });
    if (this.hp <= 0) {
      this.hp = 0;
      this.dead = true;
      this.deathTime = 0;
      this.vx = 0;
      this.vy = -9;
      this.audio.sfxDie();
    }
    return true;
  }

  _updateDead(dt) {
    this.deathTime += dt;
    if (this.deathTime < 0.35) return; // brief freeze before the fall
    this.vy = Math.min(this.vy + 0.45, 14);
    this.y += this.vy;
    this.anim.state = 'hurt';
  }

  collectCoin(val = 1) {
    this.coins += val;
    this.score += val * 100;
    this.audio.sfxCoin();
    this.particles.floatText(this.cx, this.y - 6, `+${val * 100}`, '#bff3ff', 12);
  }

  collectPowerup(type) {
    this.audio.sfxPowerup();
    this.score += 500;
    if (type === 'heart')      this.hp = Math.min(this.hp + 1, this.maxHp);
    if (type === 'doubleJump') this.hasDoubleJump = true;
    if (type === 'flippers')   this.hasFlippers = true;
    if (type === 'blaster')    this.blaster = BLASTER_TIME;
    const label = { heart: '+1 HEART', doubleJump: 'DOUBLE JUMP!', flippers: 'FLIPPERS!', blaster: 'WATER CANNON! (X)' }[type] || '+500';
    this.particles.floatText(this.cx, this.y - 10, label, '#9ff3e4', 13);
    this.particles.emit(this.cx, this.cy, 16, {
      kind: 'spark', speed: 5, color: ['#9ff3e4', '#ffffff', '#56cfe1'], gravity: 0.05,
      sizeMin: 2, sizeMax: 3, lifeMin: 0.3, lifeMax: 0.6, additive: true,
    });
  }

  _updateAnim(dt) {
    const a = this.anim;
    // Squash/stretch spring back toward 1
    this.sx += (1 - this.sx) * 0.22;
    this.sy += (1 - this.sy) * 0.22;
    if (this.flash > 0) this.flash -= dt;

    a.blinkIn -= dt;
    if (a.blinkIn <= 0) { a.blink = 0.13; a.blinkIn = M.rand(2, 4.5); }
    if (a.blink > 0) a.blink -= dt;

    if (this.ctrlLock > 0 && this.invTimer > C.P.INVULN - 0.4) a.state = 'hurt';
    else if (this.inWater) a.state = 'swim';
    else if (!this.onGround) a.state = this.vy < 0 ? 'jump' : 'fall';
    else if (Math.abs(this.vx) > 0.35) a.state = 'run';
    else a.state = 'idle';

    if (a.state === 'run') {
      const prev = a.run;
      a.run += Math.abs(this.vx) * 0.085;
      // Footfall dust twice per stride
      if (Math.floor(prev / Math.PI) !== Math.floor(a.run / Math.PI) && Math.abs(this.vx) > 2.5) {
        this._dust(this.cx - this.facing * 5, this.bottom, 1, 0.5);
      }
    } else if (a.state === 'idle') {
      a.run = 0;
    }
    this.t += dt;
  }

  // ── Rendering ───────────────────────────────────────────────────────────
  draw(ctx, camX, camY) {
    // Flicker while invulnerable
    if (!this.dead && this.invTimer > 0 && Math.floor(this.invTimer * 14) % 2 === 0) {
      ctx.globalAlpha = 0.35;
    }
    const fx = this.x + this.w / 2 - camX;
    const fy = this.y + this.h - camY;

    if (this.onGround) drawShadow(ctx, fx, fy, 11 * this.sx);

    ctx.save();
    ctx.translate(fx, fy);
    ctx.scale(this.facing * this.sx, this.sy);
    this._drawBody(ctx);
    ctx.restore();

    // White hit flash overlay
    if (this.flash > 0) {
      ctx.save();
      ctx.globalAlpha = 0.6;
      ctx.globalCompositeOperation = 'lighter';
      ctx.translate(fx, fy);
      ctx.scale(this.facing * this.sx, this.sy);
      this._drawBody(ctx, '#ffffff');
      ctx.restore();
    }
    ctx.globalAlpha = 1;
  }

  // Draws the worker with feet at (0,0) facing +x. `mono` = flat colour pass.
  _drawBody(ctx, mono) {
    const a = this.anim, t = this.t;
    const OL = C.COL.OUTLINE;
    let legF = 0, legB = 0, armF = 0, armB = 0, bob = 0, lean = 0;

    switch (a.state) {
      case 'idle':
        bob = Math.sin(t * 2.6) * 0.6;
        armF = 0.12 + Math.sin(t * 2.6) * 0.05;
        armB = -0.1 - Math.sin(t * 2.6) * 0.05;
        break;
      case 'run': {
        const s = Math.sin(a.run);
        legF = s * 0.85; legB = -s * 0.85;
        armF = -s * 0.9; armB = s * 0.9;
        bob = -Math.abs(Math.cos(a.run)) * 2.2 + 1;
        lean = 0.1;
        break;
      }
      case 'jump':
        legF = 0.75; legB = -0.45; armF = 2.5; armB = 1.2; lean = 0.05;
        break;
      case 'fall': {
        const w = Math.sin(t * 22) * 0.12;
        legF = 0.25; legB = -0.3; armF = 1.9 + w; armB = 1.4 - w;
        break;
      }
      case 'swim': {
        const s = Math.sin(t * 7);
        legF = Math.sin(t * 13) * 0.5; legB = -legF;
        armF = 1.6 + s * 1.1; armB = 1.6 - s * 1.1;
        lean = 0.35; bob = s;
        break;
      }
      case 'hurt':
        legF = 0.5; legB = -0.5; armF = 2.8; armB = 2.4; lean = -0.15;
        break;
    }

    const armed = this.blaster > 0 && a.state !== 'swim' && a.state !== 'hurt';
    if (armed) armF = 1.45 + (a.state === 'run' ? Math.sin(a.run) * 0.06 : 0) - this.fireAnim * 0.25;
    ctx.rotate(lean);
    const hipY = -12 + bob;
    const shY = -24 + bob;

    const col = (c) => mono || c;
    const part = (x, y, w, h, r, fill) => {
      ctx.beginPath();
      ctx.roundRect(x, y, w, h, r);
      ctx.fillStyle = col(fill);
      ctx.fill();
      if (!mono) { ctx.lineWidth = 1; ctx.strokeStyle = OL; ctx.stroke(); }
    };

    const drawLeg = (ang, back) => {
      ctx.save();
      ctx.translate(back ? -2.5 : 2.5, hipY);
      ctx.rotate(-ang);
      part(-3, -1, 6, 10.5, 2, back ? '#22385f' : '#2f4f86');     // jeans
      if (!mono) { ctx.fillStyle = back ? '#1b2d4d' : '#284577'; ctx.fillRect(-3, 6, 6, 1.2); }
      part(-3.5, 8.8, 8.5, 4, 1.6, back ? '#3d2614' : '#5a3a1e'); // boot
      if (!mono) { ctx.fillStyle = '#2a1a0d'; ctx.fillRect(-3.5, 11.6, 8.5, 1.2); }
      ctx.restore();
    };

    const drawArm = (ang, back, wrench) => {
      ctx.save();
      ctx.translate(back ? -3.5 : 2.5, shY + 1);
      ctx.rotate(-ang);
      part(-2.3, -1.5, 4.6, 7.5, 2, back ? '#24548f' : '#2f6db5');  // sleeve
      part(-2, 5, 4, 3.5, 1.2, back ? '#c79a7a' : '#efc19c');       // forearm
      ctx.beginPath();
      ctx.arc(0, 9.6, 2.7, 0, Math.PI * 2);                          // work glove
      ctx.fillStyle = col(back ? '#b88e1e' : '#e3b52b');
      ctx.fill();
      if (!mono) { ctx.strokeStyle = OL; ctx.stroke(); }
      if (wrench === 'cannon') {
        // Clean-water spray cannon: tank, SJWD stripe, nozzle
        ctx.translate(0, 9.6);
        ctx.rotate(-0.08);
        part(-3.4, -3, 6.8, 12, 2.2, '#2f86c9');
        if (!mono) {
          ctx.fillStyle = '#ffffff'; ctx.fillRect(-3.4, 2, 6.8, 1.6);
          ctx.fillStyle = '#8fd0ff'; ctx.fillRect(-2.4, -2, 1.2, 9);
        }
        part(-2, 8.5, 4, 5.5, 1, '#c9d3dd');
        part(-2.8, 13, 5.6, 2, 0.8, '#7f8c99');
        if (!mono && this.fireAnim > 0) {
          ctx.fillStyle = `rgba(190,240,255,${this.fireAnim})`;
          ctx.beginPath(); ctx.arc(0, 17, 3 + this.fireAnim * 2, 0, Math.PI * 2); ctx.fill();
        }
      } else if (wrench) {
        ctx.translate(0, 9.6);
        ctx.rotate(ang * 0.6 - 0.2);
        part(0.5, -1.3, 10, 2.6, 1, '#9aa6b2');                     // handle
        if (!mono) { ctx.fillStyle = '#d5dde5'; ctx.fillRect(1.5, -1.1, 8, 0.8); }
        ctx.beginPath();                                             // open-end jaw
        ctx.arc(12, 0, 3.6, 0.7, Math.PI * 2 - 0.7);
        ctx.lineTo(12, 0);
        ctx.closePath();
        ctx.fillStyle = col('#aab5c0');
        ctx.fill();
        if (!mono) { ctx.strokeStyle = OL; ctx.stroke(); }
      }
      ctx.restore();
    };

    // Back limbs
    drawArm(armB, true, false);
    drawLeg(legB, true);

    // Torso: shirt, hi-vis vest, reflective stripes, belt
    part(-7, shY - 2, 14, 15, 3, '#2f6db5');
    part(-7, shY - 1, 14, 13.5, 2.5, '#ff7b1c');
    if (!mono) {
      ctx.fillStyle = '#d95f0a';
      ctx.fillRect(-6.5, shY - 0.5, 3.5, 12.5);           // back-side shading
      ctx.fillStyle = '#2f6db5';
      ctx.beginPath();                                     // collar V
      ctx.moveTo(-1, shY - 1); ctx.lineTo(3, shY - 1); ctx.lineTo(1, shY + 3);
      ctx.fill();
      ctx.fillStyle = '#e6eef6';
      ctx.fillRect(-6.5, shY + 4, 13, 1.8);                // reflective tape
      ctx.fillRect(-6.5, shY + 8, 13, 1.8);
      ctx.fillStyle = '#ffffff';
      ctx.fillRect(-6.5, shY + 4, 13, 0.6);
      ctx.fillRect(-6.5, shY + 8, 13, 0.6);
      ctx.fillStyle = '#1a73b8';                           // SJWD badge
      ctx.fillRect(2.2, shY + 0.4, 3.4, 2.6);
      ctx.fillStyle = '#5a3a1e';                           // belt
      ctx.fillRect(-7, shY + 11.5, 14, 2.2);
      ctx.fillStyle = '#d4b04a';
      ctx.fillRect(1.5, shY + 11.6, 2.6, 2);
    }

    drawLeg(legF, false);

    // Head
    const hx = 0.5, hy = shY - 12;
    const fem = this.gender === 'f';
    if (fem) {
      // Ponytail out the back of the hard hat; swings with movement
      const swing = Math.sin(this.t * 9) * (Math.abs(this.vx) > 0.5 ? 0.28 : 0.08)
        + (this.vy < -1 ? -0.35 : this.vy > 2 ? 0.45 : 0);
      ctx.save();
      ctx.translate(hx - 5, hy + 3.5);
      ctx.rotate(0.55 + swing);
      ctx.beginPath();
      ctx.moveTo(-1.5, -1.5);
      ctx.quadraticCurveTo(-5.5, 3, -2.5, 10);
      ctx.quadraticCurveTo(0, 6, 2, -0.5);
      ctx.closePath();
      ctx.fillStyle = col('#7a4228');
      ctx.fill();
      if (!mono) {
        ctx.strokeStyle = OL; ctx.lineWidth = 1; ctx.stroke();
        ctx.fillStyle = '#9a5a36'; ctx.fillRect(-2.6, 1.5, 1, 5);
        ctx.fillStyle = '#e74c3c';
        ctx.beginPath(); ctx.arc(0, 0, 1.6, 0, Math.PI * 2); ctx.fill();
      }
      ctx.restore();
    }
    part(hx - 5.5, hy, 11.5, 10.5, 3.2, '#efc19c');
    if (!mono) {
      ctx.fillStyle = fem ? '#7a4228' : '#5b3a24';          // hair at back
      ctx.fillRect(hx - 5.5, hy + 1.5, fem ? 4 : 3, fem ? 7 : 4.5);
      if (fem) { ctx.fillRect(hx - 0.5, hy + 0.8, 6, 1.6); } // bangs under the brim
      ctx.fillStyle = '#d9a37f';                            // ear
      ctx.beginPath(); ctx.ellipse(hx - 1.5, hy + 5.4, 1.4, 1.9, 0, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#e2ad88';                            // nose
      ctx.fillRect(hx + 5.6, hy + 4.6, 1.6, 2.2);
      if (a.blink > 0 || a.state === 'hurt') {
        ctx.fillStyle = '#1b1b1b';
        ctx.fillRect(hx + 2.4, hy + 4.4, 2.6, 0.9);
      } else {
        ctx.fillStyle = '#1b1b1b';
        ctx.fillRect(hx + 2.6, hy + 3.2, 2, 2.6);
        ctx.fillStyle = '#ffffff';
        ctx.fillRect(hx + 3.6, hy + 3.3, 0.8, 0.8);
        if (fem) { ctx.fillStyle = '#1b1b1b'; ctx.fillRect(hx + 4.5, hy + 2.6, 1.3, 0.8); } // lashes
      }
      ctx.fillStyle = '#6b4630';                            // brow
      ctx.fillRect(hx + 2.2, hy + 1.9, 3, 0.9);
      ctx.fillStyle = fem ? '#c0525a' : '#9c5b45';          // mouth
      ctx.fillRect(hx + 3, hy + 7.6, a.state === 'hurt' ? 2.2 : 2.6, a.state === 'hurt' ? 1.6 : 0.8);
    }

    // White hard hat with SJWD stripe
    ctx.beginPath();
    ctx.ellipse(hx + 0.3, hy + 1.6, 7.2, 6.2, 0, Math.PI, 0);
    ctx.closePath();
    ctx.fillStyle = col('#f5f7fa');
    ctx.fill();
    if (!mono) { ctx.strokeStyle = OL; ctx.lineWidth = 1; ctx.stroke(); }
    part(hx - 7.4, hy + 0.6, 18, 2.6, 1.2, '#e9eef3');      // brim, extends forward
    if (!mono) {
      ctx.fillStyle = '#c9d3dd';
      ctx.beginPath();
      ctx.ellipse(hx - 2.2, hy + 0.4, 3.6, 3.4, 0, Math.PI, Math.PI * 1.5);
      ctx.lineTo(hx - 2.2, hy + 0.4);
      ctx.fill();
      ctx.fillStyle = '#1a73b8';
      ctx.fillRect(hx - 6.4, hy - 1.4, 13.4, 1.4);          // blue band
      ctx.fillStyle = '#ffffff';
      ctx.fillRect(hx + 1.5, hy - 4.2, 2.8, 1.6);           // specular
    }

    // Front arm (holds the pipe wrench)
    drawArm(armF, false, armed ? 'cannon' : a.state !== 'swim');
  }
}

// ─────────────────────────────────────────────────────────────────────────────
// ENEMIES
// ─────────────────────────────────────────────────────────────────────────────
class Enemy extends Entity {
  constructor(x, y, w, h) {
    super(x, y, w, h);
    this.dir = Math.random() < 0.5 ? -1 : 1;
    this.onGround = false;
    this.stun = 0;
    this.score = 200;
  }

  // Patrol: walk, turn at walls and ledges
  patrol(map, speed) {
    if (this.onGround && (Phys.wallAhead(this, map, this.dir) || !Phys.groundAhead(this, map, this.dir))) {
      this.dir = -this.dir;
    }
    this.vx = this.stun > 0 ? 0 : this.dir * speed;
  }

  integrate(map) {
    this.vy = Math.min(this.vy + C.GRAVITY, C.MAX_FALL);
    if (Phys.moveX(this, map, this.vx)) this.dir = -this.dir;
    const hit = Phys.moveY(this, map, this.vy);
    const was = this.onGround;
    this.onGround = hit === 1;
    if (hit !== 0) this.vy = 0;
    if (this.y > map.rows * TS + 64) this.dead = true; // fell into a pit
    return !was && this.onGround;
  }

  // Returns true when the stomp killed the enemy
  stomp(particles, audio) {
    this.hp--;
    this.flash = 0.15;
    if (this.hp <= 0) {
      this.dead = true;
      audio.sfxEnemyHit();
      this.burst(particles);
      return true;
    }
    this.stun = 0.5;
    audio.sfxEnemyHit();
    return false;
  }

  burst(particles) {}

  get harmful() { return this.stun <= 0; }

  tickTimers(dt) {
    this.t += dt;
    if (this.flash > 0) this.flash -= dt;
    if (this.stun > 0) this.stun -= dt;
  }
}

// Lead contamination blob — slow, wobbly patroller
class LeadDrop extends Enemy {
  constructor(x, y) {
    super(x, y, 24, 20);
    this.hp = 1;
    this.speed = 0.9 + Math.random() * 0.35;
  }

  update(dt, map) {
    this.tickTimers(dt);
    this.patrol(map, this.speed * (0.75 + 0.25 * Math.sin(this.t * 6))); // inch-worm pace
    this.integrate(map);
  }

  burst(p) {
    p.emit(this.cx, this.cy, 14, { kind: 'droplet', speed: 4.5, color: ['#8d98a4', '#c3cbd3', '#5a646f'],
      gravity: 0.25, sizeMin: 2, sizeMax: 4, lifeMin: 0.4, lifeMax: 0.8 });
    p.emit(this.cx, this.cy, 1, { kind: 'ring', sizeMin: 22, sizeMax: 22, lifeMin: 0.3, lifeMax: 0.3,
      vxMin: 0, vxMax: 0, vyMin: 0, vyMax: 0, gravity: 0, color: '#c3cbd3' });
  }

  draw(ctx, camX, camY) {
    const x = this.x - camX, y = this.y - camY;
    if (x < -40 || x > C.W + 40) return;
    const wob = Math.sin(this.t * 6);
    const sq = this.stun > 0 ? 0.55 : 1 + wob * 0.07;   // vertical scale
    const sw = this.stun > 0 ? 1.3 : 1 - wob * 0.05;
    const cx = x + this.w / 2, by = y + this.h;
    drawShadow(ctx, cx, by, 12 * sw);

    ctx.save();
    ctx.translate(cx, by);
    ctx.scale(sw, sq);
    // Body: dome with drippy bottom edge
    ctx.beginPath();
    ctx.moveTo(-12, 0);
    ctx.bezierCurveTo(-13, -14, -7, -21, 0, -21);
    ctx.bezierCurveTo(7, -21, 13, -14, 12, 0);
    for (let i = 3; i >= -3; i--) {
      const dx = i * 4;
      ctx.quadraticCurveTo(dx + 2, 1.6 + (i % 2 ? 1.4 : 0), dx - 2, 0);
    }
    ctx.closePath();
    const g = ctx.createRadialGradient(-4, -14, 2, 0, -8, 16);
    g.addColorStop(0, '#dfe5ea');
    g.addColorStop(0.35, '#9aa5b1');
    g.addColorStop(1, '#4b5561');
    ctx.fillStyle = this.flash > 0 ? '#ffffff' : g;
    ctx.fill();
    ctx.lineWidth = 1.2;
    ctx.strokeStyle = '#1d232b';
    ctx.stroke();

    // Specular highlight
    ctx.fillStyle = 'rgba(255,255,255,0.75)';
    ctx.beginPath();
    ctx.ellipse(-5, -15, 3, 1.8, -0.5, 0, Math.PI * 2);
    ctx.fill();

    // "Pb" stamp
    ctx.fillStyle = 'rgba(40,46,54,0.55)';
    ctx.font = "bold 7px 'Courier New', monospace";
    ctx.textAlign = 'center';
    ctx.fillText('Pb', 0, -2.5);

    // Angry eyes that look where it's going
    const look = this.dir * 1.2;
    for (const ex of [-4.5, 4.5]) {
      ctx.fillStyle = '#fff';
      ctx.beginPath(); ctx.ellipse(ex, -10, 3, 3.3, 0, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#b3241b';
      ctx.beginPath(); ctx.arc(ex + look, -9.6, 1.6, 0, Math.PI * 2); ctx.fill();
    }
    ctx.strokeStyle = '#1d232b';
    ctx.lineWidth = 1.6;
    ctx.beginPath();
    ctx.moveTo(-8, -15.5); ctx.lineTo(-2, -12.8);
    ctx.moveTo(8, -15.5);  ctx.lineTo(2, -12.8);
    ctx.stroke();
    ctx.restore();
  }
}

// Rust blob — crusty hopper, takes two stomps
class RustBlob extends Enemy {
  constructor(x, y) {
    super(x, y, 28, 22);
    this.hp = 2;
    this.score = 300;
    this.hopIn = M.rand(1.2, 2.6);
    this.squash = 1;
  }

  update(dt, map) {
    this.tickTimers(dt);
    this.patrol(map, 1.1);
    this.hopIn -= dt;
    if (this.hopIn <= 0 && this.onGround && this.stun <= 0) {
      this.vy = -7.5;
      this.hopIn = M.rand(1.6, 3.2);
      this.squash = 1.3;
    }
    const landed = this.integrate(map);
    if (landed) this.squash = 0.7;
    this.squash += (1 - this.squash) * 0.18;
  }

  burst(p) {
    p.emit(this.cx, this.cy, 16, { kind: 'square', speed: 5, color: ['#b4521f', '#7a3315', '#e08a3c'],
      gravity: 0.3, sizeMin: 2, sizeMax: 5, lifeMin: 0.4, lifeMax: 0.8, spin: 0.25 });
  }

  draw(ctx, camX, camY) {
    const x = this.x - camX, y = this.y - camY;
    if (x < -50 || x > C.W + 50) return;
    const hurt = this.hp < 2;
    const sy = (this.stun > 0 ? 0.6 : this.squash) * (hurt ? 0.9 : 1);
    const sx = 2 - sy;
    const cx = x + this.w / 2, by = y + this.h;
    if (this.onGround) drawShadow(ctx, cx, by, 14 * sx);

    ctx.save();
    ctx.translate(cx, by);
    ctx.scale(sx, sy);
    // Lumpy crust silhouette
    ctx.beginPath();
    const N = 14;
    for (let i = 0; i <= N; i++) {
      const a = Math.PI + (i / N) * Math.PI;
      const r = 14 + (M.hash(i, 7) - 0.5) * 3.2;
      const px = Math.cos(a) * r, py = Math.sin(a) * r * 1.4;
      i === 0 ? ctx.moveTo(px, py) : ctx.lineTo(px, py);
    }
    ctx.closePath();
    const g = ctx.createLinearGradient(0, -20, 0, 0);
    g.addColorStop(0, '#d8783a');
    g.addColorStop(0.55, '#a5481b');
    g.addColorStop(1, '#6c2b10');
    ctx.fillStyle = this.flash > 0 ? '#ffffff' : g;
    ctx.fill();
    ctx.lineWidth = 1.2;
    ctx.strokeStyle = '#2a1208';
    ctx.stroke();

    // Rust flakes
    const flakes = [[-8, -8, 3], [6, -13, 2.4], [-2, -16, 2], [9, -5, 2.2], [-11, -3, 1.8]];
    for (const [fx, fy, fr] of flakes) {
      ctx.fillStyle = '#5c240c';
      ctx.beginPath(); ctx.arc(fx, fy, fr, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#f0a05a';
      ctx.fillRect(fx - fr * 0.6, fy - fr * 0.7, fr * 0.7, 0.9);
    }
    if (hurt) { // crack after the first stomp
      ctx.strokeStyle = '#2a1208';
      ctx.lineWidth = 1;
      ctx.beginPath(); ctx.moveTo(-3, -19); ctx.lineTo(0, -13); ctx.lineTo(-2, -9); ctx.lineTo(2, -5); ctx.stroke();
    }

    // Glowing slit eyes
    const look = this.dir * 1.4;
    for (const ex of [-5.5, 5.5]) {
      ctx.fillStyle = '#ffd34d';
      ctx.beginPath(); ctx.ellipse(ex, -11, 3.6, 2.8, 0, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#1a0a04';
      ctx.fillRect(ex + look - 0.7, -13.4, 1.4, 4.8);
    }
    // Jagged mouth
    ctx.fillStyle = '#2a1208';
    ctx.beginPath();
    ctx.moveTo(-6, -5);
    for (let i = 0; i <= 6; i++) ctx.lineTo(-6 + i * 2, i % 2 ? -3 : -5);
    ctx.lineTo(6, -2); ctx.lineTo(-6, -2);
    ctx.fill();
    ctx.restore();
  }
}

// ─────────────────────────────────────────────────────────────────────────────
// COLLECTIBLES
// ─────────────────────────────────────────────────────────────────────────────
class Coin extends Entity {
  constructor(x, y, value = 1) {
    super(x, y, 16, 18);
    this.value = value;
    this.animTimer = Math.random() * 6;
  }

  update(dt) { this.animTimer += dt; }

  draw(ctx, camX, camY) {
    if (this.dead) return;
    const x = this.x - camX + 8, y = this.y - camY + 10;
    if (x < -20 || x > C.W + 20) return;
    const t = this.animTimer;
    const bob = Math.sin(t * 3.2) * 2.5;
    const sx = 0.55 + 0.45 * Math.abs(Math.cos(t * 1.8)); // slow spin

    // Soft glow
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    const gl = ctx.createRadialGradient(x, y + bob, 1, x, y + bob, 14);
    gl.addColorStop(0, 'rgba(120,220,255,0.35)');
    gl.addColorStop(1, 'rgba(120,220,255,0)');
    ctx.fillStyle = gl;
    ctx.fillRect(x - 14, y + bob - 14, 28, 28);
    ctx.restore();

    ctx.save();
    ctx.translate(x, y + bob);
    ctx.scale(sx, 1);
    ctx.beginPath();
    ctx.moveTo(0, -9);
    ctx.bezierCurveTo(2, -5, 7, -1, 7, 3);
    ctx.bezierCurveTo(7, 7.5, 3.5, 9.5, 0, 9.5);
    ctx.bezierCurveTo(-3.5, 9.5, -7, 7.5, -7, 3);
    ctx.bezierCurveTo(-7, -1, -2, -5, 0, -9);
    const g = ctx.createLinearGradient(-6, -8, 6, 9);
    g.addColorStop(0, '#e6fbff');
    g.addColorStop(0.45, '#56cfe1');
    g.addColorStop(1, '#1576b5');
    ctx.fillStyle = g;
    ctx.fill();
    ctx.lineWidth = 1.2;
    ctx.strokeStyle = '#0b4f7a';
    ctx.stroke();
    ctx.fillStyle = 'rgba(255,255,255,0.9)';
    ctx.beginPath();
    ctx.ellipse(-2.6, 2, 1.4, 2.8, 0.3, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();

    // Occasional twinkle
    const tw = (t * 0.7) % 2.2;
    if (tw < 0.25) {
      const s = Math.sin((tw / 0.25) * Math.PI) * 4;
      ctx.strokeStyle = 'rgba(255,255,255,0.9)';
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.moveTo(x + 5 - s, y + bob - 6); ctx.lineTo(x + 5 + s, y + bob - 6);
      ctx.moveTo(x + 5, y + bob - 6 - s); ctx.lineTo(x + 5, y + bob - 6 + s);
      ctx.stroke();
    }
  }
}

class Powerup extends Entity {
  constructor(x, y, type) {
    super(x, y, 24, 24);
    this.type = type; // 'heart' | 'doubleJump' | 'flippers'
    this.animTimer = Math.random() * 6;
  }

  update(dt) { this.animTimer += dt; }

  draw(ctx, camX, camY) {
    if (this.dead) return;
    const t = this.animTimer;
    const x = this.x - camX + 12, y = this.y - camY + 12 + Math.sin(t * 2.4) * 3;
    if (x < -30 || x > C.W + 30) return;
    const glowCol = this.type === 'heart' ? '255,110,110' : this.type === 'flippers' ? '90,180,255'
      : this.type === 'blaster' ? '80,220,255' : '120,255,220';

    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    const pulse = 0.6 + 0.4 * Math.sin(t * 5);
    const gl = ctx.createRadialGradient(x, y, 2, x, y, 22);
    gl.addColorStop(0, `rgba(${glowCol},${0.45 * pulse})`);
    gl.addColorStop(1, `rgba(${glowCol},0)`);
    ctx.fillStyle = gl;
    ctx.fillRect(x - 22, y - 22, 44, 44);
    ctx.restore();

    // Bubble shell
    const bg = ctx.createRadialGradient(x - 4, y - 5, 1, x, y, 13);
    bg.addColorStop(0, 'rgba(255,255,255,0.55)');
    bg.addColorStop(0.6, 'rgba(160,220,255,0.18)');
    bg.addColorStop(1, 'rgba(120,200,255,0.4)');
    ctx.fillStyle = bg;
    ctx.beginPath(); ctx.arc(x, y, 12.5, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = 'rgba(220,245,255,0.85)';
    ctx.lineWidth = 1.2;
    ctx.stroke();

    ctx.save();
    ctx.translate(x, y + 1);
    drawPowerupIcon(ctx, this.type, 1);
    ctx.restore();

    ctx.fillStyle = 'rgba(255,255,255,0.9)';
    ctx.beginPath(); ctx.ellipse(x - 5, y - 6, 3, 1.6, -0.6, 0, Math.PI * 2); ctx.fill();
  }
}

const BLASTER_TIME = 8; // seconds of water cannon per pickup

// Shared icon renderer (also used by the HUD). Centered at (0,0), ~16px.
function drawPowerupIcon(ctx, type, s = 1) {
  ctx.save();
  ctx.scale(s, s);
  ctx.lineWidth = 1.1;
  ctx.strokeStyle = C.COL.OUTLINE;
  if (type === 'heart') {
    ctx.beginPath();
    ctx.moveTo(0, 6);
    ctx.bezierCurveTo(-9, 0, -7, -8, -3.5, -7);
    ctx.bezierCurveTo(-1.5, -6.5, 0, -5, 0, -3.5);
    ctx.bezierCurveTo(0, -5, 1.5, -6.5, 3.5, -7);
    ctx.bezierCurveTo(7, -8, 9, 0, 0, 6);
    ctx.fillStyle = '#ff4d5e'; ctx.fill(); ctx.stroke();
    ctx.fillStyle = '#ffd0d5';
    ctx.beginPath(); ctx.ellipse(-3.5, -3.5, 1.6, 1.1, -0.6, 0, Math.PI * 2); ctx.fill();
  } else if (type === 'doubleJump') {
    // Winged boot
    ctx.beginPath();
    ctx.moveTo(-5, -6); ctx.lineTo(1, -6); ctx.lineTo(1, 1); ctx.lineTo(6, 2.5);
    ctx.lineTo(6, 6); ctx.lineTo(-5, 6); ctx.closePath();
    ctx.fillStyle = '#8a5a2b'; ctx.fill(); ctx.stroke();
    ctx.fillStyle = '#5a3a1e'; ctx.fillRect(-5, 4.5, 11, 1.5);
    ctx.beginPath();
    ctx.moveTo(-4, -3); ctx.quadraticCurveTo(-11, -9, -9, -1);
    ctx.quadraticCurveTo(-12, -3, -9, 2); ctx.quadraticCurveTo(-7, 0, -4, 1);
    ctx.closePath();
    ctx.fillStyle = '#ffffff'; ctx.fill(); ctx.stroke();
  } else if (type === 'blaster') {
    // Water cannon
    ctx.beginPath(); ctx.roundRect(-7, -4, 11, 8, 2);
    ctx.fillStyle = '#2f86c9'; ctx.fill(); ctx.stroke();
    ctx.fillStyle = '#ffffff'; ctx.fillRect(-4, -4, 1.6, 8);
    ctx.beginPath(); ctx.roundRect(4, -2, 4, 4, 1);
    ctx.fillStyle = '#c9d3dd'; ctx.fill(); ctx.stroke();
    ctx.beginPath(); ctx.roundRect(-5, 3, 3, 4, 1);
    ctx.fillStyle = '#1b5c92'; ctx.fill(); ctx.stroke();
    ctx.fillStyle = '#8fe3ff';
    for (const [x, y, r] of [[10, -1, 1.6], [12.5, -3, 1.1], [12.5, 1.5, 1.1]]) {
      ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill();
    }
  } else {
    // Swim flipper
    ctx.beginPath();
    ctx.moveTo(-2.5, -7); ctx.lineTo(2.5, -7); ctx.lineTo(3, -1);
    ctx.lineTo(7, 7); ctx.quadraticCurveTo(0, 4, -7, 7);
    ctx.lineTo(-3, -1); ctx.closePath();
    ctx.fillStyle = '#2b8ee0'; ctx.fill(); ctx.stroke();
    ctx.strokeStyle = '#a9dcff';
    ctx.beginPath(); ctx.moveTo(0, -1); ctx.lineTo(0, 5); ctx.moveTo(-3, 1); ctx.lineTo(-4.5, 5.5);
    ctx.moveTo(3, 1); ctx.lineTo(4.5, 5.5); ctx.stroke();
  }
  ctx.restore();
}

// ─────────────────────────────────────────────────────────────────────────────
// HAZARDS
// ─────────────────────────────────────────────────────────────────────────────
// Contaminated sludge pool. Touching it hurts and launches the player upward.
class ContamWater extends Entity {
  constructor(x, y, w, h) {
    super(x, y, w, h);
    this.animTimer = Math.random() * 10;
    this.type = 'contam';
  }

  update(dt) { this.animTimer += dt; }

  // Hurt box sits slightly below the visual surface so grazing the lip is fair
  hurtBox() { return { x: this.x + 3, y: this.y + 8, w: this.w - 6, h: this.h - 8 }; }

  draw(ctx, camX, camY) {
    const x = this.x - camX, y = this.y - camY;
    if (x > C.W + 10 || x + this.w < -10) return;
    const t = this.animTimer;
    const surf = (px) => y + 5 + Math.sin(t * 2.2 + px * 0.09) * 1.8 + Math.sin(t * 3.7 + px * 0.21) * 0.9;

    ctx.save();
    ctx.beginPath();
    ctx.moveTo(x, y + this.h);
    for (let px = 0; px <= this.w; px += 4) ctx.lineTo(x + px, surf(px));
    ctx.lineTo(x + this.w, y + this.h);
    ctx.closePath();
    const g = ctx.createLinearGradient(0, y, 0, y + this.h);
    g.addColorStop(0, 'rgba(150,215,60,0.92)');
    g.addColorStop(0.25, 'rgba(110,60,150,0.92)');
    g.addColorStop(1, 'rgba(48,18,72,0.97)');
    ctx.fillStyle = g;
    ctx.fill();

    // Glossy surface line
    ctx.strokeStyle = 'rgba(210,255,140,0.85)';
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    for (let px = 0; px <= this.w; px += 4) {
      px === 0 ? ctx.moveTo(x + px, surf(px)) : ctx.lineTo(x + px, surf(px));
    }
    ctx.stroke();

    // Rising, popping bubbles (deterministic per pool)
    ctx.beginPath();
    ctx.rect(x, y, this.w, this.h);
    ctx.clip();
    const n = Math.max(3, Math.floor(this.w / 18));
    for (let i = 0; i < n; i++) {
      const speed = 0.35 + M.hash(i, 3) * 0.4;
      const ph = (t * speed + M.hash(i, 9)) % 1;
      const bx = x + 6 + M.hash(i, 1) * (this.w - 12) + Math.sin(t * 2 + i) * 2;
      const by = y + this.h - ph * (this.h - 6);
      const r = 1.5 + M.hash(i, 5) * 2.5;
      ctx.strokeStyle = 'rgba(200,255,150,0.7)';
      ctx.lineWidth = 1;
