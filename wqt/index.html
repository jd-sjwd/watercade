      ctx.beginPath(); ctx.arc(bx, by, r * (ph > 0.92 ? 1.6 : 1), 0, Math.PI * 2); ctx.stroke();
    }
    ctx.restore();

    // Toxic vapour
    ctx.save();
    ctx.globalAlpha = 0.18 + 0.08 * Math.sin(t * 1.3);
    ctx.fillStyle = '#9fe05a';
    for (let i = 0; i < Math.ceil(this.w / 40); i++) {
      const vx = x + 14 + i * 40 + Math.sin(t * 0.8 + i) * 6;
      const vy = y - 6 - ((t * 10 + i * 17) % 18);
      ctx.beginPath(); ctx.ellipse(vx, vy, 9, 4, 0, 0, Math.PI * 2); ctx.fill();
    }
    ctx.restore();
  }
}

// ─────────────────────────────────────────────────────────────────────────────
// TILEMAP
// Static tiles are pre-rendered once per level into an offscreen canvas at
// device resolution; only animated parts (water, exit) are drawn per frame.
// ─────────────────────────────────────────────────────────────────────────────
let RENDER_SCALE = 1; // set by Game._resize (device pixels per logical pixel)

const THEMES = [
  { // 0 — Surface Mains: sunny street-level cross-section
    key: 'surface', ground: 'soil', ceiling: false, dark: 0,
    fill: ['#9a6a45', '#7a5034', '#5a3824'], line: '#3b2416',
    capA: '#62c24c', capB: '#3c9433', capHi: '#a6e57e', capEdge: '#2a6b25',
    pipe: ['#2f86c9', '#1b5c92', '#9ad6ff'],
    plat: ['#9aa8b5', '#5e6b78', '#dfe7ee'],
    water: ['rgba(80,180,240,0.38)', 'rgba(30,110,190,0.55)'], waterBack: '#1d5f8f', waterSurf: '#e3f6ff',
  },
  { // 1 — Underground Pipes: brick sewer tunnels
    key: 'sewer', ground: 'brick', ceiling: true, dark: 0.42,
    fill: ['#5a6a7a', '#465463', '#343f4b'], line: '#1d242c',
    capA: '#6d8a63', capB: '#4a6644', capHi: '#9fc28d', capEdge: '#2c3d29',
    pipe: ['#1f9e86', '#136f5e', '#86ead6'],
    plat: ['#76818b', '#454e57', '#b8c2cb'],
    water: ['rgba(60,170,170,0.36)', 'rgba(15,80,90,0.6)'], waterBack: '#0f3b44', waterSurf: '#c9fbff',
  },
  { // 2 — Treatment Plant: clean industrial tile and steel
    key: 'plant', ground: 'tile', ceiling: true, dark: 0.12,
    fill: ['#c3d0d7', '#9fb0ba', '#7a8b96'], line: '#55646d',
    capA: '#f0c22b', capB: '#2b2b2b', capHi: '#fff1b0', capEdge: '#3a3a3a',
    pipe: ['#8463d0', '#5a3d9e', '#d0bfff'],
    plat: ['#5f8191', '#3a5664', '#bad6e2'],
    water: ['rgba(100,215,230,0.36)', 'rgba(30,120,150,0.55)'], waterBack: '#1b5e70', waterSurf: '#f0feff',
  },
  { // 3 — Distribution Net: rusty ironworks at dusk
    key: 'iron', ground: 'iron', ceiling: false, dark: 0.18,
    fill: ['#6a5a52', '#4f413a', '#352a25'], line: '#1d1512',
    capA: '#a8b1b6', capB: '#646d72', capHi: '#eef3f5', capEdge: '#2f3538',
    pipe: ['#e5822c', '#a9561a', '#ffcf99'],
    plat: ['#857468', '#544740', '#d6c4b8'],
    water: ['rgba(90,170,220,0.36)', 'rgba(30,80,130,0.58)'], waterBack: '#1a3a5c', waterSurf: '#dff2ff',
  },
];

class Tilemap {
  constructor(cols, rows) {
    this.cols = cols;
    this.rows = rows;
    this.data = new Uint8Array(cols * rows);
    this.spawnX = TS * 2;
    this.spawnY = TS * 4;
    this.exitX  = TS * (cols - 3);
    this.exitY  = TS * 4;
    this.entities = [];
    this.coins    = [];
    this.powerups = [];
    this.hazards  = [];
    this.theme = THEMES[0];
    this.worldIdx = 0;
    this.cache = null;
    this.cacheScale = 0;
  }

  idx(c, r) { return r * this.cols + c; }

  get(c, r) {
    if (c < 0 || c >= this.cols || r < 0 || r >= this.rows) return C.T.SOLID;
    return this.data[this.idx(c, r)];
  }

  set(c, r, v) {
    if (c < 0 || c >= this.cols || r < 0 || r >= this.rows) return;
    this.data[this.idx(c, r)] = v;
    this.cache = null;
  }

  isSolid(c, r) {
    const t = this.get(c, r);
    return Phys.solid(t) || Phys.oneWay(t);
  }

  setTheme(worldIdx) {
    this.worldIdx = worldIdx;
    this.theme = THEMES[worldIdx] || THEMES[0];
    this.cache = null;
    this._scanWater();
  }

  invalidate() { this.cache = null; }

  _scanWater() {
    this.waterTiles = [];
    for (let r = 0; r < this.rows; r++) {
      for (let c = 0; c < this.cols; c++) {
        if (this.get(c, r) === C.T.WATER) {
          this.waterTiles.push({ c, r, surf: this.get(c, r - 1) !== C.T.WATER });
        }
      }
    }
  }

  // ── Per-frame drawing ──────────────────────────────────────────────────────
  draw(ctx, camX, camY, time = 0) {
    const s = Math.min(RENDER_SCALE, 2);
    if (!this.cache || this.cacheScale !== s) this._buildCache(s);
    // Snap to device pixels to avoid shimmering seams
    const sx = Math.round(camX * s), sy = Math.round(camY * s);
    const vw = Math.min(this.cache.width - sx, Math.ceil(C.W * s));
    const vh = Math.min(this.cache.height - sy, Math.ceil(C.H * s));
    const ox = Math.max(0, -sx), oy = Math.max(0, -sy);
    if (vw > 0 && vh > 0) {
      ctx.drawImage(this.cache, sx + ox, sy + oy, vw - ox, vh - oy,
        (ox) / s, (oy) / s, (vw - ox) / s, (vh - oy) / s);
    }
    this._drawExit(ctx, camX, camY, time);
  }

  // Translucent water surface drawn over entities so swimmers look submerged
  drawFront(ctx, camX, camY, time = 0) {
    if (!this.waterTiles || !this.waterTiles.length) return;
    const th = this.theme;
    const c1 = Math.floor(camX / TS) - 1, c2 = Math.ceil((camX + C.W) / TS) + 1;
    const wave = (wx) => Math.sin(time * 2.4 + wx * 0.045) * 2.2 + Math.sin(time * 3.7 + wx * 0.11) * 1.1;
    ctx.save();
    for (const w of this.waterTiles) {
      if (w.c < c1 || w.c > c2) continue;
      const px = w.c * TS - camX, py = w.r * TS - camY;
      const g = ctx.createLinearGradient(0, py, 0, py + TS);
      g.addColorStop(0, th.water[0]);
      g.addColorStop(1, th.water[1]);
      ctx.fillStyle = g;
      if (w.surf) {
        ctx.beginPath();
        ctx.moveTo(px, py + TS);
        for (let x = 0; x <= TS; x += 4) ctx.lineTo(px + x, py + 5 + wave(w.c * TS + x));
        ctx.lineTo(px + TS, py + TS);
        ctx.closePath();
        ctx.fill();
        ctx.strokeStyle = th.waterSurf;
        ctx.globalAlpha = 0.85;
        ctx.lineWidth = 1.5;
        ctx.beginPath();
        for (let x = 0; x <= TS; x += 4) {
          const y = py + 5 + wave(w.c * TS + x);
          x === 0 ? ctx.moveTo(px + x, y) : ctx.lineTo(px + x, y);
        }
        ctx.stroke();
        ctx.globalAlpha = 1;
      } else {
        ctx.fillRect(px, py, TS, TS);
      }
      // Caustic light ripples
      ctx.globalAlpha = 0.16;
      ctx.strokeStyle = '#ffffff';
      ctx.lineWidth = 1;
      for (let k = 0; k < 2; k++) {
        const yy = py + 12 + k * 10 + Math.sin(time * 1.7 + w.c * 1.3 + k) * 3;
        const xx = px + ((time * 14 + w.c * 11 + k * 15) % TS);
        ctx.beginPath();
        ctx.moveTo(xx - 5, yy);
        ctx.quadraticCurveTo(xx, yy - 2.5, xx + 5, yy);
        ctx.stroke();
      }
      ctx.globalAlpha = 1;
    }
    ctx.restore();
  }

  // Clean-water exit station: hydrant standpipe with spinning valve wheel
  _drawExit(ctx, camX, camY, time) {
    if (this.exitHidden) return;
    const x = this.exitX + TS / 2 - camX, base = this.exitY + TS - camY;
    if (x < -80 || x > C.W + 80) return;
    const pulse = 0.5 + 0.5 * Math.sin(time * 3);
    if (this.exitLocked) { this._drawLockedExit(ctx, x, base, time); return; }

    ctx.save();
    // Glow
    ctx.globalCompositeOperation = 'lighter';
    const gl = ctx.createRadialGradient(x, base - 30, 4, x, base - 30, 70);
    gl.addColorStop(0, `rgba(120,255,200,${0.22 + 0.12 * pulse})`);
    gl.addColorStop(1, 'rgba(120,255,200,0)');
    ctx.fillStyle = gl;
    ctx.fillRect(x - 70, base - 100, 140, 140);
    ctx.globalCompositeOperation = 'source-over';

    // Flag pole + EXIT pennant
    ctx.fillStyle = '#d5dde4';
    ctx.fillRect(x + 18, base - 70, 2.5, 70);
    const flap = Math.sin(time * 6) * 2;
    ctx.beginPath();
    ctx.moveTo(x + 20.5, base - 70);
    ctx.lineTo(x + 46, base - 63 + flap);
    ctx.lineTo(x + 20.5, base - 54);
    ctx.closePath();
    ctx.fillStyle = '#2ecc71';
    ctx.fill();
    ctx.strokeStyle = C.COL.OUTLINE; ctx.lineWidth = 1; ctx.stroke();
    ctx.fillStyle = '#fff';
    ctx.font = "bold 7px 'Courier New', monospace";
    ctx.textAlign = 'left';
    ctx.fillText('EXIT', x + 23, base - 60 + flap * 0.5);

    // Standpipe body
    const body = ctx.createLinearGradient(x - 10, 0, x + 10, 0);
    body.addColorStop(0, '#0f5a8f'); body.addColorStop(0.35, '#3fa4e8');
    body.addColorStop(0.6, '#2a86c8'); body.addColorStop(1, '#0d4670');
    ctx.fillStyle = body;
    ctx.strokeStyle = C.COL.OUTLINE;
    ctx.beginPath(); ctx.roundRect(x - 10, base - 40, 20, 40, 3); ctx.fill(); ctx.stroke();
    ctx.fillStyle = '#16679f';
    ctx.beginPath(); ctx.roundRect(x - 14, base - 6, 28, 6, 2); ctx.fill(); ctx.stroke();
    ctx.beginPath(); ctx.roundRect(x - 13, base - 44, 26, 6, 2); ctx.fill(); ctx.stroke();
    // Side nozzle
    ctx.fillStyle = '#2a86c8';
    ctx.beginPath(); ctx.roundRect(x - 20, base - 26, 10, 8, 2); ctx.fill(); ctx.stroke();

    // Spinning valve wheel on top
    ctx.save();
    ctx.translate(x, base - 50);
    ctx.rotate(time * 1.6);
    ctx.strokeStyle = '#d63b2f'; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.arc(0, 0, 9, 0, Math.PI * 2); ctx.stroke();
    ctx.lineWidth = 2;
    for (let i = 0; i < 4; i++) {
      ctx.rotate(Math.PI / 2);
      ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(9, 0); ctx.stroke();
    }
    ctx.fillStyle = '#8f2018';
    ctx.beginPath(); ctx.arc(0, 0, 2.5, 0, Math.PI * 2); ctx.fill();
    ctx.restore();

    // Clean water arcing from the nozzle
    ctx.strokeStyle = 'rgba(170,235,255,0.85)';
    ctx.lineWidth = 2.5;
    ctx.lineCap = 'round';
    for (let i = 0; i < 6; i++) {
      const ph = (time * 1.8 + i / 6) % 1;
      const dx = -20 - ph * 22, dy = -22 + ph * ph * 22 - ph * 6;
      ctx.globalAlpha = 1 - ph;
      ctx.beginPath(); ctx.arc(x + dx, base + dy, 1.6 + ph, 0, Math.PI * 2); ctx.stroke();
    }
    ctx.globalAlpha = 1;

    // Bobbing arrow
    const ay = base - 92 + Math.sin(time * 4) * 4;
    ctx.fillStyle = '#9ff3e4';
    ctx.strokeStyle = C.COL.OUTLINE;
    ctx.beginPath();
    ctx.moveTo(x - 7, ay); ctx.lineTo(x + 7, ay); ctx.lineTo(x + 7, ay + 6);
    ctx.lineTo(x + 12, ay + 6); ctx.lineTo(x, ay + 16); ctx.lineTo(x - 12, ay + 6);
    ctx.lineTo(x - 7, ay + 6); ctx.closePath();
    ctx.fill(); ctx.stroke();
    ctx.restore();
  }

  // Valve shut: red glow, chained wheel and a sign with how many are left
  _drawLockedExit(ctx, x, base, time) {
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    const gl = ctx.createRadialGradient(x, base - 30, 4, x, base - 30, 60);
    gl.addColorStop(0, `rgba(255,80,60,${0.16 + 0.08 * Math.sin(time * 4)})`);
    gl.addColorStop(1, 'rgba(255,80,60,0)');
    ctx.fillStyle = gl;
    ctx.fillRect(x - 60, base - 90, 120, 120);
    ctx.globalCompositeOperation = 'source-over';
    ctx.strokeStyle = C.COL.OUTLINE; ctx.lineWidth = 1;
    const body = ctx.createLinearGradient(x - 10, 0, x + 10, 0);
    body.addColorStop(0, '#5a6570'); body.addColorStop(0.4, '#a9b4be'); body.addColorStop(1, '#4a545e');
    ctx.fillStyle = body;
    ctx.beginPath(); ctx.roundRect(x - 10, base - 40, 20, 40, 3); ctx.fill(); ctx.stroke();
    ctx.fillStyle = '#5a6570';
    ctx.beginPath(); ctx.roundRect(x - 14, base - 6, 28, 6, 2); ctx.fill(); ctx.stroke();
    ctx.beginPath(); ctx.roundRect(x - 13, base - 44, 26, 6, 2); ctx.fill(); ctx.stroke();
    // Wheel with a chain and padlock
    ctx.strokeStyle = '#8f2018'; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.arc(x, base - 50, 9, 0, Math.PI * 2); ctx.stroke();
    ctx.strokeStyle = '#c9d3dd'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(x - 11, base - 58); ctx.lineTo(x + 11, base - 42); ctx.moveTo(x + 11, base - 58); ctx.lineTo(x - 11, base - 42); ctx.stroke();
    ctx.fillStyle = '#f1c40f'; ctx.strokeStyle = C.COL.OUTLINE; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.roundRect(x - 5, base - 52, 10, 8, 1.5); ctx.fill(); ctx.stroke();
    ctx.strokeStyle = '#f1c40f'; ctx.lineWidth = 1.6;
    ctx.beginPath(); ctx.arc(x, base - 52, 3, Math.PI, 0); ctx.stroke();
    // Sign
    const sy = base - 92 + Math.sin(time * 3) * 2;
    ctx.fillStyle = '#b02a22'; ctx.strokeStyle = C.COL.OUTLINE;
    ctx.beginPath(); ctx.roundRect(x - 34, sy, 68, 26, 5); ctx.fill(); ctx.stroke();
    ctx.fillStyle = '#ffffff';
    ctx.font = "bold 8px 'Courier New', monospace";
    ctx.textAlign = 'center';
    ctx.fillText('CLEAR ALL', x, sy + 10);
    ctx.fillText(`${this.exitRemaining || 0} LEFT`, x, sy + 20);
    ctx.restore();
  }

  // ── Static tile cache ──────────────────────────────────────────────────────
  _buildCache(s) {
    if (!this.waterTiles) this._scanWater();
    const cv = document.createElement('canvas');
    cv.width = Math.ceil(this.cols * TS * s);
    cv.height = Math.ceil(this.rows * TS * s);
    const ctx = cv.getContext('2d');
    ctx.scale(s, s);
    const T = C.T;

    // Pass 1: water back (deep colour behind entities)
    for (const w of this.waterTiles) {
      const px = w.c * TS, py = w.r * TS;
      const g = ctx.createLinearGradient(0, py, 0, py + TS);
      g.addColorStop(0, this.theme.waterBack);
      g.addColorStop(1, '#0a1c2c');
      ctx.globalAlpha = 0.75;
      ctx.fillStyle = g;
      ctx.fillRect(px, py + (w.surf ? 5 : 0), TS, TS - (w.surf ? 5 : 0));
      ctx.globalAlpha = 1;
    }

    // Pass 2: terrain (solid ground and anything embedded in it)
    for (let r = 0; r < this.rows; r++) {
      for (let c = 0; c < this.cols; c++) {
        const t = this.get(c, r);
        if (t === T.SOLID) this._ground(ctx, c, r);
        else if ((t === T.PIPE_H || t === T.LEAD_TILE) && this._embedded(c, r)) this._ground(ctx, c, r);
      }
    }
    // Pass 3: pipes, lead lines, platforms, spikes
    for (let r = 0; r < this.rows; r++) {
      for (let c = 0; c < this.cols; c++) {
        const t = this.get(c, r), px = c * TS, py = r * TS;
        if (t === T.PIPE_H) this._pipeH(ctx, c, r, px, py, this.theme.pipe, false);
        else if (t === T.LEAD_TILE) this._lead(ctx, c, r, px, py);
        else if (t === T.PIPE_V) this._pipeV(ctx, c, r, px, py);
        else if (t === T.PLATFORM) this._platform(ctx, c, r, px, py);
        else if (t === T.SPIKE) this._spike(ctx, px, py);
      }
    }
    // Pass 4: surface decoration props
    this._decorate(ctx);

    this.cache = cv;
    this.cacheScale = s;
  }

  _solidAt(c, r) { return Phys.solid(this.get(c, r)); }

  // A pipe/lead tile with ground above or below is drawn buried in soil
  _embedded(c, r) {
    const below = this.get(c, r + 1), above = this.get(c, r - 1);
    return below === C.T.SOLID || above === C.T.SOLID || below === C.T.LEAD_TILE || above === C.T.LEAD_TILE;
  }

  _ground(ctx, c, r) {
    const th = this.theme, px = c * TS, py = r * TS;
    const up = this.get(c, r - 1);
    const openTop = !this._solidAt(c, r - 1) && r > 0;
    const openL = !this._solidAt(c - 1, r) && c > 0;
    const openR = !this._solidAt(c + 1, r) && c < this.cols - 1;
    const openB = !this._solidAt(c, r + 1) && r < this.rows - 1;
    // Depth below the nearest open surface, for ambient occlusion
    let depth = 0;
    while (depth < 4 && this._solidAt(c, r - depth - 1) && r - depth - 1 >= 0) depth++;
    if (r === 0 || (th.ceiling && r <= 1 && !openB)) depth = 3;

    switch (th.ground) {
      case 'soil':  this._soil(ctx, c, r, px, py, depth); break;
      case 'brick': this._brick(ctx, c, r, px, py, depth); break;
      case 'tile':  this._panel(ctx, c, r, px, py, depth); break;
      default:      this._iron(ctx, c, r, px, py, depth); break;
    }

    // Exposed edges get a soft inner shadow and dark outline
    ctx.fillStyle = 'rgba(0,0,0,0.22)';
    if (openL) ctx.fillRect(px, py, 3, TS);
    if (openR) ctx.fillRect(px + TS - 3, py, 3, TS);
    if (openB) ctx.fillRect(px, py + TS - 4, TS, 4);
    ctx.fillStyle = th.line;
    if (openL) ctx.fillRect(px, py, 1.5, TS);
    if (openR) ctx.fillRect(px + TS - 1.5, py, 1.5, TS);
    if (openB) ctx.fillRect(px, py + TS - 1.5, TS, 1.5);

    if (openTop && up !== C.T.WATER) this._cap(ctx, c, r, px, py, openL, openR);
    else if (openTop) { // underwater lip
      ctx.fillStyle = th.fill[2];
      ctx.fillRect(px, py, TS, 3);
    }
    if (openB && th.ceiling) this._underside(ctx, c, r, px, py);
  }

  _soil(ctx, c, r, px, py, depth) {
    const th = this.theme;
    const g = ctx.createLinearGradient(0, py, 0, py + TS);
    const k = Math.min(depth, 2);
    g.addColorStop(0, th.fill[k]);
    g.addColorStop(1, th.fill[Math.min(k + 1, 2)]);
    ctx.fillStyle = g;
    ctx.fillRect(px, py, TS, TS);
    // Strata band
    if (M.hash(c, r, 1) < 0.5) {
      ctx.fillStyle = 'rgba(0,0,0,0.08)';
      ctx.fillRect(px, py + 10 + M.hash(c, r, 2) * 14, TS, 2);
    }
    // Pebbles
    for (let i = 0; i < 3; i++) {
      const h = M.hash(c, r, 10 + i);
      if (h > 0.6) continue;
      const x = px + 4 + M.hash(c, r, 20 + i) * 24, y = py + 4 + M.hash(c, r, 30 + i) * 24;
      const rr = 1.2 + h * 2.5;
      ctx.fillStyle = h < 0.2 ? '#b8a690' : '#4a2e1c';
      ctx.beginPath(); ctx.ellipse(x, y, rr * 1.3, rr, 0, 0, Math.PI * 2); ctx.fill();
      if (h < 0.2) { ctx.fillStyle = 'rgba(255,255,255,0.35)'; ctx.fillRect(x - rr * 0.6, y - rr * 0.6, rr * 0.7, rr * 0.5); }
    }
  }

  _brick(ctx, c, r, px, py, depth) {
    const th = this.theme;
    ctx.fillStyle = th.line;
    ctx.fillRect(px, py, TS, TS);
    for (let row = 0; row < 4; row++) {
      const gy = r * 4 + row;
      const off = (gy % 2) * 8;
      for (let b = -1; b < 2; b++) {
        const bx = px + b * 16 + off, by = py + row * 8;
        const x0 = Math.max(bx, px), x1 = Math.min(bx + 15, px + TS);
        if (x1 <= x0) continue;
        const h = M.hash(Math.floor((c * 32 + b * 16 + off) / 16), gy, 3);
        const base = h < 0.33 ? th.fill[0] : h < 0.8 ? th.fill[1] : th.fill[2];
        ctx.fillStyle = base;
        ctx.fillRect(x0, by + 1, x1 - x0, 7);
        ctx.fillStyle = 'rgba(255,255,255,0.12)';
        ctx.fillRect(x0, by + 1, x1 - x0, 1);
        ctx.fillStyle = 'rgba(0,0,0,0.18)';
        ctx.fillRect(x0, by + 7, x1 - x0, 1);
      }
    }
    if (depth > 0) { ctx.fillStyle = `rgba(0,0,0,${0.06 * Math.min(depth, 3)})`; ctx.fillRect(px, py, TS, TS); }
    // Damp moss stains
    if (M.hash(c, r, 7) < 0.15) {
      ctx.fillStyle = 'rgba(90,140,80,0.35)';
      ctx.beginPath(); ctx.ellipse(px + 8 + M.hash(c, r, 8) * 16, py + 16, 7, 4, 0, 0, Math.PI * 2); ctx.fill();
    }
  }

  _panel(ctx, c, r, px, py, depth) {
    const th = this.theme;
    ctx.fillStyle = th.line;
    ctx.fillRect(px, py, TS, TS);
    for (let i = 0; i < 2; i++) for (let j = 0; j < 2; j++) {
      const x = px + i * 16 + 0.5, y = py + j * 16 + 0.5;
      const h = M.hash(c * 2 + i, r * 2 + j, 4);
      ctx.fillStyle = h < 0.7 ? th.fill[0] : th.fill[1];
      ctx.fillRect(x, y, 15, 15);
      ctx.fillStyle = 'rgba(255,255,255,0.45)';
      ctx.fillRect(x, y, 15, 1); ctx.fillRect(x, y, 1, 15);
      ctx.fillStyle = 'rgba(0,0,0,0.15)';
      ctx.fillRect(x, y + 14, 15, 1); ctx.fillRect(x + 14, y, 1, 15);
    }
    if (depth > 0) { ctx.fillStyle = `rgba(20,40,55,${0.08 * Math.min(depth, 3)})`; ctx.fillRect(px, py, TS, TS); }
    if (M.hash(c, r, 5) < 0.3) { // rivets
      ctx.fillStyle = th.fill[2];
      for (const [x, y] of [[4, 4], [28, 4], [4, 28], [28, 28]]) {
        ctx.beginPath(); ctx.arc(px + x, py + y, 1.3, 0, Math.PI * 2); ctx.fill();
      }
    }
  }

  _iron(ctx, c, r, px, py, depth) {
    const th = this.theme;
    const g = ctx.createLinearGradient(px, py, px + TS, py + TS);
    g.addColorStop(0, th.fill[0]); g.addColorStop(1, th.fill[1]);
    ctx.fillStyle = g;
    ctx.fillRect(px, py, TS, TS);
    ctx.strokeStyle = th.line; ctx.lineWidth = 1;
    ctx.strokeRect(px + 0.5, py + 0.5, TS - 1, TS - 1);
    ctx.fillStyle = 'rgba(255,255,255,0.08)';
    ctx.fillRect(px + 1, py + 1, TS - 2, 1.5);
    // Rivets
    for (const [x, y] of [[4, 4], [28, 4], [4, 28], [28, 28]]) {
      ctx.fillStyle = '#2a201b';
      ctx.beginPath(); ctx.arc(px + x, py + y + 0.6, 1.8, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#9b8a80';
      ctx.beginPath(); ctx.arc(px + x - 0.3, py + y - 0.3, 1.2, 0, Math.PI * 2); ctx.fill();
    }
    // Rust streaks
    const h = M.hash(c, r, 6);
    if (h < 0.55) {
      const x = px + 6 + M.hash(c, r, 9) * 20;
      const len = 8 + h * 30;
      const rg = ctx.createLinearGradient(0, py + 4, 0, py + 4 + len);
      rg.addColorStop(0, 'rgba(196,92,32,0.75)'); rg.addColorStop(1, 'rgba(196,92,32,0)');
      ctx.fillStyle = rg;
      ctx.fillRect(x, py + 4, 2.5, len);
    }
    if (depth > 0) { ctx.fillStyle = `rgba(0,0,0,${0.08 * Math.min(depth, 3)})`; ctx.fillRect(px, py, TS, TS); }
  }

  // Top surface: grass / mossy capstones / hazard-striped edge / steel rim
  _cap(ctx, c, r, px, py, openL, openR) {
    const th = this.theme;
    if (th.ground === 'soil') {
      const g = ctx.createLinearGradient(0, py, 0, py + 9);
      g.addColorStop(0, th.capA); g.addColorStop(1, th.capB);
      ctx.fillStyle = g;
      ctx.fillRect(px, py, TS, 8);
      // wavy bottom edge of turf
      ctx.beginPath();
      ctx.moveTo(px, py + 7);
      for (let x = 0; x <= TS; x += 4) ctx.lineTo(px + x, py + 7 + M.hash(c * 8 + x / 4, r, 2) * 3);
      ctx.lineTo(px + TS, py + 6); ctx.lineTo(px, py + 6);
      ctx.fill();
      // blades
      ctx.strokeStyle = th.capB; ctx.lineWidth = 1.4;
      ctx.beginPath();
      for (let i = 0; i < 7; i++) {
        const x = px + 2 + i * 4.6 + M.hash(c, i, 3) * 2;
        const hgt = 2 + M.hash(c, i, 4) * 4;
        ctx.moveTo(x, py + 1); ctx.lineTo(x + (M.hash(c, i, 5) - 0.5) * 3, py + 1 - hgt);
      }
      ctx.stroke();
      ctx.fillStyle = th.capHi;
      ctx.fillRect(px, py, TS, 1.5);
      if (openL) { ctx.fillStyle = th.capB; ctx.beginPath(); ctx.ellipse(px + 1, py + 6, 3, 7, 0, 0, Math.PI * 2); ctx.fill(); }
      if (openR) { ctx.fillStyle = th.capB; ctx.beginPath(); ctx.ellipse(px + TS - 1, py + 6, 3, 7, 0, 0, Math.PI * 2); ctx.fill(); }
    } else if (th.ground === 'brick') {
      ctx.fillStyle = th.capEdge;
      ctx.fillRect(px - (openL ? 1 : 0), py, TS + (openL ? 1 : 0) + (openR ? 1 : 0), 7);
      ctx.fillStyle = '#7f8c99';
      ctx.fillRect(px, py, TS, 5);
      ctx.fillStyle = '#a7b3be';
      ctx.fillRect(px, py, TS, 1.5);
      // moss tufts spilling over the edge
      ctx.fillStyle = th.capA;
      for (let i = 0; i < 4; i++) {
        if (M.hash(c, i, 11) < 0.45) continue;
        const x = px + i * 8 + 2;
        ctx.beginPath(); ctx.ellipse(x + 3, py + 1, 4.5, 2.5, 0, 0, Math.PI * 2); ctx.fill();
        if (M.hash(c, i, 12) < 0.4) ctx.fillRect(x + 2, py + 2, 1.5, 4 + M.hash(c, i, 13) * 5);
      }
      ctx.fillStyle = th.capHi;
      for (let i = 0; i < 4; i++) if (M.hash(c, i, 11) >= 0.45) ctx.fillRect(px + i * 8 + 3, py - 0.5, 3, 1);
    } else if (th.ground === 'tile') {
      ctx.fillStyle = th.capB;
      ctx.fillRect(px, py, TS, 6);
      ctx.save();
      ctx.beginPath(); ctx.rect(px, py, TS, 6); ctx.clip();
      ctx.fillStyle = th.capA;
      for (let i = -1; i < 5; i++) {
        const x = px + i * 10 + ((c * 32) % 10);
        ctx.beginPath(); ctx.moveTo(x, py + 6); ctx.lineTo(x + 5, py); ctx.lineTo(x + 10, py); ctx.lineTo(x + 5, py + 6); ctx.fill();
      }
      ctx.restore();
      ctx.fillStyle = 'rgba(255,255,255,0.5)';
      ctx.fillRect(px, py, TS, 1);
      ctx.fillStyle = 'rgba(0,0,0,0.25)';
      ctx.fillRect(px, py + 6, TS, 1.5);
    } else {
      const g = ctx.createLinearGradient(0, py, 0, py + 7);
      g.addColorStop(0, th.capHi); g.addColorStop(0.4, th.capA); g.addColorStop(1, th.capB);
      ctx.fillStyle = g;
      ctx.fillRect(px, py, TS, 7);
      ctx.fillStyle = th.capEdge;
      ctx.fillRect(px, py + 7, TS, 1.5);
      for (const x of [6, 26]) {
        ctx.fillStyle = '#3a4246'; ctx.beginPath(); ctx.arc(px + x, py + 3.5, 1.6, 0, Math.PI * 2); ctx.fill();
      }
    }
  }

  // Ceiling undersides in indoor worlds: drips, stalactites, cables
  _underside(ctx, c, r, px, py) {
    const h = M.hash(c, r, 21);
    if (this.theme.ground === 'brick') {
      if (h < 0.35) {
        ctx.fillStyle = '#3c4a56';
        const x = px + 6 + M.hash(c, r, 22) * 20, len = 5 + h * 18;
        ctx.beginPath(); ctx.moveTo(x - 3, py + TS); ctx.lineTo(x + 3, py + TS); ctx.lineTo(x, py + TS + len); ctx.fill();
      }
      if (h > 0.8) {
        ctx.fillStyle = 'rgba(110,160,95,0.7)';
        for (let i = 0; i < 3; i++) ctx.fillRect(px + 6 + i * 9, py + TS, 2, 4 + M.hash(c, i, 23) * 9);
      }
    } else if (h < 0.18) {
      ctx.strokeStyle = '#2b3338'; ctx.lineWidth = 1.2;
      ctx.beginPath(); ctx.moveTo(px + 4, py + TS); ctx.quadraticCurveTo(px + 16, py + TS + 14, px + 28, py + TS); ctx.stroke();
    }
  }

  _pipeH(ctx, c, r, px, py, col, isLead) {
    const T = C.T, t = this.get(c, r);
    const same = (cc) => this.get(cc, r) === t;
    const emb = this._embedded(c, r);
    const top = emb ? py + 10 : py + 2, bot = emb ? py + 28 : py + 30;
    const hgt = bot - top;
    const g = ctx.createLinearGradient(0, top, 0, bot);
    g.addColorStop(0, col[1]); g.addColorStop(0.25, col[2]); g.addColorStop(0.5, col[0]);
    g.addColorStop(1, col[1]);
    if (emb) { // trench shadow
      ctx.fillStyle = 'rgba(0,0,0,0.25)';
      ctx.fillRect(px, top - 2, TS, hgt + 4);
    }
    ctx.fillStyle = g;
    ctx.fillRect(px, top, TS, hgt);
    ctx.fillStyle = 'rgba(0,0,0,0.35)';
    ctx.fillRect(px, bot - 1.5, TS, 1.5);
    ctx.fillStyle = 'rgba(255,255,255,0.35)';
    ctx.fillRect(px, top + 2, TS, 1);

    // Flanged joints at the ends and every few tiles
    const flange = (x) => {
      const fg = ctx.createLinearGradient(0, top - 3, 0, bot + 3);
      fg.addColorStop(0, col[1]); fg.addColorStop(0.3, col[2]); fg.addColorStop(1, col[1]);
      ctx.fillStyle = fg;
      ctx.fillRect(x - 3, top - 3, 6, hgt + 6);
      ctx.strokeStyle = C.COL.OUTLINE; ctx.lineWidth = 1;
      ctx.strokeRect(x - 3, top - 3, 6, hgt + 6);
      ctx.fillStyle = '#d9e2ea';
      ctx.fillRect(x - 1, top - 1.5, 2, 1.5); ctx.fillRect(x - 1, bot, 2, 1.5);
    };
    if (!same(c - 1)) flange(px + 3);
    if (!same(c + 1)) flange(px + TS - 3);
    if (same(c - 1) && same(c + 1) && c % 4 === 0) flange(px + TS / 2);

    ctx.strokeStyle = C.COL.OUTLINE; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(px, top); ctx.lineTo(px + TS, top); ctx.moveTo(px, bot); ctx.lineTo(px + TS, bot); ctx.stroke();

    if (!isLead && !emb && !same(c - 1) && M.hash(c, r, 31) < 0.6) {
      // Gauge on an exposed pipe end
      ctx.fillStyle = '#f4f6f8';
      ctx.beginPath(); ctx.arc(px + 14, top - 4, 4.5, 0, Math.PI * 2); ctx.fill();
      ctx.strokeStyle = C.COL.OUTLINE; ctx.stroke();
      ctx.strokeStyle = '#d63b2f';
      ctx.beginPath(); ctx.moveTo(px + 14, top - 4); ctx.lineTo(px + 16.5, top - 6); ctx.stroke();
    }
    if (t !== T.PIPE_H && !isLead) return;
  }

  // Old lead service line: dull grey, crusted, with a warning tag
  _lead(ctx, c, r, px, py) {
    if (this._embedded(c, r) || this.get(c - 1, r) === C.T.LEAD_TILE || this.get(c + 1, r) === C.T.LEAD_TILE) {
      this._pipeH(ctx, c, r, px, py, ['#8a949d', '#4f5862', '#c3cad1'], true);
      const emb = this._embedded(c, r);
      const cy = emb ? py + 19 : py + 16;
      // Corrosion crust
      for (let i = 0; i < 4; i++) {
        const h = M.hash(c, i, 41);
        ctx.fillStyle = h < 0.5 ? 'rgba(235,240,230,0.55)' : 'rgba(60,66,72,0.6)';
        ctx.beginPath(); ctx.arc(px + 4 + i * 8 + h * 3, cy + (h - 0.5) * 8, 1.4 + h * 1.6, 0, Math.PI * 2); ctx.fill();
      }
      ctx.fillStyle = '#3d454c';
      ctx.font = "bold 8px 'Courier New', monospace";
      ctx.textAlign = 'center';
      ctx.fillText('Pb', px + 16, cy + 3);
      if (this.get(c - 1, r) !== C.T.LEAD_TILE) { // warning tag on the first segment
        ctx.fillStyle = '#f1c40f';
        ctx.strokeStyle = C.COL.OUTLINE;
        ctx.beginPath(); ctx.roundRect(px + 5, cy - 14, 13, 8, 1.5); ctx.fill(); ctx.stroke();
        ctx.fillStyle = '#1b1b1b';
        ctx.font = "bold 6px 'Courier New', monospace";
        ctx.fillText('!', px + 11.5, cy - 7.8);
      }
    } else {
      // Free-standing vertical lead column (boss arenas)
      const g = ctx.createLinearGradient(px + 3, 0, px + 29, 0);
      g.addColorStop(0, '#4f5862'); g.addColorStop(0.3, '#c3cad1'); g.addColorStop(0.6, '#8a949d'); g.addColorStop(1, '#4f5862');
      ctx.fillStyle = g;
      ctx.fillRect(px + 3, py, 26, TS);
      ctx.strokeStyle = C.COL.OUTLINE; ctx.lineWidth = 1;
      ctx.beginPath(); ctx.moveTo(px + 3, py); ctx.lineTo(px + 3, py + TS); ctx.moveTo(px + 29, py); ctx.lineTo(px + 29, py + TS); ctx.stroke();
      ctx.fillStyle = 'rgba(160,190,140,0.5)';
      ctx.beginPath(); ctx.arc(px + 10 + M.hash(c, r, 3) * 12, py + 10 + M.hash(c, r, 4) * 12, 3, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#3d454c';
      ctx.font = "bold 8px 'Courier New', monospace";
      ctx.textAlign = 'center';
      ctx.fillText('Pb', px + 16, py + 19);
      if (this.get(c, r - 1) !== C.T.LEAD_TILE) {
        ctx.fillStyle = '#6f7983';
        ctx.fillRect(px, py, TS, 5);
        ctx.strokeRect(px, py, TS, 5);
      }
    }
  }

  _pipeV(ctx, c, r, px, py) {
    const col = this.theme.pipe;
    const g = ctx.createLinearGradient(px + 4, 0, px + 28, 0);
    g.addColorStop(0, col[1]); g.addColorStop(0.3, col[2]); g.addColorStop(0.55, col[0]); g.addColorStop(1, col[1]);
    ctx.fillStyle = g;
    ctx.fillRect(px + 4, py, 24, TS);
    ctx.strokeStyle = C.COL.OUTLINE; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(px + 4, py); ctx.lineTo(px + 4, py + TS); ctx.moveTo(px + 28, py); ctx.lineTo(px + 28, py + TS); ctx.stroke();
    const topEnd = this.get(c, r - 1) !== C.T.PIPE_V;
    if (topEnd) {
      // Cap flange and a red valve wheel to stand on
      const fg = ctx.createLinearGradient(0, py, 0, py + 7);
      fg.addColorStop(0, col[2]); fg.addColorStop(1, col[1]);
      ctx.fillStyle = fg;
      ctx.fillRect(px + 1, py, 30, 7);
      ctx.strokeRect(px + 1, py, 30, 7);
      ctx.fillStyle = '#e8eef3';
      for (const x of [5, 16, 27]) ctx.fillRect(px + x - 1, py + 2.5, 2, 2);
    } else if (r % 2 === 0) {
      ctx.fillStyle = 'rgba(0,0,0,0.35)';
      ctx.fillRect(px + 2, py + 12, 28, 5);
      ctx.fillStyle = col[1];
      ctx.fillRect(px + 2, py + 11, 28, 4);
    }
  }

  // One-way metal grate catwalk
  _platform(ctx, c, r, px, py) {
    const col = this.theme.plat, T = C.T;
    const leftEnd = this.get(c - 1, r) !== T.PLATFORM, rightEnd = this.get(c + 1, r) !== T.PLATFORM;
    // Struts under the ends
    ctx.strokeStyle = col[1]; ctx.lineWidth = 2.5;
    ctx.beginPath();
    if (leftEnd) { ctx.moveTo(px + 4, py + 8); ctx.lineTo(px + 12, py + 18); }
    if (rightEnd) { ctx.moveTo(px + TS - 4, py + 8); ctx.lineTo(px + TS - 12, py + 18); }
    ctx.stroke();
    const g = ctx.createLinearGradient(0, py, 0, py + 9);
    g.addColorStop(0, col[2]); g.addColorStop(0.35, col[0]); g.addColorStop(1, col[1]);
    ctx.fillStyle = g;
    ctx.fillRect(px, py, TS, 9);
    ctx.fillStyle = 'rgba(0,0,0,0.45)';
    for (let i = 0; i < 4; i++) ctx.fillRect(px + 3 + i * 8, py + 3.5, 5, 2.5);
    ctx.strokeStyle = C.COL.OUTLINE; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(px, py + 9); ctx.lineTo(px + TS, py + 9); ctx.moveTo(px, py + 0.5); ctx.lineTo(px + TS, py + 0.5); ctx.stroke();
    if (leftEnd) ctx.strokeRect(px + 0.5, py + 0.5, 1, 8.5);
    if (rightEnd) ctx.strokeRect(px + TS - 1.5, py + 0.5, 1, 8.5);
  }

  // Broken pipe shards — rusty metal spikes
  _spike(ctx, px, py) {
    ctx.fillStyle = '#3a3f45';
    ctx.fillRect(px + 1, py + TS - 5, TS - 2, 5);
    for (let i = 0; i < 4; i++) {
      const x = px + 2 + i * 7.5, w = 7;
      const g = ctx.createLinearGradient(x, 0, x + w, 0);
      g.addColorStop(0, '#6b737b'); g.addColorStop(0.5, '#dfe5ea'); g.addColorStop(1, '#58616a');
      ctx.fillStyle = g;
      ctx.beginPath();
      ctx.moveTo(x, py + TS - 4); ctx.lineTo(x + w / 2, py + 12); ctx.lineTo(x + w, py + TS - 4);
      ctx.closePath(); ctx.fill();
      ctx.strokeStyle = C.COL.OUTLINE; ctx.lineWidth = 0.8; ctx.stroke();
      ctx.fillStyle = '#d63b2f';
      ctx.beginPath();
      ctx.moveTo(x + w / 2 - 1.6, py + 16); ctx.lineTo(x + w / 2, py + 12); ctx.lineTo(x + w / 2 + 1.6, py + 16);
      ctx.fill();
    }
  }

  // Small props scattered along walkable surfaces (deterministic per tile)
  _decorate(ctx) {
    const T = C.T, th = this.theme;
    const spawnC = Math.floor(this.spawnX / TS), exitC = Math.floor(this.exitX / TS);
    for (let c = 1; c < this.cols - 1; c++) {
      if (Math.abs(c - spawnC) < 2 || Math.abs(c - exitC) < 3) continue;
      for (let r = 1; r < this.rows; r++) {
        if (this.get(c, r) !== T.SOLID || this.get(c, r - 1) !== T.EMPTY) continue;
        const h = M.hash(c, r, 77);
        const x = c * TS + 6 + M.hash(c, r, 78) * 20, y = r * TS;
        ctx.save();
        ctx.translate(x, y);
        switch (th.key) {
          case 'surface':
            if (h < 0.22) this._propFlowers(ctx, c);
            else if (h < 0.3) this._propRock(ctx);
            else if (h < 0.34) this._propHydrant(ctx);
            else if (h < 0.37) this._propSign(ctx, 'SJWD');
            break;
          case 'sewer':
            if (h < 0.15) this._propMushrooms(ctx, c);
            else if (h < 0.24) this._propRock(ctx, '#5b6774');
            else if (h < 0.28) this._propBarrel(ctx, '#5e4b3a', '#3e3127');
            break;
          case 'plant':
            if (h < 0.1) this._propBarrel(ctx, '#2f7fd0', '#1d5591');
            else if (h < 0.16) this._propCone(ctx);
            else if (h < 0.2) this._propSign(ctx, 'Cl₂');
            break;
          default:
            if (h < 0.12) this._propCone(ctx);
            else if (h < 0.2) this._propCrate(ctx);
            else if (h < 0.26) this._propValveBox(ctx);
        }
        ctx.restore();
      }
    }
  }

  _propFlowers(ctx, c) {
    const cols = ['#ffffff', '#ffd84a', '#ff8fb1', '#b9a6ff'];
    for (let i = 0; i < 3; i++) {
      const x = i * 5 - 5, hgt = 6 + M.hash(c, i, 90) * 6;
      ctx.strokeStyle = '#3c9433'; ctx.lineWidth = 1;
      ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, -hgt); ctx.stroke();
      ctx.fillStyle = cols[Math.floor(M.hash(c, i, 91) * cols.length)];
      for (let k = 0; k < 4; k++) {
        const a = k * Math.PI / 2;
        ctx.beginPath(); ctx.arc(x + Math.cos(a) * 1.6, -hgt + Math.sin(a) * 1.6, 1.3, 0, Math.PI * 2); ctx.fill();
      }
      ctx.fillStyle = '#f39c12';
      ctx.beginPath(); ctx.arc(x, -hgt, 0.9, 0, Math.PI * 2); ctx.fill();
    }
  }

  _propRock(ctx, col = '#9a9187') {
    ctx.fillStyle = col;
    ctx.strokeStyle = C.COL.OUTLINE; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(-6, 0); ctx.quadraticCurveTo(-6, -7, 0, -7); ctx.quadraticCurveTo(7, -7, 7, 0); ctx.closePath();
    ctx.fill(); ctx.stroke();
    ctx.fillStyle = 'rgba(255,255,255,0.35)';
    ctx.fillRect(-3, -5.5, 4, 1.5);
  }

  _propHydrant(ctx) {
    ctx.strokeStyle = C.COL.OUTLINE; ctx.lineWidth = 1;
    ctx.fillStyle = '#d6352b';
    ctx.beginPath(); ctx.roundRect(-5, -16, 10, 16, 2); ctx.fill(); ctx.stroke();
    ctx.beginPath(); ctx.ellipse(0, -16, 5.5, 4, 0, Math.PI, 0); ctx.fill(); ctx.stroke();
    ctx.fillStyle = '#b02a22';
    ctx.fillRect(-8, -11, 16, 4); ctx.strokeRect(-8, -11, 16, 4);
    ctx.fillStyle = '#ff8c7f'; ctx.fillRect(-3.5, -15, 1.5, 12);
    ctx.fillStyle = '#e9d36a'; ctx.fillRect(-1, -22, 2, 3);
  }

  _propSign(ctx, text) {
    ctx.fillStyle = '#6b4a2e'; ctx.fillRect(-1, -18, 2, 18);
    ctx.fillStyle = '#1a73b8';
    ctx.strokeStyle = C.COL.OUTLINE; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.roundRect(-10, -24, 20, 10, 1.5); ctx.fill(); ctx.stroke();
    ctx.fillStyle = '#fff';
    ctx.font = "bold 6px 'Courier New', monospace";
    ctx.textAlign = 'center';
    ctx.fillText(text, 0, -17);
  }

  _propMushrooms(ctx, c) {
    for (let i = 0; i < 2; i++) {
      const x = i * 6 - 3, hgt = 4 + M.hash(c, i, 92) * 4;
      ctx.fillStyle = '#d8d0c0'; ctx.fillRect(x - 0.8, -hgt, 1.6, hgt);
      ctx.fillStyle = '#4fe3c4';
      ctx.beginPath(); ctx.ellipse(x, -hgt, 3.2, 2, 0, Math.PI, 0); ctx.fill();
      ctx.save(); ctx.globalCompositeOperation = 'lighter';
      ctx.fillStyle = 'rgba(79,227,196,0.25)';
      ctx.beginPath(); ctx.arc(x, -hgt, 6, 0, Math.PI * 2); ctx.fill();
      ctx.restore();
    }
  }

  _propBarrel(ctx, a, b) {
    ctx.strokeStyle = C.COL.OUTLINE; ctx.lineWidth = 1;
    const g = ctx.createLinearGradient(-7, 0, 7, 0);
    g.addColorStop(0, b); g.addColorStop(0.4, a); g.addColorStop(1, b);
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.roundRect(-7, -18, 14, 18, 2); ctx.fill(); ctx.stroke();
    ctx.fillStyle = 'rgba(0,0,0,0.3)';
    ctx.fillRect(-7, -13, 14, 1.5); ctx.fillRect(-7, -5, 14, 1.5);
    ctx.fillStyle = 'rgba(255,255,255,0.3)'; ctx.fillRect(-4, -17, 2, 15);
  }

  _propCone(ctx) {
    ctx.fillStyle = '#ff7a1a';
    ctx.strokeStyle = C.COL.OUTLINE; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(-5, -1); ctx.lineTo(-1.5, -14); ctx.lineTo(1.5, -14); ctx.lineTo(5, -1); ctx.closePath();
    ctx.fill(); ctx.stroke();
    ctx.fillStyle = '#ffffff'; ctx.fillRect(-3.2, -8, 6.4, 2.2);
    ctx.fillStyle = '#3b3b3b'; ctx.fillRect(-7, -1.5, 14, 1.5);
  }

  _propCrate(ctx) {
    ctx.fillStyle = '#9b6b3d';
    ctx.strokeStyle = C.COL.OUTLINE; ctx.lineWidth = 1;
    ctx.fillRect(-8, -15, 16, 15); ctx.strokeRect(-8, -15, 16, 15);
    ctx.strokeStyle = '#6b4523';
    ctx.beginPath(); ctx.moveTo(-8, -15); ctx.lineTo(8, 0); ctx.moveTo(8, -15); ctx.lineTo(-8, 0); ctx.stroke();
  }

  _propValveBox(ctx) {
    ctx.fillStyle = '#4b5458';
    ctx.strokeStyle = C.COL.OUTLINE; ctx.lineWidth = 1;
    ctx.fillRect(-6, -6, 12, 6); ctx.strokeRect(-6, -6, 12, 6);
    ctx.fillStyle = '#1a73b8'; ctx.fillRect(-1, -12, 2, 6);
    ctx.strokeStyle = '#d63b2f'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(0, -13, 4, 0, Math.PI * 2); ctx.stroke();
  }
}

// ─────────────────────────────────────────────────────────────────────────────
// LEVEL GENERATOR
// Seeded, so each world/level is always the same layout. Builds a height
// profile left→right, then carves features (pits, pools, sludge) with safe
// landing ground around them, then places platforms, props and entities.
// ─────────────────────────────────────────────────────────────────────────────
class LevelGenerator {
  constructor(seed = 0) {
    this.seed = seed;
  }

  _rng() {
    this.seed = (Math.imul(this.seed, 1664525) + 1013904223) | 0;
    return (this.seed >>> 0) / 4294967296;
  }

  _ri(min, max) { return Math.floor(this._rng() * (max - min + 1)) + min; }
  _rp(arr)      { return arr[Math.floor(this._rng() * arr.length)]; }

  generate(worldIdx, levelIdx) {
    this.seed = worldIdx * 997 + levelIdx * 31337 + 42;
    const T = C.T;
    const diff = worldIdx + levelIdx * 0.6;            // 0 .. ~4.8
    const rows = C.LEVEL_H_TILES;
    const cols = 84 + levelIdx * 12 + worldIdx * 6;
    const map  = new Tilemap(cols, rows);
    const groundRow = rows - 3;
    const indoor = worldIdx === 1 || worldIdx === 2;
    const START = 9, END = cols - 10;

    // ── 1. Height profile and features ──────────────────────────────────────
    const h = new Array(cols).fill(groundRow);
    const feats = [];
    let cur = groundRow;
    for (let c = START; c < END;) {
      if (this._rng() < 0.4) cur = M.clamp(cur + this._rp([-1, -1, 1, 1, -2, 2]), rows - 7, groundRow);
      const len = this._ri(4, 8);
      for (let i = 0; i < len && c < END; i++, c++) h[c] = cur;
      if (c >= END - 6) break;

      const f = this._rng();
      let feat = null;
      if (f < 0.20 + diff * 0.025)      feat = { type: 'pit',    w: this._ri(2, diff > 1.5 ? 4 : 3) };
      else if (f < 0.38)                feat = { type: 'pool',   w: this._ri(4, 7) };
      else if (f < 0.47 + diff * 0.02)  feat = { type: 'sludge', w: this._ri(2, 4) };
      if (feat) {
        feat.c = c;
        feats.push(feat);
        for (let i = 0; i < feat.w; i++) h[c + i] = groundRow;
        c += feat.w;
        cur = groundRow;
        // Keep take-off and landing ground low enough to always clear
        for (let i = 1; i <= 2; i++) {
          const lim = feat.type === 'sludge' ? groundRow : groundRow - 2;
          if (feat.c - i >= 0) h[feat.c - i] = Math.max(h[feat.c - i], lim);
          if (c + i - 1 < cols) h[c + i - 1] = Math.max(h[c + i - 1], lim);
        }
      }
    }

    // ── 2. Terrain ──────────────────────────────────────────────────────────
    for (let c = 0; c < cols; c++) {
      for (let r = h[c]; r < rows; r++) map.set(c, r, T.SOLID);
      if (indoor) map.set(c, 0, T.SOLID);
    }
    // Low ceiling bumps in indoor worlds
    if (indoor) {
      for (let c = 0; c < cols; c++) {
        if (this._rng() < 0.12) {
          const w = this._ri(2, 5);
          for (let i = 0; i < w && c + i < cols; i++) map.set(c + i, 1, T.SOLID);
          c += w + 2;
        }
      }
    }

    // ── 3. Carve features ───────────────────────────────────────────────────
    for (const ft of feats) {
      for (let i = 0; i < ft.w; i++) {
        const c = ft.c + i;
        if (ft.type === 'pit') {
          const watery = worldIdx === 0 || worldIdx === 2 || this._rng() < 0.35;
          for (let r = indoor ? 1 : 0; r < rows; r++) map.set(c, r, T.EMPTY);
          if (watery) {
            map.set(c, rows - 1, T.SOLID);
            map.set(c, rows - 2, T.WATER);
            map.set(c, rows - 3, T.WATER);
          }
        } else if (ft.type === 'pool') {
          map.set(c, groundRow, T.WATER);
          map.set(c, groundRow + 1, T.WATER);
        } else {
          map.set(c, groundRow, T.EMPTY);
          map.set(c, groundRow + 1, T.EMPTY);
        }
      }
      if (ft.type === 'sludge') {
        map.hazards.push(new ContamWater(ft.c * TS, groundRow * TS, ft.w * TS, 2 * TS));
      }
    }

    // ── 4. Buried water mains and lead service lines (cross-section detail) ──
    for (let c = 0; c < cols;) {
      const len = this._ri(5, 14);
      if (this._rng() < 0.55) {
        for (let i = 0; i < len && c + i < cols; i++) {
          if (map.get(c + i, rows - 2) === T.SOLID) map.set(c + i, rows - 2, T.PIPE_H);
        }
      }
      c += len + this._ri(2, 6);
    }
    for (let c = START; c < END; c++) {
      if (this._rng() < 0.05 + worldIdx * 0.01) {
        const len = this._ri(2, 3);
        for (let i = 0; i < len; i++) {
          const cc = c + i, r = h[cc] + 1;
          if (r < rows - 2 && map.get(cc, r) === T.SOLID && map.get(cc, r - 1) === T.SOLID) map.set(cc, r, T.LEAD_TILE);
        }
        c += len + 3;
      }
    }

    const isFlat = (c) => c > 1 && c < cols - 2 && map.get(c, h[c]) === T.SOLID &&
      map.get(c, h[c] - 1) === T.EMPTY && h[c - 1] === h[c] && h[c + 1] === h[c] &&
      map.get(c - 1, h[c]) === T.SOLID && map.get(c + 1, h[c]) === T.SOLID;
    const used = new Set();
    const nearFeature = (c, d) => feats.some(ft => c >= ft.c - d && c < ft.c + ft.w + d);

    // ── 5. One-way platforms (over features and as optional high routes) ───
    const platforms = [];
    const addPlatform = (c, r, w) => {
      for (let i = 0; i < w; i++) {
        if (map.get(c + i, r) !== T.EMPTY || map.get(c + i, r - 1) !== T.EMPTY) return null;
      }
      for (let i = 0; i < w; i++) map.set(c + i, r, T.PLATFORM);
      const p = { c, r, w };
      platforms.push(p);
      return p;
    };
    for (const ft of feats) {
      if (ft.w >= 4 && ft.type !== 'pool') addPlatform(ft.c + 1, groundRow - 3, ft.w - 2);
    }
    const nPlat = 5 + levelIdx + Math.floor(cols / 30);
    for (let i = 0; i < nPlat * 3 && platforms.length < nPlat + feats.length; i++) {
      const c = this._ri(START + 2, END - 6);
      const w = this._ri(3, 5);
      const base = Math.min(h[c], h[c + w - 1]);
      const r = base - this._ri(3, 4);
      if (r < (indoor ? 3 : 2)) continue;
      if (platforms.some(p => Math.abs(p.c - c) < 7 && Math.abs(p.r - r) < 3)) continue;
      addPlatform(c, r, w);
    }

    // ── 6. Pipe pillars with valve tops ─────────────────────────────────────
    for (let i = 0, made = 0; i < 30 && made < 2 + Math.floor(levelIdx / 2); i++) {
      const c = this._ri(START + 3, END - 3);
      if (!isFlat(c) || nearFeature(c, 3) || used.has(c)) continue;
      const tall = this._ri(1, 2 + Math.floor(diff / 2));
      for (let r = h[c] - tall; r < h[c]; r++) map.set(c, r, T.PIPE_V);
      used.add(c); used.add(c - 1); used.add(c + 1);
      made++;
    }

    // Overhead pipe runs in indoor worlds (high, out of the jump path)
    if (indoor) {
      for (let i = 0; i < 3; i++) {
        const r = this._ri(2, 3);
        const s0 = this._ri(4, cols - 20), len = this._ri(6, 14);
        for (let c = s0; c < s0 + len; c++) if (map.get(c, r) === T.EMPTY) map.set(c, r, T.PIPE_H);
      }
    }

    // ── 7. Spikes (broken pipe shards) ──────────────────────────────────────
    const nSpike = Math.floor(2 + diff * 1.5);
    for (let i = 0, made = 0; i < 60 && made < nSpike; i++) {
      const c = this._ri(START + 4, END - 4);
      if (!isFlat(c) || nearFeature(c, 2) || used.has(c)) continue;
      if (platforms.some(p => c >= p.c - 1 && c <= p.c + p.w && p.r > h[c] - 3)) continue;
      map.set(c, h[c] - 1, T.SPIKE);
      used.add(c - 1); used.add(c); used.add(c + 1);
      made++;
    }

    // ── 8. Spawn and exit ───────────────────────────────────────────────────
    map.spawnX = 3 * TS;
    map.spawnY = (groundRow - 1) * TS;
    const exitC = cols - 5;
    map.exitX = exitC * TS;
    map.exitY = (groundRow - 1) * TS;

    // ── 9. Water-drop pickups ───────────────────────────────────────────────
    const coinAt = (x, y) => {
      const c = Math.floor(x / TS), r = Math.floor(y / TS);
      if (map.get(c, r) === T.EMPTY || map.get(c, r) === T.WATER) map.coins.push(new Coin(x - 8, y - 9));
    };
    for (const ft of feats) {  // arc over each gap
      const n = ft.w + 2;
      const x0 = (ft.c - 0.5) * TS, x1 = (ft.c + ft.w + 0.5) * TS;
      for (let i = 0; i < n; i++) {
        const t = (i + 0.5) / n;
        coinAt(M.lerp(x0, x1, t), groundRow * TS - 30 - Math.sin(t * Math.PI) * 60);
      }
    }
    for (const p of platforms) {
      for (let i = 0; i < p.w; i++) if (this._rng() < 0.7) coinAt((p.c + i + 0.5) * TS, p.r * TS - 16);
    }
    for (let c = START; c < END; c += this._ri(6, 11)) {
      if (!isFlat(c) || used.has(c)) continue;
      for (let i = 0; i < 3; i++) if (isFlat(c + i) && !used.has(c + i)) coinAt((c + i + 0.5) * TS, h[c] * TS - 18);
    }
    for (const ft of feats) {
      if (ft.type === 'pool') for (let i = 1; i < ft.w - 1; i += 2) coinAt((ft.c + i + 0.5) * TS, (groundRow + 1) * TS + 4);
    }

    // ── 10. Power-ups on platforms ──────────────────────────────────────────
    const hasWater = feats.some(f => f.type === 'pool' || f.type === 'pit');
    const puTypes = ['heart', 'doubleJump', hasWater ? 'flippers' : 'heart'];
    const shuffled = platforms.slice().sort(() => this._rng() - 0.5);
    for (let i = 0; i < Math.min(2, shuffled.length); i++) {
      const p = shuffled[i];
      map.powerups.push(new Powerup((p.c + Math.floor(p.w / 2)) * TS + 4, (p.r - 1) * TS - 4, this._rp(puTypes)));
    }

    // Guaranteed water cannon, early-ish in the level
    {
      const p = shuffled.slice(2).find(q => q.c > START + 6) || null;
      if (p) map.powerups.push(new Powerup((p.c + Math.floor(p.w / 2)) * TS + 4, (p.r - 1) * TS - 4, 'blaster'));
      else {
        for (let c = START + 8; c < END; c++) {
          if (isFlat(c) && !used.has(c)) { map.powerups.push(new Powerup(c * TS + 4, (h[c] - 1) * TS - 6, 'blaster')); used.add(c); break; }
        }
      }
    }

    // ── 11. Enemies ─────────────────────────────────────────────────────────
    const nEnemy = Math.floor(4 + levelIdx * 1.5 + worldIdx * 1.5);
    const rustOdds = [0.15, 0.4, 0.45, 0.55][worldIdx] ?? 0.4;
    const taken = [];
    for (let i = 0; i < 120 && taken.length < nEnemy; i++) {
      const c = this._ri(START + 6, END - 4);
      if (!isFlat(c) || used.has(c) || nearFeature(c, 2)) continue;
      if (taken.some(t => Math.abs(t - c) < 5)) continue;
      taken.push(c);
      const y = h[c] * TS;
      if (this._rng() < rustOdds) map.entities.push(new RustBlob(c * TS + 2, y - 22));
      else map.entities.push(new LeadDrop(c * TS + 4, y - 20));
    }
    // A few patrollers on the larger platforms
    for (const p of platforms) {
      if (p.w >= 5 && this._rng() < 0.25 + diff * 0.05) {
        map.entities.push(new LeadDrop((p.c + 1) * TS, p.r * TS - 20));
      }
    }

    return map;
  }
}

// ─────────────────────────────────────────────────────────────────────────────
// BOSS LEVEL
// One boss per world. Telegraphed attacks: walk, lob globs, leap + shockwave,
// and a charge that stuns the boss when it hits a wall. Stomp its head; it is
// briefly invulnerable after each hit. Three phases speed it up.
// ─────────────────────────────────────────────────────────────────────────────
const BOSS_STYLES = [
  { name: 'Corroded Chief', body: ['#dfe5ea', '#9aa5b1', '#4b5561'], eye: '#ffd34d', shot: ['#c3cbd3', '#7a848e'], acc: 'crown' },
  { name: 'Rust Overlord',  body: ['#f0a05a', '#b4521f', '#5c240c'], eye: '#ffe066', shot: ['#e08a3c', '#7a3315'], acc: 'horns' },
  { name: 'Contaminator',   body: ['#d0a8f0', '#8e4bb8', '#3a1650'], eye: '#b6ff5c', shot: ['#a6e05a', '#5f8f2a'], acc: 'drips' },
  { name: 'Lead Baron',     body: ['#c9d2da', '#6f7d8a', '#2c3a47'], eye: '#ff6b5a', shot: ['#9aa6b2', '#3d4a56'], acc: 'tophat' },
];

class BossEnemy extends Entity {
  constructor(x, y, worldIdx) {
    super(x, y, 76, 60);
    this.worldIdx = worldIdx;
    this.style = BOSS_STYLES[worldIdx] || BOSS_STYLES[0];
    this.hp = this.maxHp = 6 + worldIdx * 2;
    this.phase = 1;
    this.state = 'intro';
    this.stateT = 0;
    this.next = 'shoot';
    this.dir = -1;
    this.onGround = false;
    this.projectiles = [];
    this.invuln = 0;
    this.squash = 1;
    this.look = { x: -1, y: 0 };
    this.game = null; // set by Game for effects
  }

  get name()  { return this.style.name; }
  get color() { return this.style.body[1]; }
  get harmful() { return this.state !== 'stunned' && this.invuln <= 0 && this.state !== 'intro'; }

  _fx() { return this.game || { particles: { emit() {}, floatText() {} }, audio: {}, camera: { addShake() {} } }; }

  _set(state) { this.state = state; this.stateT = 0; this.entered = false; }

  // True exactly once, on the first update of the current state
  _enter() { if (this.entered) return false; this.entered = true; return true; }

  update(dt, map, px, py) {
    this.t += dt;
    this.stateT += dt;
    if (this.flash > 0) this.flash -= dt;
    if (this.invuln > 0) this.invuln -= dt;
    this.phase = this.hp <= this.maxHp * 0.34 ? 3 : this.hp <= this.maxHp * 0.67 ? 2 : 1;
    const fx = this._fx();
    const speedK = 1 + (this.phase - 1) * 0.3;
    const toP = Math.sign(px - this.cx) || this.dir;
    const lx = M.clamp((px - this.cx) / 120, -1, 1), ly = M.clamp((py - this.cy) / 120, -1, 1);
    this.look.x += (lx - this.look.x) * 0.15;
    this.look.y += (ly - this.look.y) * 0.15;

    switch (this.state) {
      case 'intro':
        this.vx = 0;
        if (this.stateT > 1.3) this._set('walk');
        break;
      case 'walk':
        this.dir = toP;
        this.vx = M.approach(this.vx, this.dir * 1.3 * speedK, 0.15);
        if (this.stateT > 1.8 / speedK && this.onGround) {
          const opts = ['shoot', 'charge'];
          if (this.phase >= 2) opts.push('leap', 'leap');
          if (this.phase >= 3) opts.push('shoot');
          this.next = opts[Math.floor(Math.random() * opts.length)];
          this._set('windup');
        }
        break;
      case 'windup':
        this.vx = M.approach(this.vx, 0, 0.4);
        this.dir = toP;
        if (this.stateT > 0.6 / Math.sqrt(speedK)) this._set(this.next);
        break;
      case 'shoot': {
        if (this._enter()) {
          // Lob globs on ballistic arcs that land around the player
          const n = this.phase + 1, g = 0.22;
          const sx = this.cx + this.dir * 30, sy = this.y + 16;
          for (let i = 0; i < n; i++) {
            const T = 50 + i * 9;
            const dx = (px - sx) + (i - (n - 1) / 2) * 56, dy = (py - sy);
            this.projectiles.push({
              kind: 'glob', x: sx, y: sy, vx: dx / T, vy: (dy - 0.5 * g * T * T) / T,
              g, r: 7, dead: false, t: 0,
            });
          }
          this.squash = 0.8;
          fx.audio.sfxEnemyHit && fx.audio.sfxEnemyHit();
        }
        if (this.stateT > 0.7) this._set('recover');
        break;
      }
      case 'leap':
        if (this._enter()) {
          this.vy = -12.5;
          this.vx = M.clamp((px - this.cx) / 55, -5.5, 5.5);
          this.onGround = false;
          this.squash = 1.3;
        }
        if (this.onGround && this.stateT > 0.2) {
          // Shockwave along the floor in both directions
          for (const d of [-1, 1]) {
            this.projectiles.push({ kind: 'wave', x: this.cx + d * 30, y: this.bottom - 10, vx: d * (3.6 + this.phase * 0.5), vy: 0, r: 10, dead: false, t: 0 });
          }
          fx.camera.addShake(9);
          fx.particles.emit(this.cx, this.bottom, 18, { kind: 'dust', vxMin: -4, vxMax: 4, vyMin: -2.5, vyMax: -0.3,
            gravity: 0.02, drag: 0.92, sizeMin: 6, sizeMax: 12, lifeMin: 0.4, lifeMax: 0.8, color: ['rgba(220,220,220,0.6)', 'rgba(180,170,160,0.5)'] });
          this.squash = 0.65;
          this.vx = 0;
          this._set('recover');
        }
        break;
      case 'charge':
        this.vx = this.dir * (5.2 + this.phase * 0.7);
        if (Math.random() < 0.5) fx.particles.emit(this.cx - this.dir * 30, this.bottom, 1, { kind: 'dust', vxMin: -0.5, vxMax: 0.5, vyMin: -1, vyMax: -0.2, gravity: 0, sizeMin: 5, sizeMax: 9, lifeMin: 0.3, lifeMax: 0.5, color: 'rgba(210,210,210,0.5)' });
        if (this.stateT > 2.5) this._set('recover');
        break;
      case 'stunned':
        this.vx = M.approach(this.vx, 0, 0.3);
        if (this.stateT > 1.6 - this.phase * 0.2) this._set('walk');
        break;
      case 'hurt':
        this.vx = M.approach(this.vx, 0, 0.2);
        if (this.stateT > 0.5) this._set(Math.random() < 0.5 ? 'walk' : 'windup');
        if (this.state === 'windup') this.next = this.phase >= 2 ? 'leap' : 'shoot';
        break;
      case 'recover':
        this.vx = M.approach(this.vx, 0, 0.3);
        if (this.stateT > 0.75 / speedK) this._set('walk');
        break;
    }

    // Physics (boss ignores one-way platforms)
    this.vy = Math.min(this.vy + 0.6, 14);
    const hitWall = Phys.moveX(this, map, this.vx);
    if (hitWall && this.state === 'charge') {
      this._set('stunned');
      this.vx = -this.dir * 2.5;
      this.vy = -5;
      fx.camera.addShake(10);
      fx.audio.sfxBossHit && fx.audio.sfxBossHit();
      fx.particles.emit(this.dir > 0 ? this.right : this.x, this.cy, 14, { kind: 'square', speed: 5, color: this.style.shot, gravity: 0.3, sizeMin: 3, sizeMax: 6, lifeMin: 0.4, lifeMax: 0.8, spin: 0.3 });
    }
    const was = this.onGround;
    const vy = Phys.moveY(this, map, this.vy, true);
    this.onGround = vy === 1;
    if (vy !== 0) this.vy = 0;
    if (!was && this.onGround && this.state !== 'leap') this.squash = 0.8;
    this.squash += (1 - this.squash) * 0.12;

    // Projectiles
    for (const p of this.projectiles) {
      p.t += dt;
      if (p.kind === 'glob') {
        p.vy += p.g;
        p.x += p.vx; p.y += p.vy;
        if (Phys.solid(map.get(Math.floor(p.x / TS), Math.floor((p.y + p.r) / TS)))) {
          p.dead = true;
          fx.particles.emit(p.x, p.y, 8, { kind: 'droplet', speed: 3.5, angle: -Math.PI / 2, spread: 2.4, color: this.style.shot, gravity: 0.25, sizeMin: 2, sizeMax: 4, lifeMin: 0.3, lifeMax: 0.5 });
        }
      } else {
        p.x += p.vx;
        if (Phys.solid(map.get(Math.floor((p.x + Math.sign(p.vx) * p.r) / TS), Math.floor(p.y / TS)))) p.dead = true;
      }
      if (p.y > map.rows * TS + 50 || p.t > 6) p.dead = true;
    }
    this.projectiles = this.projectiles.filter(p => !p.dead);
  }

  // Returns true when the stomp counted (false while invulnerable)
  hit(particles, audio) {
    if (this.invuln > 0 || this.dead) return false;
    const fx = this._fx();
    particles = particles || fx.particles;
    audio = audio || fx.audio;
    this.hp--;
    this.invuln = 1.0;
    this.flash = 0.2;
    this.squash = 0.6;
    this._set('hurt');
    audio.sfxBossHit && audio.sfxBossHit();
    particles.emit(this.cx, this.y + 8, 14, { kind: 'square', speed: 5, color: this.style.shot, gravity: 0.3, sizeMin: 3, sizeMax: 6, lifeMin: 0.4, lifeMax: 0.8, spin: 0.3 });
    if (this.hp <= 0) {
      this.dead = true;
      this.projectiles = [];
      audio.sfxBossDie && audio.sfxBossDie();
      particles.emit(this.cx, this.cy, 40, { kind: 'square', speed: 8, color: this.style.body, gravity: 0.25, sizeMin: 3, sizeMax: 9, lifeMin: 0.6, lifeMax: 1.3, spin: 0.3 });
      particles.emit(this.cx, this.cy, 30, { kind: 'spark', speed: 9, color: ['#ffffff', '#fff3b0', this.style.eye], gravity: 0.05, sizeMin: 2, sizeMax: 4, lifeMin: 0.4, lifeMax: 0.9, additive: true });
      for (let i = 0; i < 3; i++) {
        particles.emit(this.cx, this.cy, 1, { kind: 'ring', sizeMin: 30 + i * 30, sizeMax: 30 + i * 30, lifeMin: 0.4 + i * 0.15, lifeMax: 0.4 + i * 0.15, vxMin: 0, vxMax: 0, vyMin: 0, vyMax: 0, gravity: 0, color: '#ffffff' });
      }
    }
    return true;
  }

  draw(ctx, camX, camY) {
    const s = this.style, b = s.body;
    const cx = this.cx - camX, by = this.bottom - camY;
    let shake = 0;
    if (this.state === 'windup') shake = Math.sin(this.t * 60) * 2;
    if (this.invuln > 0 && Math.floor(this.invuln * 16) % 2 === 0) ctx.globalAlpha = 0.55;

    // Telegraph glow
    if (this.state === 'windup') {
      ctx.save();
      ctx.globalCompositeOperation = 'lighter';
      const k = M.clamp(this.stateT / 0.6, 0, 1);
      const g = ctx.createRadialGradient(cx, by - 30, 10, cx, by - 30, 70);
      g.addColorStop(0, `rgba(255,80,60,${0.35 * k})`); g.addColorStop(1, 'rgba(255,80,60,0)');
      ctx.fillStyle = g; ctx.fillRect(cx - 70, by - 100, 140, 140);
      ctx.restore();
    }
    if (this.onGround) drawShadow(ctx, cx, by, 40);

    const sy = this.squash, sx = 2 - sy;
    ctx.save();
    ctx.translate(cx + shake, by);
    ctx.scale(sx * (this.dir < 0 ? 1 : 1), sy);
    const W = 40, H = 62;

    // Body silhouette (lumpy for rust, drippy for sludge)
    ctx.beginPath();
    ctx.moveTo(-W, 0);
    ctx.bezierCurveTo(-W - 4, -H * 0.6, -W * 0.6, -H, 0, -H);
    ctx.bezierCurveTo(W * 0.6, -H, W + 4, -H * 0.6, W, 0);
    for (let i = 5; i >= -5; i--) ctx.quadraticCurveTo(i * 8 + 4, 3 + (i % 2 ? 2 : 0), i * 8 - 4, 0);
    ctx.closePath();
    const g = ctx.createRadialGradient(-12, -H * 0.7, 4, 0, -H * 0.4, H);
    g.addColorStop(0, b[0]); g.addColorStop(0.45, b[1]); g.addColorStop(1, b[2]);
    ctx.fillStyle = this.flash > 0 ? '#ffffff' : g;
    ctx.fill();
    ctx.lineWidth = 2;
    ctx.strokeStyle = C.COL.OUTLINE;
    ctx.stroke();

    // Damage cracks appear as HP drops
    const dmg = 1 - this.hp / this.maxHp;
    ctx.strokeStyle = 'rgba(20,20,25,0.7)';
    ctx.lineWidth = 1.5;
    if (dmg > 0.25) { ctx.beginPath(); ctx.moveTo(-26, -40); ctx.lineTo(-18, -32); ctx.lineTo(-22, -24); ctx.lineTo(-14, -16); ctx.stroke(); }
    if (dmg > 0.5)  { ctx.beginPath(); ctx.moveTo(24, -48); ctx.lineTo(18, -38); ctx.lineTo(26, -30); ctx.stroke(); }
    if (dmg > 0.75) { ctx.beginPath(); ctx.moveTo(-4, -60); ctx.lineTo(2, -50); ctx.lineTo(-3, -42); ctx.stroke(); }

    // Gloss
    ctx.fillStyle = 'rgba(255,255,255,0.55)';
    ctx.beginPath(); ctx.ellipse(-16, -H * 0.72, 9, 5, -0.5, 0, Math.PI * 2); ctx.fill();

    // Emblem
    ctx.fillStyle = 'rgba(0,0,0,0.25)';
    ctx.font = "bold 14px 'Courier New', monospace";
    ctx.textAlign = 'center';
    ctx.fillText(this.worldIdx === 2 ? 'Cl⁻' : this.worldIdx === 1 ? 'Fe' : 'Pb', 0, -8);

    // Eyes track the player
    const stunned = this.state === 'stunned';
    for (const ex of [-14, 14]) {
      ctx.fillStyle = '#ffffff';
      ctx.beginPath(); ctx.ellipse(ex, -36, 9, 10, 0, 0, Math.PI * 2); ctx.fill();
      ctx.strokeStyle = C.COL.OUTLINE; ctx.lineWidth = 1.5; ctx.stroke();
      if (stunned) {
        ctx.strokeStyle = '#333'; ctx.lineWidth = 2;
        ctx.beginPath(); ctx.moveTo(ex - 4, -40); ctx.lineTo(ex + 4, -32); ctx.moveTo(ex + 4, -40); ctx.lineTo(ex - 4, -32); ctx.stroke();
      } else {
        ctx.fillStyle = this.phase === 3 ? '#ff3b2f' : s.eye;
        ctx.beginPath(); ctx.arc(ex + this.look.x * 3.5, -35 + this.look.y * 3, 5, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = '#111';
        ctx.beginPath(); ctx.arc(ex + this.look.x * 4.5, -35 + this.look.y * 3.5, 2.4, 0, Math.PI * 2); ctx.fill();
      }
    }
    // Brows get angrier each phase
    const ang = 0.15 + this.phase * 0.12;
    ctx.strokeStyle = C.COL.OUTLINE; ctx.lineWidth = 3.5; ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(-24, -50 - ang * 8); ctx.lineTo(-6, -46 + ang * 6);
    ctx.moveTo(24, -50 - ang * 8);  ctx.lineTo(6, -46 + ang * 6);
    ctx.stroke();

    // Mouth: open + glowing while winding up / shooting
    const open = this.state === 'windup' || this.state === 'shoot' || this.state === 'intro';
    ctx.fillStyle = '#1b0f12';
    ctx.beginPath();
    if (open) ctx.ellipse(0, -18, 14, 7 + Math.sin(this.t * 20) * 1.5, 0, 0, Math.PI * 2);
    else { ctx.moveTo(-14, -20); ctx.quadraticCurveTo(0, -12, 14, -20); ctx.lineTo(14, -17); ctx.quadraticCurveTo(0, -9, -14, -17); }
    ctx.fill();
    if (open) {
      ctx.fillStyle = '#fff';
      for (let i = -2; i <= 2; i++) ctx.fillRect(i * 5 - 1.5, -25, 3, 4);
      ctx.fillStyle = s.shot[0];
      ctx.beginPath(); ctx.arc(0, -16, 4, 0, Math.PI * 2); ctx.fill();
    }

    this._accessory(ctx, H);
    ctx.restore();
    ctx.globalAlpha = 1;

    // Dizzy stars
    if (stunned) {
      for (let i = 0; i < 3; i++) {
        const a = this.t * 4 + i * Math.PI * 2 / 3;
        this._star(ctx, cx + Math.cos(a) * 30, by - H * sy - 14 + Math.sin(a) * 6, 5);
      }
    }

    // Projectiles
    for (const p of this.projectiles) {
      const x = p.x - camX, y = p.y - camY;
      if (p.kind === 'glob') {
        ctx.fillStyle = s.shot[1];
        ctx.beginPath(); ctx.arc(x, y, p.r, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = s.shot[0];
        ctx.beginPath(); ctx.arc(x - 1.5, y - 1.5, p.r * 0.7, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = 'rgba(255,255,255,0.8)';
        ctx.beginPath(); ctx.arc(x - 3, y - 3, 1.8, 0, Math.PI * 2); ctx.fill();
        ctx.strokeStyle = C.COL.OUTLINE; ctx.lineWidth = 1;
        ctx.beginPath(); ctx.arc(x, y, p.r, 0, Math.PI * 2); ctx.stroke();
      } else {
        const hgt = 16 + Math.sin(p.t * 20) * 3;
        const g2 = ctx.createLinearGradient(0, y + 10 - hgt, 0, y + 10);
        g2.addColorStop(0, 'rgba(255,255,255,0)'); g2.addColorStop(1, s.shot[0]);
        ctx.fillStyle = g2;
        ctx.beginPath();
        ctx.moveTo(x - 14, y + 10); ctx.quadraticCurveTo(x, y + 10 - hgt * 2, x + 14, y + 10);
        ctx.fill();
        ctx.fillStyle = s.shot[1];
        ctx.fillRect(x - 12, y + 7, 24, 3);
      }
    }
  }

  _accessory(ctx, H) {
    const OL = C.COL.OUTLINE;
    ctx.lineWidth = 1.5; ctx.strokeStyle = OL;
    switch (this.style.acc) {
      case 'crown': {
        ctx.fillStyle = '#e8b923';
        ctx.beginPath();
        ctx.moveTo(-18, -H + 4); ctx.lineTo(-20, -H - 14); ctx.lineTo(-10, -H - 5); ctx.lineTo(0, -H - 18);
        ctx.lineTo(10, -H - 5); ctx.lineTo(20, -H - 14); ctx.lineTo(18, -H + 4); ctx.closePath();
        ctx.fill(); ctx.stroke();
        ctx.fillStyle = '#d63b2f';
        ctx.beginPath(); ctx.arc(0, -H - 4, 3, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = '#fff3b0'; ctx.fillRect(-14, -H - 2, 4, 2);
        break;
      }
      case 'horns':
        ctx.fillStyle = '#7a3315';
        for (const d of [-1, 1]) {
          ctx.beginPath();
          ctx.moveTo(d * 18, -H + 6); ctx.quadraticCurveTo(d * 38, -H - 4, d * 34, -H - 22); ctx.quadraticCurveTo(d * 28, -H - 6, d * 8, -H + 2);
          ctx.closePath(); ctx.fill(); ctx.stroke();
        }
        ctx.fillStyle = '#5c240c';
        for (let i = -3; i <= 3; i++) {
          ctx.beginPath(); ctx.moveTo(i * 9 - 4, -H + 4 + Math.abs(i) * 3); ctx.lineTo(i * 9, -H - 6 + Math.abs(i) * 3); ctx.lineTo(i * 9 + 4, -H + 4 + Math.abs(i) * 3); ctx.fill();
        }
        break;
      case 'drips':
        ctx.fillStyle = this.style.shot[0];
        for (let i = 0; i < 5; i++) {
          const x = -30 + i * 15, len = 6 + ((this.t * 8 + i * 3) % 10);
          ctx.beginPath(); ctx.ellipse(x, -4 + len * 0.3, 3, len * 0.5, 0, 0, Math.PI * 2); ctx.fill();
        }
        for (let i = 0; i < 3; i++) {
          const ph = (this.t * 0.8 + i * 0.33) % 1;
          ctx.strokeStyle = `rgba(182,255,92,${1 - ph})`;
          ctx.lineWidth = 1.5;
          ctx.beginPath(); ctx.arc(-20 + i * 20, -H - ph * 26, 3 + ph * 3, 0, Math.PI * 2); ctx.stroke();
        }
        break;
      case 'tophat':
        ctx.fillStyle = '#1d1f24';
        ctx.beginPath(); ctx.roundRect(-16, -H - 26, 32, 28, 3); ctx.fill(); ctx.stroke();
        ctx.beginPath(); ctx.roundRect(-26, -H, 52, 6, 3); ctx.fill(); ctx.stroke();
        ctx.fillStyle = '#b02a22'; ctx.fillRect(-16, -H - 8, 32, 5);
        // monocle + mustache
        ctx.strokeStyle = '#e8b923'; ctx.lineWidth = 1.5;
        ctx.beginPath(); ctx.arc(14, -36, 11, 0, Math.PI * 2); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(24, -32); ctx.quadraticCurveTo(30, -18, 26, -6); ctx.stroke();
        ctx.fillStyle = '#2b2b2b';
        ctx.beginPath();
        ctx.moveTo(0, -24); ctx.quadraticCurveTo(-10, -30, -22, -22); ctx.quadraticCurveTo(-12, -24, 0, -20);
        ctx.quadraticCurveTo(12, -24, 22, -22); ctx.quadraticCurveTo(10, -30, 0, -24);
        ctx.fill();
        break;
    }
  }

  _star(ctx, x, y, r) {
    ctx.fillStyle = '#ffe066';
    ctx.strokeStyle = C.COL.OUTLINE; ctx.lineWidth = 1;
    ctx.beginPath();
    for (let i = 0; i < 10; i++) {
      const a = -Math.PI / 2 + i * Math.PI / 5, rr = i % 2 ? r * 0.45 : r;
      i ? ctx.lineTo(x + Math.cos(a) * rr, y + Math.sin(a) * rr) : ctx.moveTo(x + Math.cos(a) * rr, y + Math.sin(a) * rr);
    }
    ctx.closePath(); ctx.fill(); ctx.stroke();
  }
}

class BossLevel {
  constructor(worldIdx) {
    this.worldIdx = worldIdx;
    const cols = 34, rows = C.LEVEL_H_TILES, T = C.T;
    const map = new Tilemap(cols, rows);
    const gr = rows - 3;
    const indoor = worldIdx === 1 || worldIdx === 2;
    for (let c = 0; c < cols; c++) {
      for (let r = gr; r < rows; r++) map.set(c, r, T.SOLID);
      if (indoor) map.set(c, 0, T.SOLID);
    }
    for (let r = 0; r < rows; r++) {
      for (const c of [0, 1, cols - 2, cols - 1]) map.set(c, r, T.SOLID);
    }
    for (let c = 2; c < cols - 2; c++) map.set(c, rows - 2, T.PIPE_H);
    // Platforms to escape shockwaves and line up stomps
    for (const [c, r, w] of [[5, gr - 4, 4], [15, gr - 6, 4], [25, gr - 4, 4]]) {
      for (let i = 0; i < w; i++) map.set(c + i, r, T.PLATFORM);
    }
    map.spawnX = 4 * TS;
    map.spawnY = (gr - 1) * TS;
    map.exitX = (cols - 5) * TS;
    map.exitY = (gr - 1) * TS;
    map.exitHidden = true;
    map.powerups.push(new Powerup(16.5 * TS - 12, (gr - 7) * TS - 4, 'blaster'));
    this.map = map;
    this.boss = new BossEnemy((cols - 12) * TS, gr * TS - 60, worldIdx);
  }
}

// ─────────────────────────────────────────────────────────────────────────────
// OVERWORLD MAP
// One map of the SJWD service area. Every level is a node on a single path;
// ← → walk between unlocked nodes, ENTER plays the selected level.
// ─────────────────────────────────────────────────────────────────────────────
const MAP_NODES = [
  // World 1 — Surface Mains (bottom-left)
  [[86, 450], [176, 410], [262, 452], [346, 392]],
  // World 2 — Underground Pipes (top-left)
  [[318, 268], [222, 236], [128, 262], [96, 158]],
  // World 3 — Treatment Plant (top-right)
  [[470, 128], [562, 168], [652, 128], [724, 214]],
  // World 4 — Distribution Net (bottom-right)
  [[716, 318], [622, 352], [528, 322], [478, 420], [624, 462]],
];
const MAP_REGIONS = [
  { x: 40,  y: 330, w: 350, h: 175, label: 'SURFACE MAINS' },
  { x: 40,  y: 110, w: 350, h: 200, label: 'UNDERGROUND PIPES' },
  { x: 420, y: 80,  w: 350, h: 190, label: 'TREATMENT PLANT' },
  { x: 420, y: 288, w: 350, h: 217, label: 'DISTRIBUTION NET' },
];

class OverworldMap {
  constructor(save, input, audio) {
    this.save  = save;
    this.input = input;
    this.audio = audio;
    this.t = 0;
    this.nodes = [];
    MAP_NODES.forEach((list, w) => list.forEach(([x, y], l) => {
      this.nodes.push({ x, y, w, l, boss: l === C.WORLDS[w].levels - 1 });
    }));
    const start = this.nodes.findIndex(n => n.w === save.data.currentWorld && n.l === save.data.currentLevel);
    this.sel = Math.max(0, start);
    if (!this._unlocked(this.sel)) this.sel = 0;
    this.avatar = { x: this.nodes[this.sel].x, y: this.nodes[this.sel].y, hop: 0 };
    this.bgCache = null;
    this.bgScale = 0;
    this.hero = new Player(0, 0, null, null, null);
    this.hero.onGround = true;
    this.hero.gender = save.data.character || 'm';
  }

  _unlocked(i) { const n = this.nodes[i]; return this.save.isUnlocked(n.w, n.l); }
  _done(i) { const n = this.nodes[i]; return this.save.getHighScore(n.w, n.l) > 0; }

  update(dt) {
    this.t += dt;
    this.hero.t += dt;
    const inp = this.input;
    const prev = inp.wasPressed('ArrowLeft') || inp.wasPressed('KeyA') || inp.wasPressed('ArrowDown') || inp.wasPressed('KeyS');
    const next = inp.wasPressed('ArrowRight') || inp.wasPressed('KeyD') || inp.wasPressed('ArrowUp') || inp.wasPressed('KeyW');
    if (prev && this.sel > 0) { this.sel--; this.avatar.hop = 1; this.audio.sfxMenuMove(); }
    if (next) {
      if (this.sel < this.nodes.length - 1 && this._unlocked(this.sel + 1)) { this.sel++; this.avatar.hop = 1; this.audio.sfxMenuMove(); }
      else this.locked = 0.4;
    }
    if (this.locked > 0) this.locked -= dt;

    const n = this.nodes[this.sel];
    this.avatar.x += (n.x - this.avatar.x) * 0.18;
    this.avatar.y += (n.y - this.avatar.y) * 0.18;
    this.avatar.hop *= 0.88;
    const moving = Math.hypot(n.x - this.avatar.x, n.y - this.avatar.y) > 2;
    this.hero.anim.state = moving ? 'run' : 'idle';
    if (moving) this.hero.anim.run += 0.35;
    if (n.x < this.avatar.x - 1) this.hero.facing = -1; else if (n.x > this.avatar.x + 1) this.hero.facing = 1;

    if (inp.enterPressed() || inp.wasPressed('KeyE')) {
      if (this._unlocked(this.sel)) return { action: 'start', world: n.w, level: n.l };
    }
    if (inp.wasPressed('Escape')) return { action: 'back' };
    if (inp.wasPressed('KeyC')) return { action: 'character' };
    return null;
  }

  // Static map art rendered once
  _buildBg() {
    const s = Math.min(RENDER_SCALE, 2);
    const cv = document.createElement('canvas');
    cv.width = Math.ceil(C.W * s); cv.height = Math.ceil(C.H * s);
    const ctx = cv.getContext('2d');
    ctx.scale(s, s);

    // Water all around
    const sea = ctx.createLinearGradient(0, 0, 0, C.H);
    sea.addColorStop(0, '#1b5f8c'); sea.addColorStop(1, '#0f3d63');
    ctx.fillStyle = sea; ctx.fillRect(0, 0, C.W, C.H);
    ctx.strokeStyle = 'rgba(255,255,255,0.06)'; ctx.lineWidth = 1;
    for (let y = 20; y < C.H; y += 18) {
      ctx.beginPath();
      for (let x = 0; x <= C.W; x += 10) ctx.lineTo(x, y + Math.sin(x * 0.05 + y) * 2);
      ctx.stroke();
    }
    // Land mass
    ctx.beginPath();
    ctx.moveTo(30, 100);
    ctx.bezierCurveTo(200, 60, 600, 60, 780, 76);
    ctx.bezierCurveTo(800, 250, 790, 420, 770, 515);
    ctx.bezierCurveTo(500, 535, 250, 530, 28, 515);
    ctx.bezierCurveTo(10, 360, 15, 220, 30, 100);
    ctx.closePath();
    ctx.fillStyle = '#e9dcb8';
    ctx.fill();
    ctx.lineWidth = 6; ctx.strokeStyle = '#c7b48a'; ctx.stroke();
    ctx.lineWidth = 2; ctx.strokeStyle = '#7a6844'; ctx.stroke();

    // Region tints
    MAP_REGIONS.forEach((r, i) => {
      ctx.fillStyle = C.WORLDS[i].color + '33';
      ctx.strokeStyle = C.WORLDS[i].color + '99';
      ctx.lineWidth = 2;
      ctx.setLineDash([6, 5]);
      ctx.beginPath(); ctx.roundRect(r.x, r.y, r.w, r.h, 18); ctx.fill(); ctx.stroke();
      ctx.setLineDash([]);
    });
    // River
    ctx.strokeStyle = '#5bb8e8'; ctx.lineWidth = 7; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(405, 70); ctx.bezierCurveTo(390, 200, 420, 330, 400, 530); ctx.stroke();
    ctx.strokeStyle = '#9fdcff'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(405, 70); ctx.bezierCurveTo(390, 200, 420, 330, 400, 530); ctx.stroke();

    // Little landmarks per region
    const tree = (x, y) => { ctx.fillStyle = '#5a8f4e'; ctx.beginPath(); ctx.arc(x, y, 7, 0, Math.PI * 2); ctx.fill(); ctx.fillStyle = '#6b4a2e'; ctx.fillRect(x - 1, y + 5, 2, 5); };
    const house = (x, y) => { ctx.fillStyle = '#f4efe2'; ctx.fillRect(x - 7, y - 6, 14, 10); ctx.fillStyle = '#c0533a'; ctx.beginPath(); ctx.moveTo(x - 9, y - 6); ctx.lineTo(x, y - 14); ctx.lineTo(x + 9, y - 6); ctx.fill(); };
    [[60, 370], [140, 480], [300, 480], [210, 360], [370, 470]].forEach(([x, y]) => tree(x, y));
    [[120, 380], [230, 490], [300, 360]].forEach(([x, y]) => house(x, y));
    ctx.strokeStyle = '#6f8a8f'; ctx.lineWidth = 4; // pipes underground region
    ctx.beginPath(); ctx.moveTo(60, 200); ctx.lineTo(160, 200); ctx.lineTo(160, 300); ctx.moveTo(250, 140); ctx.lineTo(370, 140); ctx.stroke();
    ctx.fillStyle = '#7fa3b2'; // tanks
    for (const [x, y] of [[480, 220], [560, 240], [640, 220]]) { ctx.beginPath(); ctx.ellipse(x, y, 22, 9, 0, 0, Math.PI * 2); ctx.fill(); ctx.fillStyle = '#5fc9d8'; ctx.beginPath(); ctx.ellipse(x, y - 1, 15, 5, 0, 0, Math.PI * 2); ctx.fill(); ctx.fillStyle = '#7fa3b2'; }
    ctx.strokeStyle = '#7a5a48'; ctx.lineWidth = 2; // tower
    ctx.beginPath(); ctx.moveTo(740, 480); ctx.lineTo(748, 440); ctx.lineTo(756, 480); ctx.stroke();
    ctx.fillStyle = '#9ab4c8'; ctx.beginPath(); ctx.ellipse(748, 434, 12, 8, 0, 0, Math.PI * 2); ctx.fill();

    // Region labels
    MAP_REGIONS.forEach((r, i) => {
      ctx.font = UI.font(11);
      ctx.textAlign = 'left';
      ctx.fillStyle = 'rgba(40,30,15,0.75)';
      ctx.fillText(`W${i + 1}  ${r.label}`, r.x + 12, r.y + 18);
    });

    // Compass
    ctx.save(); ctx.translate(742, 118);
    ctx.fillStyle = 'rgba(60,45,20,0.75)';
    ctx.beginPath(); ctx.moveTo(0, -16); ctx.lineTo(5, 0); ctx.lineTo(0, 16); ctx.lineTo(-5, 0); ctx.closePath(); ctx.fill();
    ctx.font = UI.font(9); ctx.textAlign = 'center'; ctx.fillText('N', 0, -20);
    ctx.restore();

    this.bgCache = cv;
    this.bgScale = s;
  }

  draw(ctx) {
    if (!this.bgCache || this.bgScale !== Math.min(RENDER_SCALE, 2)) this._buildBg();
    ctx.drawImage(this.bgCache, 0, 0, C.W, C.H);
    const t = this.t;

    // Path between consecutive nodes
    for (let i = 0; i < this.nodes.length - 1; i++) {
      const a = this.nodes[i], b = this.nodes[i + 1];
      const open = this._unlocked(i + 1);
      ctx.lineCap = 'round';
      ctx.lineWidth = 7; ctx.strokeStyle = 'rgba(70,55,30,0.35)';
      ctx.beginPath(); ctx.moveTo(a.x, a.y + 2); ctx.lineTo(b.x, b.y + 2); ctx.stroke();
      ctx.lineWidth = 4;
      ctx.strokeStyle = open ? '#fff7dd' : 'rgba(120,105,80,0.6)';
      ctx.setLineDash(open ? [] : [5, 7]);
      ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.stroke();
      ctx.setLineDash([]);
      if (open) { // flowing water dots along unlocked paths
        const len = Math.hypot(b.x - a.x, b.y - a.y);
        for (let d = (t * 30) % 16; d < len; d += 16) {
          const k = d / len;
          ctx.fillStyle = '#56cfe1';
          ctx.beginPath(); ctx.arc(M.lerp(a.x, b.x, k), M.lerp(a.y, b.y, k), 1.6, 0, Math.PI * 2); ctx.fill();
        }
      }
    }

    // Nodes
    this.nodes.forEach((n, i) => {
      const un = this._unlocked(i), done = this._done(i), sel = i === this.sel;
      const col = C.WORLDS[n.w].color;
      const r = n.boss ? 17 : 13;
      ctx.fillStyle = 'rgba(40,30,15,0.35)';
      ctx.beginPath(); ctx.ellipse(n.x, n.y + r * 0.8, r, r * 0.35, 0, 0, Math.PI * 2); ctx.fill();
      if (sel) {
        ctx.strokeStyle = `rgba(255,255,255,${0.5 + 0.5 * Math.sin(t * 5)})`;
        ctx.lineWidth = 3;
        ctx.beginPath(); ctx.arc(n.x, n.y, r + 6 + Math.sin(t * 5) * 1.5, 0, Math.PI * 2); ctx.stroke();
      }
      const g = ctx.createRadialGradient(n.x - r * 0.4, n.y - r * 0.4, 1, n.x, n.y, r);
      g.addColorStop(0, un ? '#ffffff' : '#9a9a9a');
      g.addColorStop(0.35, un ? (n.boss ? '#e74c3c' : col) : '#6f6f6f');
      g.addColorStop(1, un ? (n.boss ? '#7a1d14' : '#0d2137') : '#3a3a3a');
      ctx.fillStyle = g;
      ctx.beginPath(); ctx.arc(n.x, n.y, r, 0, Math.PI * 2); ctx.fill();
      ctx.lineWidth = 2; ctx.strokeStyle = '#1b1408'; ctx.stroke();
      if (!un) { // padlock
        ctx.strokeStyle = '#e8e8e8'; ctx.lineWidth = 1.6;
        ctx.beginPath(); ctx.arc(n.x, n.y - 2, 3.4, Math.PI, 0); ctx.stroke();
        ctx.fillStyle = '#e8e8e8'; ctx.fillRect(n.x - 5, n.y - 2, 10, 7);
      } else if (n.boss) {
        UI.text(ctx, '!', n.x, n.y + 6, { size: 17, align: 'center', color: '#fff', outline: '#5a0f18' });
      } else {
        UI.text(ctx, String(n.l + 1), n.x, n.y + 5, { size: 13, align: 'center', color: '#fff', outline: '#0d2137' });
      }
      if (done) { // gold star badge
        ctx.save(); ctx.translate(n.x + r * 0.8, n.y - r * 0.8);
        ctx.fillStyle = '#ffd34d'; ctx.strokeStyle = '#6b4a00'; ctx.lineWidth = 1;
        ctx.beginPath();
        for (let k = 0; k < 10; k++) { const a = -Math.PI / 2 + k * Math.PI / 5, rr = k % 2 ? 2.6 : 6; ctx.lineTo(Math.cos(a) * rr, Math.sin(a) * rr); }
        ctx.closePath(); ctx.fill(); ctx.stroke();
        ctx.restore();
      }
    });

    // Avatar: the worker hops between nodes
    const av = this.avatar;
    const hop = Math.sin(av.hop * Math.PI) * 10;
    ctx.save();
    ctx.translate(av.x, av.y - 10 - hop);
    ctx.scale(this.hero.facing * 1.15, 1.15);
    this.hero._drawBody(ctx);
    ctx.restore();

    // Header
    UI.panel(ctx, C.W / 2 - 150, 12, 300, 40, 20, 'rgba(10,28,48,0.88)');
    UI.text(ctx, 'SJWD SERVICE AREA', C.W / 2, 38, { size: 18, align: 'center', color: '#9ff3e4' });
    UI.panel(ctx, 14, 14, 120, 34, 17, 'rgba(10,28,48,0.88)');
    UI.droplet(ctx, 34, 31, 0.9);
    UI.text(ctx, `${this.save.data.coinsTotal}`, 48, 37, { size: 14 });
    const cleared = this.nodes.filter((_, i) => this._done(i)).length;
    UI.panel(ctx, C.W - 134, 14, 120, 34, 17, 'rgba(10,28,48,0.88)');
    UI.text(ctx, `★ ${cleared}/${this.nodes.length}`, C.W - 74, 37, { size: 14, align: 'center', color: '#ffd34d' });

    // Info card for the selected level
    const n = this.nodes[this.sel];
    const w = C.WORLDS[n.w];
    const best = this.save.getHighScore(n.w, n.l);
    const cx = M.clamp(n.x, 140, C.W - 140);
    const cy = n.y > 200 ? n.y - 122 : n.y + 32;
    UI.panel(ctx, cx - 124, cy, 248, 56, 10, 'rgba(10,28,48,0.92)', w.color);
    UI.text(ctx, n.boss ? `BOSS · ${BOSS_STYLES[n.w].name}` : `LEVEL ${n.w + 1}-${n.l + 1}`, cx, cy + 22, { size: 14, align: 'center', color: n.boss ? '#ff8a7a' : '#ffffff' });
    UI.text(ctx, best ? `Best ${String(best).padStart(7, '0')}` : (this.locked > 0 ? 'Clear this level to go on!' : 'Not cleared yet'),
      cx, cy + 42, { size: 11, align: 'center', color: best ? '#ffd34d' : 'rgba(210,225,235,0.8)', outline: null });

    UI.panel(ctx, C.W / 2 - 240, C.H - 30, 480, 24, 12, 'rgba(10,28,48,0.85)');
    UI.keys(ctx, [['← →', 'travel'], ['ENTER', 'play'], ['C', 'worker'], ['ESC', 'title']], C.W / 2, C.H - 13);
  }
}
